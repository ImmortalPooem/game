/* ============ 玩家绘制 ============ */
function drawPlayer(){
  const bob = P.moving ? Math.abs(Math.sin(P.anim))*3 : 0;
  const flyOffset = P.flying > 0 ? 12 + Math.sin(state.t*14)*3 : 0;
  ctx.save();
  ctx.translate(P.x, P.y);
  if(state.shield > 0){
    const shPulse = 0.7 + Math.sin(state.t*6)*0.3;
    ctx.strokeStyle = `rgba(255,240,150,${0.5*shPulse})`;
    ctx.fillStyle = `rgba(255,240,150,${0.12*shPulse})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -26, 40, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,0,15,6,0,0,7); ctx.fill();
  if(P.flying > 0){
    ctx.save(); ctx.translate(0, 2);
    ctx.shadowColor = 'rgba(150,230,255,.95)'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#e8faff';
    ctx.beginPath(); ctx.moveTo(-32,0); ctx.lineTo(-6,3); ctx.lineTo(26,0); ctx.lineTo(-6,-3); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
  }
  const g = ctx.createRadialGradient(0,-30,2,0,-30,42);
  g.addColorStop(0,'rgba(160,230,250,.25)');
  g.addColorStop(0.6,'rgba(140,200,230,.08)');
  g.addColorStop(1,'rgba(140,200,230,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-30,42,0,7); ctx.fill();
  ctx.translate(0, -flyOffset);
  const y0 = -bob;
  ctx.fillStyle = '#35597e';
  ctx.beginPath();
  ctx.moveTo(-12,-2); ctx.lineTo(12,-2); ctx.lineTo(9,-36+y0); ctx.lineTo(-9,-36+y0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(150,210,240,.28)'; ctx.fillRect(-3.5,-34+y0,7,29);
  ctx.fillStyle = '#c8a45c'; ctx.fillRect(-11,-16+y0,22,3);
  ctx.fillStyle = '#e4d4ac';
  ctx.beginPath(); ctx.moveTo(-6,-36+y0); ctx.lineTo(6,-36+y0); ctx.lineTo(0,-28+y0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f0d4ac'; ctx.beginPath(); ctx.arc(0,-46+y0,9,0,7); ctx.fill();
  ctx.fillStyle = '#1a1c26';
  ctx.beginPath(); ctx.arc(0,-48+y0,9.5, Math.PI*1.02, Math.PI*1.98); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-57+y0,4.8,0,7); ctx.fill();
  if(P.dir !== 3){
    ctx.fillStyle = '#1a1a1a';
    const off = P.dir === 1 ? -2.2 : P.dir === 2 ? 2.2 : 0;
    ctx.beginPath(); ctx.arc(-3+off,-46+y0,1.4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc( 3+off,-46+y0,1.4,0,7); ctx.fill();
  }
  if(P.swing > 0) drawSwordInLocal();
  ctx.restore();
}
function drawSwordInLocal(){
  const total = 0.26;
  const prog = 1 - P.swing / total;
  const eased = 1 - Math.pow(1 - prog, 2.4);
  const base = P.swingAngle;
  const sweep = Math.PI * 1.0;
  const side = P.swingSide;
  const start = base - sweep/2 * side;
  const cur = start + sweep * eased * side;
  ctx.save();
  ctx.translate(0, -28);
  const trailA = Math.pow(1 - prog, 0.6);
  ctx.globalAlpha = trailA * 0.55;
  const g = ctx.createRadialGradient(0,0,12,0,0,95);
  g.addColorStop(0,'rgba(180,230,255,0)');
  g.addColorStop(0.5,'rgba(210,240,255,0.45)');
  g.addColorStop(1,'rgba(240,250,255,0)');
  ctx.fillStyle = g;
  const a1 = Math.min(start, cur), a2 = Math.max(start, cur);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,95, a1, a2); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = trailA * 0.9;
  ctx.strokeStyle = 'rgba(240,250,255,0.9)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0,0,92, a1, a2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.rotate(cur);
  ctx.shadowColor = 'rgba(150,220,255,0.95)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#f2faff';
  ctx.beginPath(); ctx.moveTo(16,-3); ctx.lineTo(80,0); ctx.lineTo(16,3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(130,200,240,1)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(78,0); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#c8a45c'; ctx.fillRect(11,-6,6,12);
  ctx.fillStyle = '#7a5432'; ctx.fillRect(-8,-3,20,6);
  ctx.fillStyle = '#c8a45c';
  ctx.beginPath(); ctx.arc(-9,0,3.5,0,7); ctx.fill();
  ctx.restore();
}

/* ============ 小怪绘制 ============ */
function drawEnemyBody(e, t, w){
  const c = e.color;
  const breath = 1 + Math.sin(t*3 + e.breath) * 0.05;
  ctx.save(); ctx.scale(breath, breath);
  switch(e.kind){
    case 'wolf': {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(0,-14+w,16,10,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(13,-20+w,8,7,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9,-26+w); ctx.lineTo(11,-34+w); ctx.lineTo(15,-26+w); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(16,-26+w); ctx.lineTo(19,-34+w); ctx.lineTo(21,-26+w); ctx.closePath(); ctx.fill();
      ctx.fillRect(-13,-8+w,4,10); ctx.fillRect(-5,-8+w,4,10);
      ctx.fillRect(5,-8+w,4,10); ctx.fillRect(11,-8+w,4,10);
      const tailS = Math.sin(t*5 + e.seed) * 4;
      ctx.beginPath(); ctx.moveTo(-15,-16+w); ctx.quadraticCurveTo(-26+tailS,-24+w,-20,-8+w); ctx.lineTo(-15,-12+w); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff4a3a'; ctx.shadowColor = '#ff4a3a'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(16,-21+w,1.9,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'snake': {
      ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-18, 2);
      for(let i=0;i<4;i++){
        const px = -18 + i*9;
        const py = 2 - i*2 + Math.sin(t*3+e.seed+i)*3.5;
        ctx.lineTo(px, py);
      }
      ctx.quadraticCurveTo(14, -4, 18, -22 + Math.sin(t*3+e.seed+1)*3);
      ctx.stroke();
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(19,-26+w,7,6,0.3,0,7); ctx.fill();
      ctx.fillStyle = '#ffe23a'; ctx.shadowColor = '#ffe23a'; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(20,-28+w,1.8,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'ape': {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(0,-12+w,15,13,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-14,-16+w,5,11,-0.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(14,-16+w,5,11,0.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-28+w,8,0,7); ctx.fill();
      ctx.fillStyle = '#ffd23a';
      ctx.beginPath(); ctx.arc(-3,-30+w,1.7,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(3,-30+w,1.7,0,7); ctx.fill();
      break;
    }
    case 'cult': {
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(-12,-2); ctx.lineTo(12,-2); ctx.lineTo(8,-28+w); ctx.lineTo(-8,-28+w);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8cba4';
      ctx.beginPath(); ctx.arc(0,-36+w,7,0,7); ctx.fill();
      ctx.fillStyle = '#3a3040';
      ctx.beginPath(); ctx.moveTo(-16,-36+w); ctx.lineTo(0,-52+w); ctx.lineTo(16,-36+w); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.arc(-2.5,-37+w,1.5,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(2.5,-37+w,1.5,0,7); ctx.fill();
      break;
    }
    case 'ghost': {
      const wob = Math.sin(t*2.4+e.seed)*3;
      ctx.globalAlpha = ctx.globalAlpha * 0.82;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(-12,-14+w+wob);
      ctx.quadraticCurveTo(-16,-34+w+wob,0,-38+w+wob);
      ctx.quadraticCurveTo(16,-34+w+wob,12,-14+w+wob);
      ctx.quadraticCurveTo(8,-6+w+wob,4,-14+w+wob);
      ctx.quadraticCurveTo(0,-6+w+wob,-4,-14+w+wob);
      ctx.quadraticCurveTo(-8,-6+w+wob,-12,-14+w+wob);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b8f0ff';
      ctx.beginPath(); ctx.arc(-4,-26+w+wob,2.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(4,-26+w+wob,2.3,0,7); ctx.fill();
      break;
    }
    case 'golem': {
      ctx.fillStyle = c;
      ctx.fillRect(-13,-14+w,10,14);
      ctx.fillRect(3,-14+w,10,14);
      ctx.beginPath();
      ctx.moveTo(-15,-12+w); ctx.lineTo(-11,-34+w); ctx.lineTo(9,-36+w);
      ctx.lineTo(15,-18+w); ctx.lineTo(10,-12+w);
      ctx.closePath(); ctx.fill();
      const glow = 0.6 + Math.sin(t*4 + e.seed)*0.4;
      ctx.fillStyle = `rgba(255,207,90,${glow})`;
      ctx.beginPath(); ctx.arc(-4,-26+w,2.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(4,-26+w,2.3,0,7); ctx.fill();
      break;
    }
    case 'crow': {
      const flap = Math.sin(t*9+e.seed) * 7;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(0,-20+w,10,9,0,0,7); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-6,-24+w); ctx.quadraticCurveTo(-24,-30+w-flap,-18,-14+w);
      ctx.quadraticCurveTo(-10,-18+w,-6,-20+w); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(6,-24+w); ctx.quadraticCurveTo(24,-30+w-flap,18,-14+w);
      ctx.quadraticCurveTo(10,-18+w,6,-20+w); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffb040';
      ctx.beginPath(); ctx.moveTo(-2,-33+w); ctx.lineTo(0,-28+w); ctx.lineTo(2,-33+w); ctx.closePath(); ctx.fill();
      break;
    }
    case 'vine': {
      ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineWidth = 4;
      for(let i=0;i<4;i++){
        const a = -Math.PI/2 + (i-1.5)*0.5;
        const len = 26 + Math.sin(t*2.5+e.seed+i)*5;
        ctx.beginPath();
        ctx.moveTo(0,-6+w);
        ctx.quadraticCurveTo(
          Math.cos(a)*len*0.6 + Math.sin(t*3+i)*4,
          -6 + Math.sin(a)*len*0.6 + w,
          Math.cos(a)*len,
          -6 + Math.sin(a)*len + w
        );
        ctx.stroke();
      }
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(0,-16+w,11,10,0,0,7); ctx.fill();
      ctx.fillStyle = '#ffe23a';
      ctx.beginPath(); ctx.arc(-3,-16+w,1.7,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(3,-16+w,1.7,0,7); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

/* ============ BOSS 绘制：4 种完全不同（修复 v13 全部相同的 bug） ============ */
function drawBossBody(e, t, w){
  const c = e.color;
  const breath = 1 + Math.sin(t*2 + e.breath) * 0.03;
  ctx.save(); ctx.scale(breath, breath);

  switch(e.kind){
    case 'b_wolf': {
      // ===== 赤焰妖王：巨型四足狼形，火焰鬃毛环绕 =====
      // 火焰鬃毛
      for(let i=0;i<11;i++){
        const a = -Math.PI*0.9 + i*(Math.PI*1.8/10);
        const fl = 0.4 + Math.sin(t*7+i*0.7)*0.3;
        ctx.fillStyle = `rgba(255,${100+Math.floor(Math.random()*60)},40,${fl})`;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*24, -34 + Math.sin(a)*24, 9, 0, 7);
        ctx.fill();
      }
      // 身体
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(0,-26+w,28,18,0,0,7); ctx.fill();
      // 毛发细节
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1.4;
      for(let i=0;i<5;i++){
        const px = -18 + i*9;
        ctx.beginPath(); ctx.moveTo(px,-36+w); ctx.lineTo(px-2,-22+w); ctx.stroke();
      }
      // 头
      ctx.beginPath(); ctx.ellipse(24,-38+w,14,12,0,0,7); ctx.fill();
      // 双耳
      ctx.beginPath(); ctx.moveTo(16,-48+w); ctx.lineTo(20,-62+w); ctx.lineTo(28,-48+w); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(28,-48+w); ctx.lineTo(34,-62+w); ctx.lineTo(38,-48+w); ctx.closePath(); ctx.fill();
      // 四肢
      ctx.fillRect(-24,-14+w,7,16); ctx.fillRect(-10,-14+w,7,16);
      ctx.fillRect(8,-14+w,7,16); ctx.fillRect(20,-14+w,7,16);
      // 尾
      const tailS = Math.sin(t*4)*6;
      ctx.beginPath(); ctx.moveTo(-28,-30+w); ctx.quadraticCurveTo(-48+tailS,-44+w,-38,-12+w); ctx.lineTo(-28,-22+w); ctx.closePath(); ctx.fill();
      // 眼
      ctx.fillStyle = '#ff2a1a'; ctx.shadowColor = '#ff4020'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(28,-40+w,3.8,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'b_general': {
      // ===== 幽冥魔将：铠甲人形、披风、长枪 =====
      const sway = Math.sin(t*2)*4;
      // 披风
      ctx.fillStyle = 'rgba(80,40,140,.75)';
      ctx.beginPath();
      ctx.moveTo(-26,-44+w); ctx.quadraticCurveTo(-40+sway,-16+w,-30,2);
      ctx.lineTo(30,2); ctx.quadraticCurveTo(40-sway,-16+w,26,-44+w);
      ctx.closePath(); ctx.fill();
      // 披风纹理
      ctx.strokeStyle = 'rgba(140,90,220,.4)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-22,-40+w); ctx.lineTo(-24,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(22,-40+w); ctx.lineTo(24,0); ctx.stroke();
      // 铠甲
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(-18,-44+w); ctx.lineTo(18,-44+w); ctx.lineTo(14,-4+w); ctx.lineTo(-14,-4+w);
      ctx.closePath(); ctx.fill();
      // 铠甲纹
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-14,-30+w); ctx.lineTo(14,-30+w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-12,-16+w); ctx.lineTo(12,-16+w); ctx.stroke();
      // 肩甲
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(-18,-44+w,9,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(18,-44+w,9,0,7); ctx.fill();
      // 头盔
      ctx.fillStyle = '#3a2a5a';
      ctx.beginPath(); ctx.arc(0,-56+w,14,0,7); ctx.fill();
      // 双角
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.moveTo(-10,-64+w); ctx.lineTo(-18,-86+w); ctx.lineTo(-4,-68+w); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10,-64+w); ctx.lineTo(18,-86+w); ctx.lineTo(4,-68+w); ctx.closePath(); ctx.fill();
      // 眼
      ctx.fillStyle = '#ff4ad0'; ctx.shadowColor = '#ff4ad0'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(-5,-56+w,3.4,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(5,-56+w,3.4,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      // 长枪
      ctx.strokeStyle = '#c8a45c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(26,-70+w); ctx.lineTo(34,4); ctx.stroke();
      ctx.fillStyle = '#e8e8ff';
      ctx.beginPath(); ctx.moveTo(26,-70+w); ctx.lineTo(22,-88+w); ctx.lineTo(30,-88+w); ctx.lineTo(34,-70+w); ctx.closePath(); ctx.fill();
      const gl = 0.5 + Math.sin(t*5)*0.5;
      ctx.fillStyle = `rgba(255,180,255,${gl})`;
      ctx.shadowColor = '#ffb8ff'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(28,-80+w,3,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'b_tree': {
      // ===== 千年树妖：巨大树干、树冠、树枝手臂 =====
      // 树干
      ctx.fillStyle = '#3a2a18';
      ctx.beginPath();
      ctx.moveTo(-16,2); ctx.lineTo(-12,-52+w); ctx.lineTo(12,-52+w); ctx.lineTo(16,2);
      ctx.closePath(); ctx.fill();
      // 树纹
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-6,-8); ctx.lineTo(-4,-44+w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6,-4); ctx.lineTo(5,-42+w); ctx.stroke();
      // 树冠（7 团）
      const sway = Math.sin(t*1.2)*3;
      for(let i=0;i<7;i++){
        const a = -Math.PI*0.9 + i*(Math.PI*0.8/6);
        const rr = 26 + Math.sin(t*1.5+i)*4;
        ctx.fillStyle = i%2 ? c : '#5a8a3a';
        ctx.beginPath();
        ctx.arc(Math.cos(a)*18 + sway, -58+w + Math.sin(a)*10, rr*0.55, 0, 7);
        ctx.fill();
      }
      // 树枝手臂
      ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-12,-44+w); ctx.quadraticCurveTo(-32,-56+w,-38,-34+w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12,-44+w); ctx.quadraticCurveTo(32,-56+w,38,-34+w); ctx.stroke();
      // 树干上的眼睛
      ctx.fillStyle = '#aaff3a'; ctx.shadowColor = '#7fff20'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(-6,-30+w,3.8,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(6,-30+w,3.8,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'b_blood': {
      // ===== 血魔老祖：血雾、四臂人形、长发 =====
      const pulse = 0.9 + Math.sin(t*3) * 0.1;
      // 血雾
      const g0 = ctx.createRadialGradient(0,-30+w,4,0,-30+w,54*pulse);
      g0.addColorStop(0,'rgba(255,40,80,.45)');
      g0.addColorStop(1,'rgba(255,40,80,0)');
      ctx.fillStyle = g0;
      ctx.beginPath(); ctx.arc(0,-30+w,54*pulse,0,7); ctx.fill();
      // 袍
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(-20,-6); ctx.lineTo(20,-6); ctx.lineTo(14,-48+w); ctx.lineTo(-14,-48+w);
      ctx.closePath(); ctx.fill();
      // 袍纹
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(0,-46+w); ctx.lineTo(0,-8); ctx.stroke();
      // 四臂挥动
      ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.lineCap = 'round';
      for(let i=0;i<2;i++){
        const sw = Math.sin(t*2.4+i*2+e.seed)*8;
        ctx.beginPath(); ctx.moveTo(-14,-38+w); ctx.quadraticCurveTo(-34,-46+w+sw,-40,-26+w+sw); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(14,-38+w); ctx.quadraticCurveTo(34,-46+w-sw,40,-26+w-sw); ctx.stroke();
      }
      // 头
      ctx.fillStyle = '#e8cba4';
      ctx.beginPath(); ctx.arc(0,-58+w,10,0,7); ctx.fill();
      // 长发
      ctx.fillStyle = '#2a0a14';
      ctx.beginPath(); ctx.arc(0,-60+w,10.5, Math.PI*1.02, Math.PI*1.98); ctx.fill();
      // 眼
      ctx.fillStyle = '#ff2a4a'; ctx.shadowColor = '#ff2050'; ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(-3.5,-58+w,2.9,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(3.5,-58+w,2.9,0,7); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
  }
  ctx.restore();
}
function drawEnemy(e){
  const alpha = e.dead ? Math.max(0, e.deadTimer / (e.elite?0.95:0.55)) : 1;
  const wob = Math.sin(state.t*6 + e.seed)*2;
  const scale = e.elite ? 3.6 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(e.x, e.y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,0, e.elite?28:15, e.elite?10:6, 0,0,7); ctx.fill();
  const glowR = e.elite ? 85 : 30;
  const g = ctx.createRadialGradient(0,-30,3,0,-30,glowR);
  g.addColorStop(0, e.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-30,glowR,0,7); ctx.fill();
  if(e.frozen > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(160,230,255,.42)';
    ctx.beginPath(); ctx.ellipse(0,-22+wob,20,26,0,0,7); ctx.fill();
    ctx.strokeStyle = 'rgba(220,250,255,.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0,-22+wob,20,26,0,0,7); ctx.stroke();
    ctx.restore();
  }
  if(e.elite) drawBossBody(e, state.t, wob);
  else drawEnemyBody(e, state.t, wob);
  if(e.chasing && !e.dead){
    ctx.strokeStyle = e.elite ? 'rgba(255,80,180,.55)' : 'rgba(255,120,90,.5)';
    ctx.lineWidth = e.elite ? 2.4 : 1.8;
    ctx.beginPath(); ctx.arc(0,-20, e.elite?36:20, 0, 7); ctx.stroke();
  }
  ctx.restore();
  if(!e.dead && !e.elite && e.hp < e.maxHp){
    const w = 32, h = 4;
    const bx = e.x - w/2, by = e.y - 56;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(bx-1, by-1, w+2, h+2);
    ctx.fillStyle = '#5a2020'; ctx.fillRect(bx, by, w, h);
    ctx.fillStyle = '#e8705a';
    ctx.fillRect(bx, by, w * Math.max(0, e.hp/e.maxHp), h);
  }
  if(e.hitFlash > 0 && !e.dead){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, e.hitFlash * 4)})`;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y - (e.elite?60:16), e.elite?56:18, e.elite?56:16, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ============ 剑阵 / 飞剑 / 特效 ============ */
function drawSwordArray(){
  if(!isSwordArrayOn()) return;
  const n = isSwordGod() ? 5 : 3;
  const radius = 58;
  for(let i = 0; i < n; i++){
    const ang = state.swordAngle + i * (Math.PI*2 / n);
    const sx = P.x + Math.cos(ang) * radius;
    const sy = P.y - 26 + Math.sin(ang) * radius * 0.55;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang + Math.PI/2);
    ctx.shadowColor = isSwordGod() ? 'rgba(255,220,120,.95)' : 'rgba(150,230,255,.9)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = isSwordGod() ? '#fff0c0' : '#e0f6ff';
    ctx.beginPath();
    ctx.moveTo(0,-13); ctx.lineTo(3,6); ctx.lineTo(0,12); ctx.lineTo(-3,6);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = isSwordGod() ? 'rgba(255,180,60,.9)' : 'rgba(100,200,255,.9)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(0,10); ctx.stroke();
    ctx.restore();
  }
}
function drawProjectiles(){
  for(const pr of projectiles){
    ctx.save();
    ctx.translate(pr.x, pr.y);
    ctx.rotate(Math.atan2(pr.vy, pr.vx) + Math.PI/2);
    ctx.shadowColor = `rgba(${pr.color},1)`; ctx.shadowBlur = 12;
    ctx.fillStyle = `rgba(${pr.color},1)`;
    ctx.beginPath();
    ctx.moveTo(0,-13); ctx.lineTo(3,5); ctx.lineTo(0,11); ctx.lineTo(-3,5);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}
function drawBeams(){
  for(const b of beams){
    const a = b.life / b.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = `rgba(${b.color},1)`;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = `rgba(${b.color},1)`; ctx.shadowBlur = 16;
    ctx.beginPath();
    for(let i = 0; i <= b.segs; i++){
      const tt = i / b.segs;
      let x = b.x1 + (b.x2 - b.x1) * tt;
      let y = b.y1 + (b.y2 - b.y1) * tt;
      if(i > 0 && i < b.segs){ x += rnd(-b.jitter, b.jitter); y += rnd(-b.jitter, b.jitter); }
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = a * 0.6;
    ctx.lineWidth = 8;
    ctx.strokeStyle = `rgba(${b.color},0.5)`;
    ctx.stroke();
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of particles){
    const a = p.life / p.maxLife;
    if(p.type === 'dot'){
      const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = `rgb(${p.color})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
      ctx.globalAlpha = a * 0.95;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45;
      ctx.lineCap = 'round';
      ctx.shadowColor = `rgba(${p.color},0.95)`; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      ctx.shadowColor = `rgba(${p.color},0.95)`; ctx.shadowBlur = 8;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}
function drawEffects(){
  for(const fx of effects){
    const t = fx.life / fx.maxLife;
    if(fx.type === 'fan'){
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = t * 0.7;
      ctx.fillStyle = `rgba(${fx.color},0.5)`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, fx.range, -fx.halfAngle, fx.halfAngle);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},0.95)`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, fx.range * (0.85 + (1-t)*0.15), -fx.halfAngle, fx.halfAngle);
      ctx.stroke();
      ctx.restore();
    } else if(fx.type === 'ring'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},0.9)`;
      ctx.lineWidth = 4;
      ctx.shadowColor = `rgba(${fx.color},0.9)`; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = t * 0.22;
      ctx.fillStyle = `rgba(${fx.color},1)`;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.fill();
    } else if(fx.type === 'shockwave'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t * 0.9;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * t + 1;
      ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = t * 0.14;
      ctx.fillStyle = `rgba(${fx.color},1)`;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.fill();
    } else if(fx.type === 'beam'){
      ctx.save();
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * t * 0.6 + 4;
      ctx.lineCap = 'round';
      ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2);
      ctx.stroke();
      ctx.lineWidth = fx.width * t * 0.3 + 1;
      ctx.strokeStyle = `rgba(255,255,255,${t})`;
      ctx.beginPath();
      ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}
function drawDomain(){
  if(state.domain <= 0) return;
  const R = state.domainRadius;
  const c = state.domainColor || '255,220,140';
  const pulse = 0.85 + Math.sin(state.t * 6) * 0.12;
  ctx.save();
  ctx.globalAlpha = 0.18 * pulse;
  const bg = ctx.createRadialGradient(P.x, P.y + 4, 10, P.x, P.y + 4, R);
  bg.addColorStop(0, `rgba(${c}, 0.7)`);
  bg.addColorStop(0.6, `rgba(${c}, 0.35)`);
  bg.addColorStop(1, `rgba(${c}, 0)`);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.fill();
  for (let i = 0; i < 3; i++) {
    const rot = state.t * (1.0 + i * 0.4) * (i % 2 ? 1 : -1);
    ctx.globalAlpha = 0.5 * pulse;
    ctx.strokeStyle = `rgba(${c}, 0.9)`;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([16 + i*4, 12 + i*3]);
    ctx.lineDashOffset = -rot * 40;
    const rr = R * (0.85 - i * 0.13);
    ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, rr, rr * 0.62, rot * 0.05, 0, 7); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.9 * pulse;
  ctx.strokeStyle = `rgba(${c}, 1)`;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = `rgba(${c},1)`; ctx.shadowBlur = 22;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}
function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const f of floats){
    const a = f.life / f.maxLife;
    const pop = 1 + Math.sin(Math.min(1, (1-a)*3) * Math.PI) * 0.28;
    const fs = (f.big ? 21 : 17) * pop;
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.font = `bold ${fs.toFixed(1)}px "Songti SC","STSong",serif`;
    ctx.strokeStyle = 'rgba(0,0,0,0.82)';
    ctx.lineWidth = f.big ? 4.5 : 3.6;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
const motes = [];
for(let i=0;i<60;i++){
  motes.push({ x:Math.random(), y:Math.random(),
    s:Math.random()*1.8+0.8, v:Math.random()*0.02+0.008,
    a:Math.random()*0.55+0.25 });
}
function drawMotes(dt){
  for(const m of motes){
    m.y -= m.v * dt;
    if(m.y < -0.02){ m.y = 1.02; m.x = Math.random(); }
    ctx.fillStyle = `rgba(180,255,230,${m.a})`;
    ctx.beginPath(); ctx.arc(m.x*W, m.y*H, m.s, 0, 7); ctx.fill();
  }
}
function collectVisibleProps(){
  const cx0 = Math.floor((state.camX - 120) / CELL);
  const cx1 = Math.floor((state.camX + W + 120) / CELL);
  const cy0 = Math.floor((state.camY - 160) / CELL);
  const cy1 = Math.floor((state.camY + H + 120) / CELL);
  const out = [];
  if(!isFinite(cx0) || !isFinite(cx1) || !isFinite(cy0) || !isFinite(cy1)) return out;
  if(cx1 - cx0 > 30 || cy1 - cy0 > 30) return out;
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const c = getChunk(cx, cy);
      for(const p of c.props) out.push(p);
    }
  }
  return out;
}
function collectVisibleLakes(){
  const lx0 = Math.floor((state.camX - 200) / LAKE_CELL);
  const lx1 = Math.floor((state.camX + W + 200) / LAKE_CELL);
  const ly0 = Math.floor((state.camY - 200) / LAKE_CELL);
  const ly1 = Math.floor((state.camY + H + 200) / LAKE_CELL);
  const out = [];
  if(!isFinite(lx0) || !isFinite(lx1) || !isFinite(ly0) || !isFinite(ly1)) return out;
  if(lx1 - lx0 > 20 || ly1 - ly0 > 20) return out;
  for(let ly = ly0; ly <= ly1; ly++){
    for(let lx = lx0; lx <= lx1; lx++){
      const lake = lakeAt(lx, ly);
      if(lake) out.push(lake);
    }
  }
  return out;
}

/* ============ 渲染 ============ */
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx = 0, sy = 0;
  if(state.shakeT > 0){
    const k = state.shakeT / 0.12;
    sx = (Math.random()-0.5) * state.shakeMag * k * 2;
    sy = (Math.random()-0.5) * state.shakeMag * k * 2;
  }
  const camX = state.camX - sx, camY = state.camY - sy;
  ctx.save();
  ctx.translate(-camX, -camY);
  drawGround();
  for(const lake of collectVisibleLakes()) drawLake(lake);
  for(const h of state.herbs){
    if(!h.alive) continue;
    if(h.x < camX-60 || h.x > camX+W+60 || h.y < camY-60 || h.y > camY+H+60) continue;
    drawHerb(h);
  }
  drawDomain();
  for(const fx of effects){
    if(fx.type === 'ring' || fx.type === 'shockwave'){
      const t = fx.life / fx.maxLife;
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t * 0.22;
      ctx.fillStyle = `rgba(${fx.color},1)`;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  for(const p of particles){
    if(p.type !== 'dot') continue;
    const a = p.life / p.maxLife;
    const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
    ctx.globalAlpha = a * 0.3;
    ctx.fillStyle = `rgb(${p.color})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
    ctx.globalAlpha = a * 0.95;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const propsList = collectVisibleProps();
  const list = [];
  for(const p of propsList){
    if(p.x < camX-80 || p.x > camX+W+80 || p.y < camY-160 || p.y > camY+H+80) continue;
    list.push({ y: p.y, kind: 0, ref: p });
  }
  // 地标：判断屏幕范围时要留出更大的空间，因为有的地标 r 高达 180
  for(const lm of state.landmarks){
    const screenPad = lm.r * 3;
    if(lm.x < camX - screenPad || lm.x > camX + W + screenPad ||
       lm.y < camY - screenPad * 2 || lm.y > camY + H + screenPad) continue;
    list.push({ y: lm.y, kind: 3, ref: lm });
  }
  for(const e of state.enemies){
    if(!isNum(e.x) || !isNum(e.y)) continue;
    if(e.x < camX-120 || e.x > camX+W+120 || e.y < camY-160 || e.y > camY+H+120) continue;
    list.push({ y: e.y, kind: 1, ref: e });
  }
  list.push({ y: P.y, kind: 2, ref: null });
  list.sort((a,b) => a.y - b.y);
  for(const o of list){
    if(o.kind === 0) drawPropByType(o.ref);
    else if(o.kind === 1) drawEnemy(o.ref);
    else if(o.kind === 2) drawPlayer();
    else if(o.kind === 3) drawLandmark(o.ref);
  }
  drawSwordArray();
  drawProjectiles();
  drawBeams();
  for(const p of particles){
    if(p.type === 'dot') continue;
    const a = p.life / p.maxLife;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45;
      ctx.lineCap = 'round';
      ctx.shadowColor = `rgba(${p.color},0.95)`; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      ctx.shadowColor = `rgba(${p.color},0.95)`; ctx.shadowBlur = 8;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  drawEffects();
  drawFloats();
  ctx.restore();
  const bio = BIOMES[state.biome] || BIOMES[0];
  ctx.fillStyle = bio.tint;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = 'rgba(40,70,55,0.10)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';
  drawMotes(dt);
  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);
}

function updateBossBar(){
  let boss = null, bd = 1e9;
  for(const e of state.enemies){
    if(e.dead || !e.elite) continue;
    const screenX = e.x - state.camX;
    const screenY = e.y - state.camY;
    if(screenX < -80 || screenX > W + 80 || screenY < -80 || screenY > H + 80) continue;
    const d = Math.hypot(e.x-P.x, e.y-P.y);
    if(d < bd){ bd = d; boss = e; }
  }
  const bar = $('bossBar');
  if(!bar) return;
  if(boss){
    bar.style.display = 'flex';
    const bn = $('bossName'); if(bn) bn.textContent = boss.name;
    const pct = Math.max(0, boss.hp / boss.maxHp);
    const bf = $('bossHpFill'); if(bf) bf.style.width = (pct * 100).toFixed(1) + '%';
    const bt = $('bossHpText');
    if(bt) bt.textContent = fmt(Math.max(0, boss.hp)) + ' / ' + fmt(boss.maxHp) + '　' + Math.round(pct * 100) + '%';
  } else {
    bar.style.display = 'none';
  }
}

/* ============ 突破（自动） ============ */
function tryBreak(){
  if(!state.started || isMaxLv()) return;
  const need = qiNeed();
  if(G.qi < need) return;
  G.qi -= need;
  G.layer++;
  if(G.layer > MAX_LAYER){ G.layer = 1; G.realm++; }
  if(G.realm > MAX_REALM){ G.realm = MAX_REALM; G.layer = MAX_LAYER; }
  recalc(); G.hp = G.maxHp; G.mp = G.maxMp;
  refreshUnlockedSkills();
  const lv = totalLv();
  const msgs = { 9:'筑基于身，御剑术已成！', 12:'金丹在望，离火焚天！',
    18:'金丹凝成，回春妙法通，剑阵自成！', 22:'万剑归宗，剑阵大成！',
    27:'元婴出窍，雷霆万钧！', 31:'冰封千里，万物凝滞！', 36:'化神之境，太虚剑域笼罩天地！' };
  if(msgs[lv]) toast(msgs[lv]); else toast('突破 · ' + realmText());
  screenFlash('rgba(255,230,160,.5)', 420);
  shake(5, 0.2);
  for(let k = 0; k < 46; k++){
    const a = Math.random() * Math.PI * 2;
    const sp = rnd(100, 340);
    addParticle(P.x, P.y - 26, {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 80,
      life: rnd(0.6, 1.3), size: rnd(3, 7),
      color: '255,220,140', type: 'dot', drag: 0.94, grow: 4
    });
  }
  effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:180, color:'255,220,140', life:0.7, maxLife:0.7, width:9 });
  if(mapOpen) renderMap();
  if(skillBookOpen) renderSkillBook();
  renderHUD(); save();
}

/* ============ 存档 ============ */
function save(){
  try{
    localStorage.setItem('xiantu14', JSON.stringify({
      realm:G.realm, layer:G.layer, qi:G.qi, stones:G.stones,
      biome:state.biome,
      equipped: G.equipped,
      unlockedSkills: Array.from(G.unlockedSkills)
    }));
  }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem('xiantu14') || 'null');
    if(d){
      G.realm = d.realm|0;
      G.layer = d.layer|0 || 1;
      G.qi    = d.qi|0;
      G.stones= d.stones|0;
      if(typeof d.biome === 'number' && d.biome >= 0 && d.biome < BIOMES.length){
        if(G.realm >= (BIOMES[d.biome].realmReq || 0)) state.biome = d.biome;
      }
      if(Array.isArray(d.equipped) && d.equipped.length === 8){
        G.equipped = d.equipped;
      }
      if(Array.isArray(d.unlockedSkills)){
        G.unlockedSkills = new Set(d.unlockedSkills);
      }
    }
  }catch(e){}
}

/* ============ 主循环 ============ */
let lastT = performance.now();
let cleanTimer = 0;
let errorShown = false;
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  try {
    if(state.started){
      if(W < 10 || H < 10) resize();
      state.t += dt;
      if(state.grace > 0) state.grace = Math.max(0, state.grace - dt);
      if(playerInvuln > 0) playerInvuln = Math.max(0, playerInvuln - dt);
      if(!isMaxLv()){
        G.qi += cultSpeed() * dt;
        if(G.qi >= qiNeed()) tryBreak();
      }
      for(const id of ALL_SKILL_IDS){
        if(G.cd[id] > 0) G.cd[id] = Math.max(0, G.cd[id] - dt);
      }
      G.mp = Math.min(G.maxMp, G.mp + G.maxMp * 0.08 * dt);
      G.hp = Math.min(G.maxHp, G.hp + G.maxHp * 0.005 * dt);
      updatePlayer(dt);
      for(let i = state.enemies.length - 1; i >= 0; i--){
        const e = state.enemies[i];
        updateEnemy(e, dt);
        if(e.dead && e.deadTimer <= 0) state.enemies.splice(i, 1);
      }
      updateSwordArray(dt);
      updateProjectiles(dt);
      updateDomain(dt);
      updateCamera(dt);
      updateInteract();
      updateEffects(dt);
      updateParticles(dt);
      maintainEnemies();
      maintainHerbs();
      updateSkillUI();
      updateBossBar();
      cleanTimer += dt;
      if(cleanTimer > 8){ cleanTimer = 0; cleanChunks(); }
      hudAcc += dt;
      if(hudAcc > 0.12){ hudAcc = 0; renderHUD(); }
      render(dt);
    }
  } catch(err){
    if(!errorShown){
      errorShown = true;
      console.error('[仙途] 运行错误：', err);
    }
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    if(!isNum(P.x) || !isNum(P.y)){ P.x = origin.x; P.y = origin.y; }
    if(!isNum(state.camX) || !isNum(state.camY)){ state.camX = P.x - W/2; state.camY = P.y - H/2; }
    if(!isNum(G.hp) || G.hp <= 0) G.hp = 1;
    if(!isNum(G.mp) || G.mp < 0) G.mp = 0;
  }
  requestAnimationFrame(loop);
}

/* ============ 初始化 ============ */
function initGame(){
  load();
  recalc();
  refreshUnlockedSkills();
  G.hp = G.maxHp;
  G.mp = G.maxMp;
  G.cd = {};
  for(const id of ALL_SKILL_IDS) G.cd[id] = 0;
  G.atkCd = 0;
  if(W < 10 || H < 10) resize();
  const startBi = state.biome >= 0 && state.biome < BIOMES.length ? state.biome : 0;
  const origin = BIOME_ORIGIN[startBi];
  P.x = origin.x; P.y = origin.y;
  P.swing = 0; P.flying = 0;
  P.dir = 0; P.moving = false; P.anim = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  state.started = true;
  state.grace = 3;
  state.t = 0;
  state.nextSpawnT = 0;
  state.nextHerbT = 0;
  state.swordCd = 0;
  state.domain = 0;
  state.biome = startBi;
  state.shakeT = 0;
  state.shield = 0; state.shieldTime = 0;
  state.enemies.length = 0;
  state.herbs.length = 0;
  particles.length = 0;
  effects.length = 0;
  floats.length = 0;
  projectiles.length = 0;
  beams.length = 0;
  chunks.clear(); lakeCache.clear();
  setupLandmarks();
  for(let i = 0; i < 5; i++) spawnHerb();
  buildSkillBar();
  updateSkillUI();
  renderHUD();
  lastT = performance.now();
  errorShown = false;
  toast('拖动屏幕 / WASD 移动 · 修为自动增长');
  setTimeout(()=> toast('点击「晋升」瞬间提升一层境界'), 2600);
  setTimeout(()=> toast('击败妖王可领悟区域专属功法'), 5000);
  setInterval(save, 5000);
}
const startBtn = $('startBtn');
if(startBtn) startBtn.addEventListener('click', ()=>{
  if(state.started) return;
  const ss = $('startScreen');
  if(ss) ss.style.display = 'none';
  setTimeout(()=>{ resize(); initGame(); }, 30);
});
requestAnimationFrame(loop);
</script>
</body>
</html>
