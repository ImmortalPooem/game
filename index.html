<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>仙途·问道 v14</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1a16;
  font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  color:#e2d6b8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#startScreen{position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 28%, #2a4a5a 0%, #14202e 55%, #0a1018 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#startScreen h1{font-size:36px;font-weight:400;letter-spacing:.45em;text-indent:.45em;
  color:#e8c878;text-shadow:0 0 34px rgba(232,200,120,.6)}
#startScreen .ver{font-size:12px;letter-spacing:.3em;color:rgba(232,200,120,.55);margin-top:-8px}
#startBtn{font-family:inherit;font-size:18px;letter-spacing:.3em;text-indent:.3em;
  padding:14px 50px;margin-top:8px;
  background:rgba(232,200,120,.12);border:1px solid rgba(232,200,120,.55);
  color:#f4e8cc;border-radius:4px;cursor:pointer;transition:.25s}
#startBtn:hover,#startBtn:active{background:rgba(232,200,120,.32);
  box-shadow:0 0 34px rgba(232,200,120,.5)}
#startScreen .hint{font-size:12px;line-height:2;text-align:center;letter-spacing:.05em;
  color:rgba(220,210,190,.55);padding:0 20px;margin-top:10px}
#leftZone{position:fixed;inset:0;z-index:20;touch-action:none}
#joyBase{position:fixed;width:112px;height:112px;border-radius:50%;
  border:1px solid rgba(200,164,92,.4);background:rgba(200,164,92,.07);
  display:none;z-index:25;pointer-events:none;
  box-shadow:inset 0 0 30px rgba(200,164,92,.15)}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(235,205,145,.95),rgba(160,120,60,.75));
  box-shadow:0 0 20px rgba(200,164,92,.55)}
#attackBtn{position:fixed;right:18px;bottom:34px;z-index:32;
  width:92px;height:92px;border-radius:50%;
  font-family:inherit;font-size:16px;letter-spacing:.12em;color:#ffe9b8;
  cursor:pointer;transition:.1s;
  background:radial-gradient(circle at 35% 30%,rgba(200,90,50,.95),rgba(100,35,20,.95));
  border:2px solid rgba(255,160,100,.6);
  box-shadow:0 0 26px rgba(255,90,60,.4)}
#attackBtn:active{transform:scale(.92);
  box-shadow:0 0 40px rgba(255,120,80,.7)}
#skillBar{position:fixed;right:118px;bottom:34px;z-index:32;
  display:grid;grid-template-columns:repeat(4,50px);grid-template-rows:repeat(2,50px);gap:6px}
.skillBtn{position:relative;overflow:hidden;width:50px;height:50px;border-radius:50%;
  font-family:inherit;cursor:pointer;transition:.15s;
  background:radial-gradient(circle at 35% 30%,rgba(50,80,100,.95),rgba(18,30,45,.95));
  border:1px solid rgba(200,164,92,.4);
  box-shadow:0 0 14px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#e2d6b8}
.skillBtn:active{transform:scale(.9)}
.skillBtn .skName{font-size:15px;letter-spacing:0;z-index:2;line-height:1}
.skillBtn .skMp{font-size:8px;opacity:.62;margin-top:2px;z-index:2}
.skillBtn.cooling{opacity:.55}
.skillBtn.noMp{border-color:rgba(120,120,120,.3)}
.skillBtn.noMp .skName{opacity:.4}
.skillBtn.empty{background:radial-gradient(circle at 35% 30%,rgba(28,30,36,.9),rgba(12,13,18,.9));
  border-color:rgba(80,80,80,.25);opacity:.5}
.skillBtn.empty .skName{opacity:.3;font-size:12px}
.cdMask{position:absolute;left:0;right:0;bottom:0;height:0%;
  background:rgba(0,0,0,.72);pointer-events:none;transition:height .08s linear}
@media(max-width:390px){
  #skillBar{grid-template-columns:repeat(4,44px);grid-template-rows:repeat(2,44px);right:106px;gap:5px}
  .skillBtn{width:44px;height:44px}
  .skillBtn .skName{font-size:13px}
  #attackBtn{width:82px;height:82px;font-size:15px;right:14px;bottom:30px}
}
#herbBtn{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:33;
  padding:12px 32px;font-family:inherit;font-size:15px;letter-spacing:.2em;
  color:#b8ffe0;cursor:pointer;border-radius:4px;
  background:rgba(20,60,45,.92);border:1px solid rgba(120,255,190,.65);
  box-shadow:0 0 24px rgba(120,255,190,.5);
  animation:herbPulse 1.6s infinite}
@keyframes herbPulse{0%,100%{opacity:1}50%{opacity:.72}}
#topButtons{position:fixed;right:18px;top:14px;z-index:31;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 36px)}
.topBtn{padding:8px 16px;font-family:inherit;font-size:12px;
  letter-spacing:.15em;color:#e8c878;cursor:pointer;
  background:rgba(15,22,30,.88);border:1px solid rgba(200,164,92,.4);
  border-radius:4px;transition:.2s;box-shadow:0 0 14px rgba(0,0,0,.5)}
.topBtn:hover,.topBtn:active{background:rgba(200,164,92,.22);
  box-shadow:0 0 22px rgba(200,164,92,.4)}
.topBtn.advance{color:#ffe070;border-color:rgba(255,220,120,.55);
  background:rgba(50,40,10,.88);
  box-shadow:0 0 18px rgba(255,200,60,.3)}
.topBtn.advance:hover{background:rgba(100,80,20,.9)}
#hud{position:fixed;left:12px;top:58px;z-index:30;width:190px;
  background:rgba(15,22,30,.78);border:1px solid rgba(200,164,92,.28);
  border-radius:5px;padding:10px 12px;backdrop-filter:blur(6px);pointer-events:none}
#realmName{font-size:13px;color:#d8b878;letter-spacing:.12em;
  padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid rgba(200,164,92,.22)}
.bar{height:7px;background:rgba(255,255,255,.09);border-radius:4px;
  overflow:hidden;margin-top:7px}
.bar>div{height:100%;width:0;transition:width .15s}
#hpFill{background:linear-gradient(90deg,#9a3b38,#e8705a)}
#mpFill{background:linear-gradient(90deg,#3b4f8a,#7f9fe6)}
#qiFill{background:linear-gradient(90deg,#3c8a7c,#89e2ce)}
.lbl{font-size:10px;opacity:.65;margin-top:4px;letter-spacing:.06em}
#stoneLine{font-size:10px;opacity:.6;margin-top:6px;letter-spacing:.06em}
#swordLine{font-size:10px;opacity:.6;margin-top:3px;letter-spacing:.06em;color:#89c8e2}
#biomeLine{font-size:10px;opacity:.75;margin-top:3px;letter-spacing:.06em;color:#e8c878}
#shieldLine{font-size:10px;color:#ffe070;margin-top:3px;letter-spacing:.06em;display:none}
.ver-tag{font-size:9px;opacity:.4;margin-top:7px;text-align:right;letter-spacing:.15em}
#bossBar{position:fixed;left:0;top:0;width:100%;z-index:34;
  padding:8px 16px 12px;
  background:linear-gradient(180deg,rgba(28,6,14,.92) 0%,rgba(28,6,14,.55) 62%,transparent 100%);
  pointer-events:none;display:none;flex-direction:column;align-items:center;gap:5px;
  transition:opacity .3s}
#bossName{font-size:14px;letter-spacing:.32em;text-indent:.32em;color:#ffb8c8;
  text-shadow:0 0 14px rgba(255,50,90,.85),0 0 4px rgba(255,200,210,.9)}
#bossHpTrack{position:relative;width:min(560px,86vw);height:15px;border-radius:8px;
  background:rgba(0,0,0,.65);border:1px solid rgba(255,120,140,.55);overflow:hidden;
  box-shadow:0 0 22px rgba(255,40,80,.4),inset 0 0 10px rgba(0,0,0,.8)}
#bossHpFill{height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,#7a0a1a,#e02040 55%,#ff7a6a);
  transition:width .16s;box-shadow:0 0 16px rgba(255,60,80,.85)}
#bossHpSegs{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1.5px),
    rgba(0,0,0,.65) calc(10% - 1.5px),rgba(0,0,0,.65) 10%)}
#bossHpText{font-size:10px;letter-spacing:.12em;color:rgba(255,190,200,.8)}
#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:40;
  padding:9px 20px;font-size:14px;letter-spacing:.1em;white-space:nowrap;
  background:rgba(20,28,36,.94);border:1px solid rgba(200,164,92,.35);
  border-radius:3px;opacity:0;transition:opacity .4s;pointer-events:none}
#hurtOverlay{position:fixed;inset:0;pointer-events:none;z-index:15;
  background:radial-gradient(ellipse at center, transparent 42%, rgba(220,40,25,.6) 100%);
  opacity:0;transition:opacity .15s}
#flashOverlay{position:fixed;inset:0;pointer-events:none;z-index:16;opacity:0;background:#fff}
#biomeBanner{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:38;
  font-size:24px;letter-spacing:.5em;text-indent:.5em;color:#e8c878;
  text-shadow:0 0 30px rgba(200,164,92,.9),0 0 8px rgba(255,240,200,.7);
  opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#mapOverlay,#skillBookOverlay{position:fixed;inset:0;z-index:60;
  background:rgba(4,8,16,.9);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:14px}
.mapPanel,.skillBookPanel{width:min(760px,100%);max-height:90vh;
  background:rgba(12,18,28,.97);
  border:1px solid rgba(200,164,92,.38);border-radius:8px;
  padding:18px;display:flex;flex-direction:column;
  box-shadow:0 0 70px rgba(0,0,0,.95),0 0 40px rgba(200,164,92,.18)}
.mapPanel h2,.skillBookPanel h2{font-size:20px;font-weight:400;letter-spacing:.4em;text-indent:.4em;
  color:#e8c878;text-align:center;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid rgba(200,164,92,.22)}
#mapGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  overflow-y:auto;padding:4px;flex:1;-webkit-overflow-scrolling:touch;
  max-height:60vh}
@media(min-width:620px){#mapGrid{grid-template-columns:repeat(3,1fr)}}
.mapCard{padding:12px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);
  transition:.2s;text-align:left;
  display:flex;flex-direction:column;gap:4px}
.mapCard:hover:not(.locked){background:rgba(40,58,80,.9);
  border-color:rgba(200,164,92,.62);
  box-shadow:0 0 20px rgba(200,164,92,.28)}
.mapCard.locked{opacity:.42;cursor:not-allowed}
.mapCard.current{border-color:#ffd870;
  box-shadow:0 0 22px rgba(255,216,112,.55);
  background:rgba(50,42,20,.85)}
.mapCard .mcHeader{display:flex;align-items:center;gap:8px}
.mapCard .mcEmoji{font-size:24px;line-height:1}
.mapCard .mcName{font-size:15px;color:#e8c878;letter-spacing:.08em}
.mapCard .mcReq{font-size:11px;color:rgba(220,210,190,.6);letter-spacing:.04em}
.mapCard .mcDesc{font-size:11px;color:rgba(200,190,170,.55);line-height:1.55}
.mapCard .mcLock{font-size:10px;color:#d9604a;margin-top:2px}
#mapCloseBtn,#skillBookCloseBtn{margin-top:14px;align-self:center;
  padding:10px 40px;font-family:inherit;font-size:14px;
  letter-spacing:.2em;text-indent:.2em;
  background:rgba(200,164,92,.1);
  border:1px solid rgba(200,164,92,.42);
  color:#e8dcc0;border-radius:4px;cursor:pointer;transition:.2s}
#mapCloseBtn:hover,#skillBookCloseBtn:hover{background:rgba(200,164,92,.3);
  box-shadow:0 0 20px rgba(200,164,92,.4)}
#skillBookSlots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:14px;padding:4px}
.skSlotBtn{aspect-ratio:1;border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(50,80,100,.95),rgba(18,30,45,.95));
  border:1px solid rgba(200,164,92,.35);
  color:#e2d6b8;transition:.15s;font-family:inherit}
.skSlotBtn.selected{border-color:#ffd870;
  box-shadow:0 0 20px rgba(255,216,112,.6);
  background:radial-gradient(circle at 35% 30%,rgba(80,70,40,.95),rgba(40,30,15,.95))}
.skSlotBtn .slotKey{font-size:22px;line-height:1}
.skSlotBtn .slotName{font-size:9px;opacity:.65;margin-top:3px;letter-spacing:.04em}
.skSlotBtn .slotNum{position:absolute;top:2px;left:6px;font-size:9px;opacity:.4}
#skillBookLibrary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;overflow-y:auto;max-height:44vh;padding:4px;-webkit-overflow-scrolling:touch}
.skCard{padding:8px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);transition:.15s;
  display:flex;flex-direction:column;gap:3px}
.skCard:hover{background:rgba(40,58,80,.9);
  border-color:rgba(200,164,92,.6);
  box-shadow:0 0 18px rgba(200,164,92,.28)}
.skCard.equipped{border-color:rgba(120,255,190,.55);
  background:rgba(20,50,40,.85)}
.skCard.locked{opacity:.35;cursor:not-allowed;filter:grayscale(0.7)}
.skCard .cardTop{display:flex;align-items:center;gap:6px}
.skCard .cardKey{width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(50,80,100,.7);border:1px solid rgba(200,164,92,.35);
  font-size:12px}
.skCard .cardName{font-size:12px;color:#e8c878;letter-spacing:.04em}
.skCard .cardStats{font-size:10px;color:rgba(200,190,170,.6);
  letter-spacing:.03em}
.skCard .cardTag{font-size:9px;color:#89e2ce;margin-top:1px}
.skCard .cardLock{font-size:9px;color:#d9604a}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="hurtOverlay"></div>
<div id="flashOverlay"></div>
<div id="biomeBanner"></div>
<div id="leftZone"></div>
<div id="joyBase"><div id="joyKnob"></div></div>

<div id="bossBar">
  <div id="bossName"></div>
  <div id="bossHpTrack"><div id="bossHpFill"></div><div id="bossHpSegs"></div></div>
  <div id="bossHpText"></div>
</div>

<div id="hud">
  <div id="realmName">炼气期·一层</div>
  <div class="bar"><div id="hpFill"></div></div>
  <div class="lbl" id="hpLbl">气血 100 / 100</div>
  <div class="bar"><div id="mpFill"></div></div>
  <div class="lbl" id="mpLbl">灵力 50 / 50</div>
  <div class="bar"><div id="qiFill"></div></div>
  <div class="lbl" id="qiLbl">修为 0 / 40</div>
  <div id="stoneLine">灵石 0</div>
  <div id="swordLine">剑阵 · 未悟</div>
  <div id="biomeLine">青云竹林</div>
  <div id="shieldLine">护盾 0</div>
  <div class="ver-tag">v14.0</div>
</div>

<div id="topButtons">
  <button class="topBtn" id="mapBtn">地 图</button>
  <button class="topBtn" id="skillBookBtn">功 法</button>
  <button class="topBtn advance" id="advanceBtn">晋 升</button>
</div>

<div id="skillBar"></div>
<button id="attackBtn">攻 击</button>
<button id="herbBtn" style="display:none">采 药</button>

<div id="toast"></div>

<div id="mapOverlay">
  <div class="mapPanel">
    <h2>寰 宇 地 图</h2>
    <div id="mapGrid"></div>
    <button id="mapCloseBtn">关 闭</button>
  </div>
</div>

<div id="skillBookOverlay">
  <div class="skillBookPanel">
    <h2>功 法 阁</h2>
    <div id="skillBookSlots"></div>
    <div id="skillBookLibrary"></div>
    <button id="skillBookCloseBtn">关 闭</button>
  </div>
</div>

<div id="startScreen">
  <h1>仙 途 · 问 道</h1>
  <p class="ver">VERSION 14.0</p>
  <button id="startBtn">踏 入 仙 途</button>
  <p class="hint">
    拖动屏幕 / WASD 移动　·　空格或 J 平A<br>
    1 ~ 8 释放技能　·　点击「功法」可更换技能<br>
    点击「晋升」瞬间提升一层境界<br>
    四大妖王各具异相，诸方地界宫殿林立
  </p>
</div>

<script>
/* ============ Polyfill ============ */
(function(){
  const CR = window.CanvasRenderingContext2D;
  if(!CR) return;
  if(!CR.prototype.ellipse){
    CR.prototype.ellipse = function(x, y, rx, ry, rot, a1, a2, ccw){
      this.save(); this.translate(x, y); this.rotate(rot || 0);
      this.scale(rx, ry || rx); this.arc(0, 0, 1, a1, a2, ccw); this.restore();
    };
  }
  if(!CR.prototype.setLineDash){
    CR.prototype.setLineDash = function(){};
    CR.prototype.getLineDash = function(){ return []; };
  }
})();
if(!Math.imul){
  Math.imul = function(a, b){
    const ah = (a >>> 16) & 0xffff, al = a & 0xffff;
    const bh = (b >>> 16) & 0xffff, bl = b & 0xffff;
    return ((al * bl) + (((ah * bl + al * bh) << 16) >>> 0) | 0);
  };
}

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = (a,b) => a + Math.random()*(b-a);
const isNum = n => typeof n === 'number' && isFinite(n);
const fmt = n => {
  n = Math.floor(n);
  if(n < 10000) return String(n);
  if(n < 1e8) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
  if(n < 1e12) return (n/1e8).toFixed(2).replace(/\.00$/,'') + '亿';
  return (n/1e12).toFixed(2) + '兆';
};
function hashInt(x,y){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return (n ^ (n>>>16)) >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x,y){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967296;
}

/* ============ 画布 ============ */
const cvs = $('game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth || document.documentElement.clientWidth || 800;
  H = window.innerHeight || document.documentElement.clientHeight || 600;
  if(W < 1) W = 800;
  if(H < 1) H = 600;
  cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const rOuter = Math.max(W,H) * 0.86;
  const rInner = Math.min(W,H) * 0.42;
  vignette = ctx.createRadialGradient(W/2,H/2,Math.max(1,rInner),W/2,H/2,Math.max(1,rOuter));
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(6,14,24,.26)');
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize, 200));
resize();

/* ============ 十方地界 ============ */
const BIOME_ORIGIN = [];
const BIOME_EMOJIS = ['🎋','🌋','🌳','👻','🏜️','❄️','🌊','⛩️','💀','✨'];
const BIOMES = [
  { id:'bamboo', name:'青云竹林', desc:'翠竹连绵，灵气初萌', realmReq:0,
    h1:128,h2:40,s1:32,s2:22,l1:19,l2:10, tint:'rgba(40,90,60,0.06)',
    propTypes:['bamboo','bamboo','bamboo','pine','rock'], lakeType:'water' },
  { id:'volcano', name:'赤炎火山', desc:'熔岩奔涌，火毒侵体', realmReq:1,
    h1:5,h2:25,s1:50,s2:22,l1:16,l2:9, tint:'rgba(180,50,20,0.13)',
    propTypes:['lavarock','lavarock','obsidian','ashrock'], lakeType:'lava' },
  { id:'wildwood', name:'万妖古林', desc:'古木参天，妖气弥漫', realmReq:1,
    h1:95,h2:22,s1:34,s2:16,l1:14,l2:7, tint:'rgba(60,80,30,0.13)',
    propTypes:['bigtree','bigtree','vine','mushroom'], lakeType:'swamp' },

/* ============ 世界 ============ */
const CELL = 260;
const LAKE_CELL = 1000;
const chunks = new Map();
const lakeCache = new Map();
function getChunk(cx, cy){
  const k = cx + ',' + cy;
  let c = chunks.get(k);
  if(c) return c;
  c = genChunk(cx, cy);
  chunks.set(k, c);
  return c;
}
function genChunk(cx, cy){
  const bio = BIOMES[state.biome] || BIOMES[0];
  const biomeSeed = state.biome * 7919;
  const r = mulberry32(hashInt(cx + biomeSeed, cy + state.biome * 3571));
  const props = [];
  const wx = cx*CELL + CELL/2, wy = cy*CELL + CELL/2;
  // 距离原点和地标都有距离才生成
  let distOrigin = Math.hypot(wx - BIOME_ORIGIN[state.biome].x, wy - BIOME_ORIGIN[state.biome].y);
  let nearLandmark = false;
  for(const lm of state.landmarks){
    if(Math.hypot(wx - lm.x, wy - lm.y) < lm.r * 2.5){ nearLandmark = true; break; }
  }
  if(distOrigin > 300 && !nearLandmark){
    const rn = r();
    let n = 0;
    if(rn > 0.45) n = (r() < 0.65) ? 1 : 2;
    for(let i=0;i<n;i++){
      const t = bio.propTypes[Math.floor(r() * bio.propTypes.length)];
      let rad = 17;
      if(t === 'bamboo') rad = 15;
      else if(t === 'pine' || t === 'snowpine' || t === 'deadtree' || t === 'goldtree' || t === 'bigtree' || t === 'cactus') rad = 19;
      else if(t === 'obsidian' || t === 'goldpillar' || t === 'meteor') rad = 21;
      else if(t === 'icecrystal' || t === 'coral' || t === 'thorn') rad = 15;
      else if(t === 'cloud' || t === 'voidcloud' || t === 'mushroom') rad = 11;
      else if(t === 'bone' || t === 'shell' || t === 'skull') rad = 8;
      else if(t === 'grave' || t === 'dune' || t === 'darkcrystal') rad = 16;
      else if(t === 'ashrock' || t === 'starstone') rad = 12;
      else if(t === 'vine' || t === 'seaweed' || t === 'starflower') rad = 9;
      props.push({ x: cx*CELL + r()*CELL, y: cy*CELL + r()*CELL, type: t, r: rad, seed: r()*100 });
    }
  }
  return { props };
}
function lakeAt(cx, cy){
  const k = cx + ',' + cy;
  if(lakeCache.has(k)) return lakeCache.get(k);
  const biomeSeed = state.biome * 9973;
  const r = mulberry32(hashInt(cx*7+13 + biomeSeed, cy*11+7 + state.biome * 4211));
  let lake = null;
  if(r() > 0.72){
    const lx = cx*LAKE_CELL + LAKE_CELL*(0.3 + r()*0.4);
    const ly = cy*LAKE_CELL + LAKE_CELL*(0.3 + r()*0.4);
    const origin = BIOME_ORIGIN[state.biome];
    if(Math.hypot(lx - origin.x, ly - origin.y) > 500){
      lake = { x: lx, y: ly, rx: 100 + r()*130, ry: 80 + r()*100,
        type: (BIOMES[state.biome] || BIOMES[0]).lakeType };
    }
  }
  lakeCache.set(k, lake);
  return lake;
}
function cleanChunks(){
  const px = Math.floor(P.x / CELL);
  const py = Math.floor(P.y / CELL);
  for(const k of chunks.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-px) > 15 || Math.abs(+p[1]-py) > 15) chunks.delete(k);
  }
  const lx = Math.floor(P.x / LAKE_CELL);
  const ly = Math.floor(P.y / LAKE_CELL);
  for(const k of lakeCache.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-lx) > 8 || Math.abs(+p[1]-ly) > 8) lakeCache.delete(k);
  }
}

function maintainEnemies(){
  for(let i = state.enemies.length-1; i >= 0; i--){
    const e = state.enemies[i];
    if(!isNum(e.x) || !isNum(e.y)){ state.enemies.splice(i,1); continue; }
    if(Math.hypot(e.x-P.x, e.y-P.y) > 2600 && !e.dead && !e.chasing) state.enemies.splice(i,1);
  }
  const alive = state.enemies.filter(e => !e.dead).length;
  const bossAlive = state.enemies.some(e => e.elite && !e.dead);
  let want = 7 + G.realm;
  if(bossAlive) want -= 1;
  if(alive < want && state.t > state.nextSpawnT){
    spawnEnemy();
    state.nextSpawnT = state.t + 0.55;
  }
}

const joy = { active:false, pid:null, ox:0, oy:0, vx:0, vy:0 };
const JOY_R = 46;
const leftZone = $('leftZone');
const joyBase  = $('joyBase');
const joyKnob  = $('joyKnob');
function joyStart(x, y, pid){
  if(!isNum(x) || !isNum(y)) return;
  joy.active = true; joy.pid = pid;
  joy.ox = x; joy.oy = y; joy.vx = joy.vy = 0;
  joyBase.style.display = 'block';
  joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px';
  joyBase.style.transform = 'translate(-50%,-50%)';
  joyKnob.style.transform = 'translate(0,0)';
}
function joyMove(x, y){
  if(!isNum(x) || !isNum(y)) return;
  let dx = x - joy.ox, dy = y - joy.oy;
  const d = Math.hypot(dx, dy);
  if(d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.vx = dx / JOY_R; joy.vy = dy / JOY_R;
}
function joyEnd(){
  joy.active = false; joy.pid = null;
  joy.vx = joy.vy = 0;
  joyBase.style.display = 'none';
}

  if(!joy.active || e.pointerId !== joy.pid) return;
  joyMove(e.clientX, e.clientY);
});
window.addEventListener('pointerup', e=>{
  if(joy.active && e.pointerId === joy.pid) joyEnd();
});
window.addEventListener('pointercancel', e=>{
  if(joy.active && e.pointerId === joy.pid) joyEnd();
});

/* ============ 碰撞 ============ */
function resolveCollision(o){
  const cx0 = Math.floor((o.x - 60) / CELL);
  const cx1 = Math.floor((o.x + 60) / CELL);
  const cy0 = Math.floor((o.y - 60) / CELL);
  const cy1 = Math.floor((o.y + 60) / CELL);
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const chunk = getChunk(cx, cy);
      for(const p of chunk.props){
        const dx = o.x - p.x, dy = o.y - p.y;
        const d = Math.hypot(dx, dy);
        const min = o.r + p.r;
        if(d < min && d > 0.01){
          const push = min - d;
          o.x += dx/d * push; o.y += dy/d * push;
        }
      }
    }
  }
  const lcx = Math.floor(o.x / LAKE_CELL);
  const lcy = Math.floor(o.y / LAKE_CELL);
  for(let j = -1; j <= 1; j++){
    for(let i = -1; i <= 1; i++){
      const lake = lakeAt(lcx+i, lcy+j);
      if(!lake) continue;
      const nx = (o.x - lake.x)/lake.rx, ny = (o.y - lake.y)/lake.ry;
      const d = Math.hypot(nx, ny);
      if(d < 1 && d > 0.01){
        o.x = lake.x + nx/d * lake.rx * 1.03;
        o.y = lake.y + ny/d * lake.ry * 1.03;
      }
    }
  }
}

const PARTICLE_CAP = 620;
function addParticle(x, y, o){
  if(!isNum(x) || !isNum(y)) return;
  if(particles.length > PARTICLE_CAP) return;
  particles.push({ x, y, vx: o.vx || 0, vy: o.vy || 0,
    life: o.life || 0.6, maxLife: o.life || 0.6,
    size: o.size || 4, color: o.color || '255,255,255',
    type: o.type || 'dot', gravity: o.gravity || 0,
    drag: o.drag != null ? o.drag : 0.94,
    angle: o.angle || 0, spin: o.spin || 0, grow: o.grow || 0 });
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0 || !isNum(p.x) || !isNum(p.y)){ particles.splice(i,1); continue; }
    p.vx *= Math.pow(p.drag, dt * 60);
    p.vy *= Math.pow(p.drag, dt * 60);
    p.vy += p.gravity * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.angle += p.spin * dt;
  }
}
function addFloat(x, y, text, color, big){
  if(!isNum(x) || !isNum(y)) return;
  if(floats.length > 46) return;
  floats.push({ x, y, text:String(text), color, life: big?1.1:0.9,
    maxLife: big?1.1:0.9, vy: big?-78:-62, big: !!big });
}

/* ============ 平A ============ */
function doAttack(){
  if(!state.started || state.t < G.atkCd) return;
  G.atkCd = state.t + 0.4;
  let target = null, td = 150;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
    if(d < td){ td = d; target = e; }
  }
  let angle;
  if(target){
    angle = Math.atan2(target.y - P.y, target.x - P.x);
    if(Math.abs(Math.cos(angle)) >= Math.abs(Math.sin(angle)))
      P.dir = Math.cos(angle) > 0 ? 2 : 1;
    else P.dir = Math.sin(angle) > 0 ? 0 : 3;
  } else {
    angle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
          : P.dir === 2 ? 0 : -Math.PI/2;
  }
  P.swing = 0.26; P.swingAngle = angle; P.swingSide = -P.swingSide;
  const range = 105, halfAngle = Math.PI / 3;
  const dmgMul = isSwordGod() ? 1.3 : 1;
  for(const e of state.enemies){
    if(e.dead) continue;
    const dx = e.x - P.x, dy = e.y - P.y;
    const d = Math.hypot(dx, dy);
    if(d > range + e.r) continue;
    let diff = Math.abs(Math.atan2(dy, dx) - angle);
    if(diff > Math.PI) diff = Math.PI*2 - diff;
    if(diff > halfAngle) continue;
    damageEnemy(e, G.atk * dmgMul, angle);
  }
  for(let k = 0; k < 7; k++){
    const a = angle + rnd(-0.55, 0.55);
    const sp = rnd(250, 400);
    addParticle(P.x + Math.cos(angle)*30, P.y - 28 + Math.sin(angle)*30, {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.28, size: 10, color: '200,240,255',
      type: 'line', angle: a, drag: 0.86
    });
  }
  effects.push({ type:'fan', x:P.x, y:P.y, angle, range, halfAngle,
    color:'225,240,255', life:0.18, maxLife:0.18 });
  shake(1.8);
}

/* ============ 技能释放 ============ */
function castSkill(slot){
  if(!state.started) return;
  const skillId = G.equipped[slot];
  if(skillId == null) return;
  const sk = SKILL_LIBRARY[skillId];
  if(!sk) return;
  if(!G.unlockedSkills.has(skillId)){ toast('此术未悟。'); return; }
  if((G.cd[skillId] || 0) > 0 || G.mp < sk.mp) return;
  G.mp -= sk.mp;
  G.cd[skillId] = sk.cd;
  const c = sk.color;
  switch(sk.type){
    case 'fan': {
      const dmgMul = isSwordGod() ? 1.25 : 1;
      const radius = sk.radius;
      const halfAngle = Math.PI / 3;
      let targetAngle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
                       : P.dir === 2 ? 0 : -Math.PI/2;
      let target = null, td = radius + 50;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d < td){ td = d; target = e; }
      }
      if(target){
        targetAngle = Math.atan2(target.y - P.y, target.x - P.x);
        if(Math.abs(Math.cos(targetAngle)) >= Math.abs(Math.sin(targetAngle)))
          P.dir = Math.cos(targetAngle) > 0 ? 2 : 1;
        else P.dir = Math.sin(targetAngle) > 0 ? 0 : 3;
      }
      for(const e of state.enemies){
        if(e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y;
        const d = Math.hypot(dx, dy);
        if(d > radius + e.r) continue;
        let diff = Math.abs(Math.atan2(dy, dx) - targetAngle);
        if(diff > Math.PI) diff = Math.PI*2 - diff;
        if(diff > halfAngle) continue;
        damageEnemy(e, G.atk * sk.power * dmgMul, targetAngle);
      }
      effects.push({ type:'fan', x:P.x, y:P.y, angle:targetAngle, range:radius, halfAngle,
        color:c, life:0.28, maxLife:0.28 });
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:radius, color:c,
        life:0.42, maxLife:0.42, width:6 });
      for(let k = 0; k < 20; k++){
        const a = targetAngle + rnd(-halfAngle, halfAngle);
        const sp = rnd(220, 420);
        addParticle(P.x, P.y - 26, {
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
          life: 0.35, size: 12, color: c,
          type: 'line', angle: a, drag: 0.88
        });
      }
      shake(3, 0.15);
      break;
    }
    case 'pierce': {
      let target = null, td = sk.radius;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y);
        if(d < td){ td = d; target = e; }
      }
      let angle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
                : P.dir === 2 ? 0 : -Math.PI/2;
      if(target) angle = Math.atan2(target.y - P.y, target.x - P.x);
      const dmgMul = isSwordGod() ? 1.25 : 1;
      const lineWidth = 60;
      for(const e of state.enemies){
        if(e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y;
        const proj = dx * Math.cos(angle) + dy * Math.sin(angle);
        if(proj < 0 || proj > sk.radius) continue;
        const perp = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
        if(perp > lineWidth/2 + e.r) continue;
        damageEnemy(e, G.atk * sk.power * dmgMul, angle);
      }
      const ex = P.x + Math.cos(angle) * sk.radius;
      const ey = P.y + Math.sin(angle) * sk.radius;
      effects.push({ type:'beam', x1:P.x, y1:P.y-26, x2:ex, y2:ey-26,
        color:c, life:0.32, maxLife:0.32, width:lineWidth });
      for(let k = 0; k < 24; k++){
        const t = Math.random();
        const px = P.x + Math.cos(angle) * sk.radius * t;
        const py = P.y - 26 + Math.sin(angle) * sk.radius * t;
        addParticle(px, py, {
          vx: Math.cos(angle + Math.PI/2) * rnd(-80,80),
          vy: Math.sin(angle + Math.PI/2) * rnd(-80,80),
          life: 0.4, size: rnd(2,6), color: c,
          type: 'spark', angle: rnd(0,6.28), spin: rnd(-10,10), drag: 0.9
        });
      }
      shake(4, 0.18);
      break;
    }
    case 'dash': {
      let ix = 0, iy = 0;
      if(keys['a'] || keys['arrowleft'])  ix -= 1;
      if(keys['d'] || keys['arrowright']) ix += 1;
      if(keys['w'] || keys['arrowup'])    iy -= 1;
      if(keys['s'] || keys['arrowdown'])  iy += 1;
      if(joy.active){ ix += joy.vx; iy += joy.vy; }
      if(Math.hypot(ix, iy) < 0.1){
        ix = P.dir === 2 ? 1 : P.dir === 1 ? -1 : 0;
        iy = P.dir === 0 ? 1 : P.dir === 3 ? -1 : 0;
      }
      const len = Math.hypot(ix, iy) || 1;
      ix /= len; iy /= len;
      P.x += ix * 220; P.y += iy * 220;
      resolveCollision(P);
      for(let k = 0; k < 24; k++){
        const a = Math.atan2(iy, ix) + Math.PI + rnd(-0.5, 0.5);

    case 'fly': {
      P.flying = 8.0;
      toast('御剑飞行 · 8 秒！');
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:90, color:c, life:0.6, maxLife:0.6 });
      for(let k = 0; k < 30; k++){
        const a = Math.random() * Math.PI * 2;
        const sp = rnd(140, 300);
        addParticle(P.x, P.y - 4, {
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
          life: rnd(0.4, 0.9), size: rnd(3,7),
          color: c, type: 'dot', drag: 0.9, grow: 3
        });
      }
      break;
    }
    case 'nova': {
      const rangeMul = isSwordGod() ? 1.2 : 1;
      const dmgMul   = isSwordGod() ? 1.25 : 1;
      const radius = sk.radius * rangeMul;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d > radius) continue;
        const ang = Math.atan2(e.y - P.y, e.x - P.x);
        damageEnemy(e, G.atk * sk.power * dmgMul, ang);
        if(sk.freeze) e.frozen = Math.max(e.frozen || 0, sk.freeze);
      }
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:radius, color:c, life:0.5, maxLife:0.5, width:9 });
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:radius*0.72, color:c, life:0.42, maxLife:0.42 });
      const isIce = !!sk.freeze;
      for(let k = 0; k < (isIce ? 38 : 48); k++){
        const a = Math.random() * Math.PI * 2;
        const r = rnd(15, 70);
        const sp = rnd(160, 380);
        const col = isIce
          ? (Math.random() < 0.5 ? '190,240,255' : '120,200,255')
          : (Math.random() < 0.4 ? '255,210,100' : Math.random() < 0.7 ? '255,140,60' : '255,80,40');
        addParticle(P.x + Math.cos(a)*r, P.y - 26 + Math.sin(a)*r*0.7, {
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
          life: rnd(0.5, 1.0), size: rnd(4, 11),
          color: col, type: 'dot', gravity: 60, drag: 0.92, grow: 5
        });
      }
      shake(isIce ? 5 : 8, 0.22);
      screenFlash(isIce ? 'rgba(140,220,255,.32)' : 'rgba(255,140,60,.3)', 340);
      break;
    }
    case 'swords': {
      const n = 18;
      const dmg = G.atk * sk.power;
      for(let k = 0; k < n; k++){
        const a = (k / n) * Math.PI * 2 + rnd(-0.08, 0.08);
        projectiles.push({
          x: P.x + Math.cos(a)*20, y: P.y - 26 + Math.sin(a)*20,
          vx: Math.cos(a) * 620, vy: Math.sin(a) * 620,
          target: null, damage: dmg, life: 1.0,
          color: c, r: 3, homing: false
        });
      }
      for(let k = 0; k < 8; k++){
        let tg = null, best = 520;
        for(const e of state.enemies){
          if(e.dead) continue;
          const d = Math.hypot(e.x-P.x, e.y-P.y);
          if(d < best && Math.random() < 0.7){ best = d; tg = e; }
        }
        if(!tg) continue;
        const a = Math.atan2(tg.y - 20 - (P.y-26), tg.x - P.x);
        projectiles.push({
          x: P.x, y: P.y - 26,
          vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
          target: tg, damage: dmg, life: 1.6,
          color: '220,250,255', r: 4, homing: true
        });
      }
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:120, color:c, life:0.45, maxLife:0.45 });
      shake(5, 0.16);
      break;
    }
    case 'chain': {
      let curX = P.x, curY = P.y - 26;
      let remaining = 5, mul = 1;
      const used = new Set();
      while(remaining-- > 0){
        let best = null, bd = sk.radius;
        for(const e of state.enemies){
          if(e.dead || used.has(e)) continue;
          const d = Math.hypot(e.x - curX, e.y - 20 - curY);
          if(d < bd){ bd = d; best = e; }
        }
        if(!best) break;
        used.add(best);
        beams.push({ x1: curX, y1: curY, x2: best.x, y2: best.y - 20,
          color: c, life: 0.3, maxLife: 0.3, segs: 7, jitter: 14 });
        const ang = Math.atan2(best.y - curY, best.x - curX);
        damageEnemy(best, G.atk * sk.power * mul, ang);
        for(let k = 0; k < 8; k++){
          const a = Math.random() * Math.PI * 2;
          addParticle(best.x, best.y - 20, {
            vx: Math.cos(a)*rnd(60,200), vy: Math.sin(a)*rnd(60,200),
            life: 0.35, size: rnd(3,7),
            color: c, type: 'spark', angle: a, spin: rnd(-10,10), drag: 0.9
          });
        }
        curX = best.x; curY = best.y - 20; mul *= 0.82;
      }
      if(used.size === 0){ G.mp += sk.mp; G.cd[skillId] = 0.5; toast('附近没有可击之敌。'); return; }
      screenFlash('rgba(180,210,255,.3)', 240);
      shake(6, 0.18);
      break;
    }
    case 'domain': {
      state.domain = 5.5;
      state.domainTick = 0;
      state.domainPower = sk.power;
      state.domainRadius = sk.radius;
      state.domainColor = sk.color;
      toast('领域展开！');
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:sk.radius, color:c, life:0.7, maxLife:0.7, width:14 });
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:sk.radius, color:c, life:0.7, maxLife:0.7 });
      shake(9, 0.4);
      screenFlash('rgba(255,220,140,.5)', 500);
      break;
    }
  }
}

/* ============ 伤害结算 ============ */
function damageEnemy(e, rawAtk, angle){
  if(e.dead) return;
  const dmg = Math.max(1, Math.floor(rawAtk - e.def * 0.6));
  e.hp -= dmg;
  e.hitFlash = 0.14;
  const dx = Math.cos(angle || 0), dy = Math.sin(angle || 0);
  const push = e.elite ? 4 : 10;
  e.x += dx * push; e.y += dy * push;
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
  addFloat(e.x + rnd(-6,6), e.y - (e.elite ? 110 : 32), dmg, '#ffe0a0', dmg > G.atk * 2);
  for(let k = 0; k < 6; k++){
    const a = Math.random() * Math.PI * 2;
    const sp = rnd(90, 200);
    addParticle(e.x, e.y - (e.elite ? 60 : 18), {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.3, size: rnd(2,5), color: '255,240,190',
      type:'spark', angle: a, spin: rnd(-11,11), drag: 0.88
    });
  }
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  e.deadTimer = e.elite ? 0.95 : 0.55;
  e.chasing = false;
  G.qi     += e.rewardQi;
  G.stones += e.rewardStones;
  addFloat(e.x, e.y - (e.elite ? 130 : 44), '修为 +' + fmt(e.rewardQi), '#89e2ce', e.elite);
  addFloat(e.x, e.y - (e.elite ? 158 : 66), '灵石 +' + fmt(e.rewardStones), '#d8b878', e.elite);
  if(e.elite){
    const sid = BIOME_SKILL_ID(state.biome);
    if(!G.unlockedSkills.has(sid)){
      G.unlockedSkills.add(sid);
      const sk = SKILL_LIBRARY[sid];
      if(sk){
        addFloat(P.x, P.y - 130, '领悟 · ' + sk.name, '#ffd870', true);
        toast('领悟区域功法 · ' + sk.name + '！可在功法阁装备');
        screenFlash('rgba(255,215,120,.45)', 400);
        save();
      }
    }
    shake(12, 0.5);
    screenFlash('rgba(255,180,220,.45)', 560);
    for(let k = 0; k < 56; k++){
      const a = Math.random() * Math.PI * 2;
      const sp = rnd(140, 420);
      addParticle(e.x, e.y - 30, {
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 50,
        life: rnd(0.6, 1.5), size: rnd(4,10),
        color: Math.random()<0.5 ? '255,180,220' : '255,240,180',
        type: 'dot', gravity: 60, drag: 0.9, grow: 5
      });
    }
    effects.push({ type:'shockwave', x:e.x, y:e.y-20, maxR:340, color:'255,190,230', life:0.8, maxLife:0.8, width:13 });
  } else {
    shake(3, 0.18);
    for(let k = 0; k < 16; k++){
      const a = Math.random() * Math.PI * 2;
      const sp = rnd(100, 260);
      addParticle(e.x, e.y - 16, {
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 30,
        life: rnd(0.4, 0.9), size: rnd(3,6),
        color: '200,255,220', type:'dot',
        gravity: 60, drag: 0.9, grow: 3
      });
    }
  }
}
function damagePlayer(e){
  if(state.t < playerInvuln) return;
  playerInvuln = state.t + 0.5;
  let dmg = Math.max(1, Math.floor(e.atk - G.def * 0.6));
  if(state.shield > 0){
    const absorbed = Math.min(dmg, state.shield);
    state.shield -= absorbed;
    dmg -= absorbed;
    if(dmg <= 0){
      addFloat(P.x, P.y - 52, '-' + absorbed + ' 护盾', '#ffe070');
      shake(2, 0.1);
      return;
    }
  }
  G.hp -= dmg;
  addFloat(P.x, P.y - 52, dmg, '#ff6b5a');
  shake(5, 0.14);
  hurtFlash();
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  P.x += dx/d * 16; P.y += dy/d * 16;
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(G.hp <= 0) playerDie();
}
function playerDie(){
  G.hp = Math.floor(G.maxHp * 0.3);
  G.qi = Math.floor(G.qi * 0.8);
  state.shield = 0;
  const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
  P.x = origin.x; P.y = origin.y;
  state.grace = 3;
  state.domain = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  toast('你被击倒，一缕遁光将你卷走……修为受损。');
  save();
}

/* ============ 剑阵 / 飞剑 / 剑域 ============ */
function updateSwordArray(dt){
  if(!isSwordArrayOn()) return;
  state.swordAngle += dt * 2.2;
  if(state.t < state.swordCd) return;
  const n = isSwordGod() ? 5 : 3;
  const radius = 58;
  let target = null, td = 400;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if(d < td){ td = d; target = e; }
  }
  if(!target) return;
  const idx = Math.floor(Math.random() * n);
  const ang = state.swordAngle + idx * (Math.PI*2 / n);
  const sx = P.x + Math.cos(ang) * radius;
  const sy = P.y - 26 + Math.sin(ang) * radius * 0.55;
  const dx = target.x - sx, dy = (target.y - 20) - sy;
  const d = Math.hypot(dx, dy) || 1;
  projectiles.push({
    x: sx, y: sy, vx: dx/d * 720, vy: dy/d * 720,
    target, damage: G.atk * (isSwordGod() ? 1.05 : 0.72),
    life: 1.5, color: isSwordGod() ? '255,220,120' : '150,230,255',
    r: 3, homing: true
  });
  state.swordCd = state.t + (isSwordGod() ? 0.35 : 0.6);
}
function updateProjectiles(dt){
  for(let i = projectiles.length-1; i >= 0; i--){
    const pr = projectiles[i];
    pr.life -= dt;
    if(pr.life <= 0 || !isNum(pr.x) || !isNum(pr.y)){ projectiles.splice(i,1); continue; }
    if(pr.homing && pr.target && !pr.target.dead){
      const dx = pr.target.x - pr.x;
      const dy = (pr.target.y - 20) - pr.y;
      const d = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(pr.vx, pr.vy) || 600;
      pr.vx += (dx/d*sp - pr.vx) * Math.min(1, dt*8);
      pr.vy += (dy/d*sp - pr.vy) * Math.min(1, dt*8);
    }
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    let hit = null;
    for(const e of state.enemies){
      if(e.dead) continue;
      if(Math.hypot(e.x - pr.x, (e.y - 18) - pr.y) < e.r + 18){ hit = e; break; }
    }
    if(hit){
      damageEnemy(hit, pr.damage, Math.atan2(pr.vy, pr.vx));
      for(let k = 0; k < 7; k++){
        const a = Math.random() * Math.PI * 2;
        addParticle(pr.x, pr.y, {
          vx: Math.cos(a)*rnd(70,190), vy: Math.sin(a)*rnd(70,190),
          life: 0.32, size: rnd(2,5), color: pr.color,
          type: 'spark', angle: a, spin: rnd(-9,9), drag: 0.88
        });
      }
      projectiles.splice(i,1);
    }
  }
}
function updateDomain(dt){
  if(state.domain <= 0) return;
  state.domain -= dt;
  state.domainTick -= dt;
  if(state.domainTick <= 0){
    state.domainTick = 0.28;
    const R = state.domainRadius;
    for(const e of state.enemies){
      if(e.dead) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
      if(d > R) continue;
      damageEnemy(e, G.atk * state.domainPower, Math.atan2(e.y - P.y, e.x - P.x));
    }
    for(let k = 0; k < 6; k++){
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * R;
      addParticle(P.x + Math.cos(a)*r, P.y + Math.sin(a)*r*0.68 - 120, {
        vx: 0, vy: 480, life: 0.28, size: 18,
        color: state.domainColor || '255,240,170',
        type: 'line', angle: Math.PI/2, drag: 1
      });
    }
  }
  if(state.domain <= 0){
    effects.push({ type:'ring', x:P.x, y:P.y, maxR:state.domainRadius,
      color: state.domainColor || '255,220,140', life:0.5, maxLife:0.5 });
  }
}

/* ============ 更新 ============ */
function updatePlayer(dt){
  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;
  if(joy.active){ ix += joy.vx; iy += joy.vy; }
  const len = Math.hypot(ix, iy);
  if(len > 1){ ix /= len; iy /= len; }
  if(!isNum(ix)) ix = 0;
  if(!isNum(iy)) iy = 0;
  let speed = 178;
  if(P.flying > 0) speed = 450;
  P.x += ix * speed * dt; P.y += iy * speed * dt;
  P.moving = Math.hypot(ix, iy) > 0.12;
  if(P.moving){
    P.anim += dt * (P.flying > 0 ? 4 : 11);
    if(Math.abs(ix) >= Math.abs(iy)) P.dir = ix > 0 ? 2 : 1;
    else P.dir = iy > 0 ? 0 : 3;
  }
  if(P.swing > 0) P.swing = Math.max(0, P.swing - dt);
  if(P.flying > 0){
    P.flying = Math.max(0, P.flying - dt);
    P.flyTrail += dt;
    if(P.flyTrail > 0.03 && P.moving){
      P.flyTrail = 0;
      addParticle(P.x + rnd(-8,8), P.y + rnd(-4,4), {
        vx: rnd(-20,20), vy: rnd(-20,20),
        life: 0.4, size: rnd(2,5), color: '150,230,255',
        type: 'dot', drag: 0.94
      });
    }
  }
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(!isNum(P.x) || !isNum(P.y)){
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    P.x = origin.x; P.y = origin.y;
    state.camX = P.x - W/2; state.camY = P.y - H/2;
  }
}
function updateEnemy(e, dt){
  if(e.dead){ e.deadTimer -= dt; return; }
  if(!isNum(e.x) || !isNum(e.y)) return;
  if(e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
  if(e.frozen > 0){ e.frozen -= dt; if(e.frozen <= 0) e.frozen = 0; }
  e.spawnParticleT = (e.spawnParticleT || 0) + dt;
  if(e.spawnParticleT > 0.15){
    e.spawnParticleT = 0;
    if(e.kind === 'crow' && Math.random() < 0.6){
      addParticle(e.x + rnd(-8,8), e.y - 20 + rnd(-8,8), {
        vx: rnd(-15,15), vy: rnd(-25,-5),
        life: 0.5, size: rnd(1.5,3), color: '255,140,60',
        type: 'dot', drag: 0.94, grow: 1
      });
    } else if(e.kind === 'vine' && Math.random() < 0.4){
      addParticle(e.x + rnd(-10,10), e.y - 16 + rnd(-6,6), {
        vx: rnd(-10,10), vy: rnd(-20,-5),
        life: 0.7, size: rnd(1.5,3), color: '180,255,140',
        type: 'dot', drag: 0.96, grow: 1
      });
    } else if(e.elite){
      if(e.kind === 'b_wolf' && Math.random() < 0.5){
        addParticle(e.x + rnd(-30,30), e.y - 40 + rnd(-20,20), {
          vx: rnd(-30,30), vy: rnd(-50,-15),
          life: 0.8, size: rnd(2,5), color: '255,140,60',
          type: 'dot', drag: 0.94, grow: 2
        });
      } else if(e.kind === 'b_blood' && Math.random() < 0.5){
        addParticle(e.x + rnd(-25,25), e.y - 20 + rnd(-30,20), {
          vx: rnd(-10,10), vy: rnd(20,50),
          life: 1.2, size: rnd(2,4), color: '220,20,50',
          type: 'dot', gravity: 40, drag: 0.98
        });
      } else if(e.kind === 'b_tree' && Math.random() < 0.4){
        addParticle(e.x + rnd(-30,30), e.y - 50 + rnd(-20,10), {
          vx: rnd(-15,15), vy: rnd(10,30),
          life: 1.5, size: 3, color: '150,220,100',
          type: 'dot', gravity: 20, drag: 0.98
        });
      }
    }
  }
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy);
  const canChase = state.grace <= 0 && state.t >= (e.calmUntil || 0);
  const chaseDist = e.elite ? 600 : 320;
  if(e.frozen > 0){
    e.chasing = false;
  } else if(canChase && d < chaseDist){
    e.chasing = true;
    const atkRange = e.elite ? 95 : 46;
    if(d > atkRange){
      const sp = e.elite ? 108 : 92;
      e.x += dx/d * sp * dt; e.y += dy/d * sp * dt;
    } else {
      e.atkCd -= dt;
      if(e.atkCd <= 0){
        e.atkCd = e.elite ? 1.2 : 1.5;
        damagePlayer(e);
      }
    }
    if(e.elite){
      e.abilityCd -= dt;
      if(e.abilityCd <= 0 && d < 350){
        e.abilityCd = 4.2;
        effects.push({ type:'shockwave', x:e.x, y:e.y - 10, maxR:320,
          color:'255,110,160', life:0.55, maxLife:0.55, width:9 });
        shake(7, 0.22);
        screenFlash('rgba(255,80,140,.24)', 320);
        if(d < 320){
          playerInvuln = 0;
          damagePlayer({ atk: e.atk * 1.4, x: e.x, y: e.y });
        }
      }
    }
  } else {
    e.chasing = false;
    e.wanderT -= dt;
    if(e.wanderT <= 0){
      e.wanderT = rnd(1.2, 3.2);
      e.wanderDir = rnd(0, Math.PI*2);
      e.wanderMove = Math.random() < 0.6;
    }
    if(e.wanderMove){
      e.x += Math.cos(e.wanderDir) * 32 * dt;
      e.y += Math.sin(e.wanderDir) * 32 * dt;
    }
  }
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
}
function updateCamera(dt){
  const tx = P.x - W/2, ty = P.y - H/2;
  if(!isNum(tx) || !isNum(ty)) return;
  state.camX += (tx - state.camX) * Math.min(1, dt*9);
  state.camY += (ty - state.camY) * Math.min(1, dt*9);
}
function updateInteract(){
  state.nearHerb = null;
  let hd = 78;
  for(const h of state.herbs){
    if(!h.alive) continue;
    const d = Math.hypot(h.x - P.x, h.y - P.y);
    if(d < hd){ hd = d; state.nearHerb = h; }
  }
  const hb = $('herbBtn');
  if(hb) hb.style.display = state.nearHerb ? 'block' : 'none';
}
function updateEffects(dt){
  for(let i = effects.length - 1; i >= 0; i--){
    effects[i].life -= dt;
    if(effects[i].life <= 0) effects.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y += f.vy * dt;
    if(f.life <= 0) floats.splice(i, 1);
  }
  for(let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if(beams[i].life <= 0) beams.splice(i, 1);
  }
  if(state.shakeT > 0) state.shakeT = Math.max(0, state.shakeT - dt);
  if(state.shield > 0){
    state.shieldTime -= dt;
    if(state.shieldTime <= 0){ state.shield = 0; state.shieldTime = 0; }
  }
}
function updateSkillUI(){
  for(let slot = 0; slot < 8; slot++){
    const btn = $('skillBtn' + slot);
    if(!btn) continue;
    const mask = btn.querySelector('.cdMask');
    const nameEl = btn.querySelector('.skName');
    const mpEl = btn.querySelector('.skMp');
    if(!mask || !nameEl || !mpEl) continue;
    const skillId = G.equipped[slot];
    if(skillId == null){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = '空'; mpEl.textContent = '—'; continue;
    }
    const sk = SKILL_LIBRARY[skillId];
    if(!sk || !G.unlockedSkills.has(skillId)){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = '未悟'; mpEl.textContent = '—'; continue;
    }
    btn.classList.remove('empty');
    nameEl.textContent = sk.key;
    mpEl.textContent = sk.mp + '灵';
    const cd = G.cd[skillId] || 0;
    if(cd > 0){
      mask.style.height = (cd / sk.cd * 100) + '%';
      btn.classList.add('cooling');
    } else {
      mask.style.height = '0%'; btn.classList.remove('cooling');
    }
    if(G.mp < sk.mp) btn.classList.add('noMp'); else btn.classList.remove('noMp');
  }
}

let skillBookOpen = false;

function toggleSkillBook(){ if(!state.started) return; if(skillBookOpen) closeSkillBook(); else openSkillBook(); }
function openSkillBook(){ if(skillBookOpen) return; skillBookOpen = true; selectedSlot = 0; renderSkillBook(); const el = $('skillBookOverlay'); if(el) el.style.display = 'flex'; }
function closeSkillBook(){ skillBookOpen = false; const el = $('skillBookOverlay'); if(el) el.style.display = 'none'; }
function renderSkillBook(){
  const slotsEl = $('skillBookSlots');
  const libEl = $('skillBookLibrary');
  if(!slotsEl || !libEl) return;
  slotsEl.innerHTML = ''; libEl.innerHTML = '';
  for(let i = 0; i < 8; i++){
    const skillId = G.equipped[i];
    const sk = skillId != null ? SKILL_LIBRARY[skillId] : null;
    const b = document.createElement('button');
    b.className = 'skSlotBtn' + (i === selectedSlot ? ' selected' : '');
    b.innerHTML = `
      <span class="slotNum">${i+1}</span>
      <span class="slotKey" style="color:${sk?`rgba(${sk.color},1)`:'#555'}">${sk?sk.key:'—'}</span>
      <span class="slotName">${sk?sk.name:'空'}</span>
    `;
    b.onclick = () => { selectedSlot = i; renderSkillBook(); };
    slotsEl.appendChild(b);
  }
  for(const id of ALL_SKILL_IDS){
    const sk = SKILL_LIBRARY[id];
    if(!sk) continue;
    const unlocked = G.unlockedSkills.has(id);
    const equippedIn = G.equipped.indexOf(id);
    const card = document.createElement('div');
    card.className = 'skCard' + (equippedIn >= 0 ? ' equipped' : '') + (unlocked ? '' : ' locked');
    let tag = '';
    if(equippedIn >= 0) tag = `<div class="cardTag">已装备 · 槽 ${equippedIn+1}</div>`;
    else if(!unlocked){
      if(id >= 14) tag = `<div class="cardLock">🔒 击败${BIOMES[id-14].name}妖王解锁</div>`;
      else tag = `<div class="cardLock">🔒 境界未到</div>`;
    }
    card.innerHTML = `
      <div class="cardTop">
        <span class="cardKey" style="color:${unlocked?`rgba(${sk.color},1)`:'#888'}">${sk.key}</span>
        <span class="cardName">${sk.name}</span>
      </div>
      <div class="cardStats">耗灵 ${sk.mp} · CD ${sk.cd}s</div>
      ${tag}
    `;
    if(unlocked){
      card.onclick = () => {
        const otherSlot = G.equipped.indexOf(id);
        if(otherSlot >= 0 && otherSlot !== selectedSlot){
          const tmp = G.equipped[selectedSlot];
          G.equipped[selectedSlot] = id;
          G.equipped[otherSlot] = tmp;
        } else if(otherSlot !== selectedSlot){
          G.equipped[selectedSlot] = id;
        }
        renderSkillBook(); updateSkillUI(); save();
        toast('已装备 · ' + sk.name);
      };
    }
    libEl.appendChild(card);
  }
}

/* ============ 地面绘制 ============ */
function drawGround(){
  const T = 80;
  const x0 = Math.floor(state.camX / T) - 1;
  const x1 = Math.ceil((state.camX + W) / T) + 1;
  const y0 = Math.floor(state.camY / T) - 1;
  const y1 = Math.ceil((state.camY + H) / T) + 1;
  if(!isFinite(x0) || !isFinite(x1) || !isFinite(y0) || !isFinite(y1)) return;
  if(x1 - x0 > 200 || y1 - y0 > 200) return;
  const bio = BIOMES[state.biome] || BIOMES[0];
  const bi = state.biome;
  for(let ty = y0; ty < y1; ty++){
    for(let tx = x0; tx < x1; tx++){
      const h = hash2(tx, ty);
      ctx.fillStyle = `hsl(${bio.h1 + h*bio.h2},${bio.s1 + h*bio.s2}%,${bio.l1 + h*bio.l2}%)`;
      ctx.fillRect(tx*T, ty*T, T+1, T+1);
      if(h > 0.38 && bi !== 5 && bi !== 7){
        ctx.fillStyle = `hsla(${bio.h1 + h*bio.h2 + 14},${bio.s1 + h*bio.s2 + 8}%,${bio.l1 + h*bio.l2 + 10}%,.6)`;
        for(let i=0;i<3;i++){
          const px = tx*T + hash2(tx*3+i, ty*7+i*13) * T;
          const py = ty*T + hash2(tx*11+i*5, ty*3+i) * T;
          ctx.fillRect(px, py, 2.5, 8);
        }
      }
      if(bi === 5 && h > 0.82){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.arc(fx, fy, 1.6, 0, 7); ctx.fill();
      } else if(bi === 1 && h > 0.9){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        const fl = 0.55 + Math.sin(state.t*3 + h*10) * 0.35;
        ctx.fillStyle = `rgba(255,100,40,${fl * 0.7})`;
        ctx.beginPath(); ctx.arc(fx, fy, 2.8, 0, 7); ctx.fill();
      } else if(bi === 7 && h > 0.88){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        ctx.fillStyle = 'rgba(255,230,150,.85)';
        ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, 7); ctx.fill();
      } else if(bi === 3 && h > 0.92){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        const fl = 0.5 + Math.sin(state.t*2 + h*8) * 0.5;
        ctx.fillStyle = `rgba(150,120,255,${fl * 0.8})`;
        ctx.beginPath(); ctx.arc(fx, fy, 2.4, 0, 7); ctx.fill();
      } else if(bi === 0 && h > 0.9){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        ctx.fillStyle = h > 0.96 ? 'rgba(255,240,160,.75)' : 'rgba(210,200,255,.65)';
        ctx.beginPath(); ctx.arc(fx, fy, 2.6, 0, 7); ctx.fill();
      } else if(bi === 4 && h > 0.9){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        ctx.fillStyle = 'rgba(255,220,140,.7)';
        ctx.beginPath(); ctx.arc(fx, fy, 2, 0, 7); ctx.fill();
      } else if(bi === 8 && h > 0.92){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        const fl = 0.4 + Math.sin(state.t*3 + h*6) * 0.4;
        ctx.fillStyle = `rgba(255,40,60,${fl * 0.8})`;
        ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, 7); ctx.fill();
      } else if(bi === 9 && h > 0.9){
        const fx = tx*T + 30 + hash2(tx*7, ty*11) * (T-60);
        const fy = ty*T + 30 + hash2(tx*13, ty*5) * (T-60);
        const fl = 0.5 + Math.sin(state.t*2 + h*12) * 0.5;
        ctx.fillStyle = `rgba(220,200,255,${fl * 0.85})`;
        ctx.beginPath(); ctx.arc(fx, fy, 1.8, 0, 7); ctx.fill();
      }
    }
  }
}
function drawLake(lake){
  ctx.save(); ctx.translate(lake.x, lake.y);
  let c0, c1, c2, strokeColor;
  if(lake.type === 'lava'){ c0='#ffaa40'; c1='#cc2200'; c2='rgba(60,20,10,.8)'; strokeColor='rgba(255,180,80,.35)'; }
  else if(lake.type === 'blood'){ c0='#8a1a2a'; c1='#4a0818'; c2='rgba(30,4,10,.8)'; strokeColor='rgba(200,50,70,.28)'; }
  else if(lake.type === 'ice'){ c0='#bfe8f8'; c1='#7fb8d8'; c2='rgba(150,200,230,.75)'; strokeColor='rgba(255,255,255,.5)'; }
  else if(lake.type === 'spirit'){ c0='#ffd870'; c1='#e8a840'; c2='rgba(120,80,20,.6)'; strokeColor='rgba(255,240,180,.4)'; }
  else if(lake.type === 'swamp'){ c0='#4a6a30'; c1='#2a4a18'; c2='rgba(20,30,10,.85)'; strokeColor='rgba(150,200,100,.25)'; }
  else if(lake.type === 'oasis'){ c0='#5aa8c8'; c1='#2a7a9a'; c2='rgba(20,80,120,.75)'; strokeColor='rgba(180,240,255,.42)'; }
  else if(lake.type === 'star'){ c0='#5a4aa0'; c1='#2a1a6a'; c2='rgba(10,4,40,.85)'; strokeColor='rgba(200,180,255,.5)'; }
  else { c0='#3f8a9a'; c1='#2a627a'; c2='rgba(26,60,74,.65)'; strokeColor='rgba(150,240,250,.24)'; }
  const g = ctx.createRadialGradient(0,0,0,0,0,Math.max(1,lake.rx));
  g.addColorStop(0,c0); g.addColorStop(.72,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0,0,lake.rx,lake.ry,0,0,7); ctx.fill();
  ctx.strokeStyle = strokeColor; ctx.lineWidth = 2;
  for(let i=0;i<3;i++){
    const rr = (state.t*26 + i*52) % (lake.rx*1.7);
    ctx.globalAlpha = Math.max(0, 1 - rr/(lake.rx*1.7));
    ctx.beginPath(); ctx.ellipse(0,0,rr, rr*lake.ry/lake.rx, 0, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawBamboo(p){
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0,0,16,6,0,0,7); ctx.fill();
  for(let i=0;i<3;i++){
    const ox = (i-1)*8 + Math.sin(p.seed + i)*3;
    const h  = 76 + Math.sin(p.seed*2 + i)*22;
    const sway = Math.sin(state.t*1.3 + p.seed + i) * 2;
    ctx.strokeStyle = '#4a8f57'; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(ox,0); ctx.quadraticCurveTo(ox, -h*0.5, ox+sway, -h); ctx.stroke();
    ctx.fillStyle = '#5ea86b';
    for(let j=0;j<3;j++){
      const ly = -h*0.55 - j*13, lx = ox + sway*(j/3);
      ctx.beginPath(); ctx.ellipse(lx+9, ly, 10, 3, -0.42 + Math.sin(state.t*1.6+i+j)*0.1, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(lx-9, ly-7, 10, 3, 0.42 - Math.sin(state.t*1.6+i+j)*0.1, 0, 7); ctx.fill();
    }
  }
  ctx.restore();

/* ============ 地标绘制（20 种，按 r 缩放） ============ */
function drawLandmark(lm){
  const scale = lm.r / 60;
  const t = state.t;
  ctx.save();
  ctx.translate(lm.x, lm.y);
  ctx.scale(scale, scale);
  const seed = lm.seed;

  switch(lm.kind){
    case 'pagoda': {
      // 中国式塔楼：屋基 + 三层塔身 + 檐角 + 灯笼 + 炊烟
      ctx.fillStyle = 'rgba(0,0,0,.32)';
      ctx.beginPath(); ctx.ellipse(0, 6, 60, 16, 0, 0, 7); ctx.fill();
      // 地基
      ctx.fillStyle = '#5a4a30';
      ctx.fillRect(-52, -8, 104, 14);
      // 三层
      for(let i=0;i<3;i++){
        const y = -8 - i*32;
        const w = 50 - i*8;
        // 塔身
        ctx.fillStyle = '#7aa85a';
        ctx.fillRect(-w, y - 24, w*2, 24);
        // 竹纹
        ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.2;
        for(let k=-3;k<=3;k++){
          ctx.beginPath(); ctx.moveTo(k*13, y-24); ctx.lineTo(k*13, y); ctx.stroke();
        }
        // 檐
        ctx.fillStyle = i===2 ? '#3a7a3a' : '#4a7a3a';
        ctx.beginPath();
        ctx.moveTo(-w-8, y-24);
        ctx.lineTo(0, y-24-18);
        ctx.lineTo(w+8, y-24);
        ctx.lineTo(w+16, y-26);
        ctx.lineTo(0, y-24-20);
        ctx.lineTo(-w-16, y-26);
        ctx.closePath();
        ctx.fill();
        // 檐脊
        ctx.strokeStyle = '#2a4a1a'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-w-8, y-24); ctx.lineTo(w+8, y-24);
        ctx.stroke();
        // 窗
        if(i<2){
          ctx.fillStyle = '#f4e8b0';
          ctx.fillRect(-w+8, y-18, 10, 8);
          ctx.fillRect(w-18, y-18, 10, 8);
        }
      }
      // 顶层光珠
      ctx.fillStyle = '#c8a45c';
      ctx.beginPath(); ctx.arc(0, -110, 5, 0, 7); ctx.fill();
      ctx.shadowColor = '#ffdc8c'; ctx.shadowBlur = 15;
      ctx.fillStyle = `rgba(255,220,140,${0.7 + Math.sin(t*3)*0.3})`;
      ctx.beginPath(); ctx.arc(0, -110, 3, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      // 门
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(-12, -32, 24, 24);
      // 灯笼
      const glow = 0.6 + Math.sin(t*3+seed)*0.4;
      ctx.fillStyle = `rgba(255,200,100,${glow})`;
      ctx.shadowColor = '#ffcc60'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(-20, -50, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(20, -50, 4, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      // 炊烟
      for(let i=0;i<3;i++){
        const sy = -130 - i*12 - Math.sin(t*0.6+i)*4;
        const sx = Math.sin(t*0.8 + i*2) * 10;
        ctx.fillStyle = `rgba(200,200,200,${0.28 - i*0.08})`;
        ctx.beginPath(); ctx.arc(sx, sy, 6 + i*3, 0, 7); ctx.fill();
      }
      break;
    }
    case 'stoneLantern': {
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.ellipse(0, 4, 26, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#7a7a7a';
      ctx.fillRect(-16, -6, 32, 10);
      ctx.fillStyle = '#9a9a9a';
      ctx.fillRect(-6, -50, 12, 46);
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath();
      ctx.moveTo(-20, -50); ctx.lineTo(-16, -76); ctx.lineTo(16, -76); ctx.lineTo(20, -50);
      ctx.closePath(); ctx.fill();
      // 灯窗
      const glow = 0.7 + Math.sin(t*2.5+seed)*0.3;
      ctx.fillStyle = `rgba(255,220,140,${glow})`;
      ctx.shadowColor = '#ffdc8c'; ctx.shadowBlur = 22;
      ctx.fillRect(-10, -70, 20, 16);
      ctx.shadowBlur = 0;
      // 顶盖
      ctx.fillStyle = '#6a6a6a';
      ctx.beginPath();
      ctx.moveTo(-24, -76); ctx.lineTo(0, -92); ctx.lineTo(24, -76);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c8a45c';
      ctx.beginPath(); ctx.arc(0, -94, 3, 0, 7); ctx.fill();
      break;
    }
    case 'volcanoShrine': {
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.beginPath(); ctx.ellipse(0, 4, 70, 18, 0, 0, 7); ctx.fill();
      // 台阶
      ctx.fillStyle = '#3a1a10';
      ctx.beginPath();
      ctx.moveTo(-70, 0); ctx.lineTo(-58, -20); ctx.lineTo(58, -20); ctx.lineTo(70, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4a2a1a';
      ctx.beginPath();
      ctx.moveTo(-58, -20); ctx.lineTo(-46, -38); ctx.lineTo(46, -38); ctx.lineTo(58, -20);
      ctx.closePath(); ctx.fill();
      // 祭坛体
      ctx.fillStyle = '#1a0808';
      ctx.beginPath();
      ctx.moveTo(-46, -38); ctx.lineTo(-30, -80); ctx.lineTo(30, -80); ctx.lineTo(46, -38);
      ctx.closePath(); ctx.fill();
      // 熔岩裂纹
      const fl = 0.6 + Math.sin(t*2.5+seed)*0.4;
      ctx.strokeStyle = `rgba(255,120,40,${fl})`;
      ctx.shadowColor = '#ff7020'; ctx.shadowBlur = 20;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-20, -40); ctx.lineTo(-10, -60); ctx.lineTo(5, -55); ctx.lineTo(15, -75);
      ctx.stroke();
