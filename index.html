function bladeOutline(edge, halfL, halfW){
  const P2 = [];
  const N = 16;
  switch(edge){
    case 'flame': {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        const x = -halfL + 2*halfL*t;
        const flick = Math.sin(t * Math.PI * 5) * halfW * 0.35 * Math.sin(t * Math.PI);
        P2.push({ x, y: -halfW * (1 - Math.pow(t, 3) * 0.85) - halfW * 0.25 * Math.sin(t*Math.PI*9) * (1-t) - flick * 0.4 });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        const x = -halfL + 2*halfL*t;
        P2.push({ x, y: halfW * (1 - Math.pow(t, 2.2) * 0.9) * 0.55 + halfW * 0.18 * Math.sin(t*Math.PI*7) });
      }
      break;
    }
    case 'spike': {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        const x = -halfL + 2*halfL*t;
        const jag = (i % 2 === 0 ? 1 : 0.62) * (1 - t * 0.7);
        P2.push({ x, y: -halfW * jag });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        const x = -halfL + 2*halfL*t;
        const jag = (i % 2 === 0 ? 0.55 : 0.85) * (1 - t * 0.75);
        P2.push({ x, y: halfW * jag });
      }
      break;
    }
    case 'crystal': {
      const pts = [[-halfL, -halfW*0.55],[-halfL*0.35,-halfW*1.05],[0,-halfW*0.8],[halfL*0.45,-halfW*0.9],[halfL*0.85,-halfW*0.4],[halfL,0],
                   [halfL*0.85, halfW*0.45],[halfL*0.4, halfW*0.75],[0, halfW*0.65],[-halfL*0.4, halfW*0.95],[-halfL, halfW*0.5]];
      for(const q of pts) P2.push({ x:q[0], y:q[1] });
      break;
    }
    case 'wave': {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: -halfW * (1 - t*t*0.7) + Math.sin(t*Math.PI*3)*halfW*0.22*(1-t) });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: halfW * (0.5 - t*0.42) + Math.sin(t*Math.PI*3 + 0.7)*halfW*0.15*(1-t) });
      }
      break;
    }
    case 'jagged': {
      for(let i = 0; i <= 12; i++){
        const t = i / 12;
        const side = i % 2 === 0 ? 1.15 : 0.75;
        P2.push({ x: -halfL + 2*halfL*t, y: -halfW * side * (1 - t*0.6) });
      }
      for(let i = 12; i >= 0; i--){
        const t = i / 12;
        const side = i % 2 === 0 ? 0.95 : 0.6;
        P2.push({ x: -halfL + 2*halfL*t, y: halfW * side * (1 - t*0.7) });
      }
      break;
    }
    case 'starlight': {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: -halfW * Math.pow(1 - t, 0.85) });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: halfW * Math.pow(1 - t, 0.85) * 0.75 });
      }
      break;
    }
    case 'serpent': {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: -halfW * (1 - Math.pow(t, 2.8)) + Math.sin(t*Math.PI*2.2)*halfW*0.45 });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: halfW * (1 - Math.pow(t, 2.8)) * (1 + 0.3*Math.sin(t*Math.PI*2.2)) });
      }
      break;
    }
    case 'thin': {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: -halfW * (1 - t) * (1 - Math.pow(t, 5)) - 1 });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: halfW * (0.55 - t*0.5) * (1 - Math.pow(t, 5)) + 1 });
      }
      break;
    }
    default: {
      for(let i = 0; i <= N; i++){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: -halfW * (1 - Math.pow(t, 6)) });
      }
      for(let i = N; i >= 0; i--){
        const t = i / N;
        P2.push({ x: -halfL + 2*halfL*t, y: halfW * (0.62 - Math.pow(t, 6) * 0.62) });
      }
    }
  }
  return P2;
}

function drawSwordInLocal(){
  const w = currentWeapon() || WEAPONS[0];
  const total = P.swing > 0.26 ? P.swing : 0.26;
  const prog = clamp(1 - P.swing / total, 0, 1);
  const eased = 1 - Math.pow(1 - prog, 2.4);
  const base = P.swingAngle;
  const sweep = Math.PI * 1.0;
  const side = P.swingSide;
  const start = base - sweep/2 * side;
  const cur = start + sweep * eased * side;
  ctx.save();
  ctx.translate(0, -28);
  const trailA = Math.pow(1 - prog, 0.6);
  const a1 = Math.min(start, cur), a2 = Math.max(start, cur);
  const g = ctx.createRadialGradient(0,0,12,0,0,112);
  g.addColorStop(0, `rgba(${w.color},0)`);
  g.addColorStop(0.5, `rgba(${w.color},0.55)`);
  g.addColorStop(1, 'rgba(240,250,255,0)');
  ctx.globalAlpha = trailA * 0.6;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,112, a1, a2); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = trailA * 0.9;
  ctx.strokeStyle = `rgba(${w.color},0.95)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0,0,108, a1, a2); ctx.stroke();
  ctx.globalAlpha = trailA * 0.8;
  ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0,0,102, a1, a2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.rotate(cur);
  ctx.translate(13, 0);
  /* 剑尖朝外：剑身局部 +X 即剑尖方向，旋转至与径向 cur 一致，
     剑柄留在半径 13 的内侧，挥砍时刃口始终朝外 */
  ctx.save();
  ctx.shadowColor = `rgba(${w.color},1)`; ctx.shadowBlur = 18;
  drawBladeBody(w, 46, 5.2, state.t, 1);
  ctx.restore();
  ctx.save();
  /* 剑尖灵光（局部 +X 端点） */
  ctx.translate(46, 0);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.shadowColor = `rgba(${w.color},1)`; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
  weaponAura(w, P.x, P.y, 1.4, 0);
}

function drawEnemy(e){
  const alpha = e.dead ? Math.max(0, e.deadTimer / (e.elite?1.4:0.55)) : 1;
  const wob = Math.sin(state.t*6 + e.seed)*2;
  const scale = e.elite ? 5.0 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(e.x, e.y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,0, e.elite?36:15, e.elite?14:6, 0,0,7); ctx.fill();
  const glowR = e.elite ? 110 : (e.isHuman ? 45 : 30);
  const g = ctx.createRadialGradient(0,-40,3,0,-40,glowR);
  g.addColorStop(0, e.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-40,glowR,0,7); ctx.fill();
  if(e.frozen > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(160,230,255,.42)';
    ctx.beginPath(); ctx.ellipse(0,-30+wob,26,34,0,0,7); ctx.fill();
    ctx.restore();
  }
  if(e.elite) drawBossBody(e, state.t, wob);
  else drawEnemyBody(e, state.t, wob);
  ctx.restore();
  if(!e.dead && !e.elite && e.hp < e.maxHp){
    const w = 32, h = 4;
    const bx = e.x - w/2, by = e.y - 56;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(bx-1, by-1, w+2, h+2);
    ctx.fillStyle = '#5a2020'; ctx.fillRect(bx, by, w, h);
    ctx.fillStyle = '#e8705a';
    ctx.fillRect(bx, by, w * Math.max(0, e.hp/e.maxHp), h);
  }
}

function drawSwordArray(){
  if(!isSwordArrayOn()) return;
  const n = swordCount();
  if(n === 0) return;
  const w = currentWeapon() || WEAPONS[0];
  const primaryRGB = isSwordGod() ? '255,220,120' : w.color;
  const radius = 58;
  const RY = 0.55;                       // 环轨的纵向压扁比
  for(let i = 0; i < n; i++){
    const ang = state.swordAngle + i * (Math.PI*2 / n);
    const sx = P.x + Math.cos(ang) * radius;
    const sy = P.y - 26 + Math.sin(ang) * radius * RY;
    /* 椭圆轨道上该点的「朝外」方向：对 (cos ang, RY*sin ang) 求切向后再取法向，
       直接用真实角度会让剑身在压扁的环上歪斜 */
    const outAng = Math.atan2(Math.sin(ang) * RY, Math.cos(ang));
    const sw = Math.sin(state.t * 3 + i) * 0.16;
    ctx.save();
    /* 先移到轨道点，再沿朝外方向把剑身整体外推，
       使剑柄落在环上、剑尖朝外，不会插进身体 */
    ctx.translate(sx, sy);
    ctx.rotate(outAng + sw);
    ctx.translate(14, 0);
    ctx.globalAlpha = 0.95;
    ctx.save();
    ctx.scale(1.25, 1.25);
    ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 12;
    drawBladeBody(w, 18, 2.3, state.t + i, 0.8);
    ctx.restore();

    ctx.fillStyle = `rgba(${primaryRGB},${0.5 + 0.5 * Math.sin(state.t * 8 + i)})`;
    ctx.beginPath();
    ctx.arc(sx + Math.cos(outAng) * 34, sy + Math.sin(outAng) * 34, 1.8, 0, 7);
    ctx.fill();
  }
  const innerN = Math.floor(n / 2) + 1;
  const innerR = 32;
  for(let i = 0; i < innerN; i++){
    const ang = state.swordInnerAngle + i * (Math.PI*2 / innerN);
    const sx = P.x + Math.cos(ang) * innerR;
    const sy = P.y - 26 + Math.sin(ang) * innerR * 0.6;
    const outAng = Math.atan2(Math.sin(ang) * 0.6, Math.cos(ang));
    ctx.save();
    ctx.translate(sx, sy);
    /* 内圈小剑同样剑尖朝外 */
    ctx.rotate(outAng);
    ctx.globalAlpha = 0.8;
    ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(220,245,255,0.9)';
    ctx.beginPath();
    ctx.moveTo(0,-11); ctx.lineTo(2.2,3); ctx.lineTo(0,9); ctx.lineTo(-2.2,3);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const side = Math.sin(state.t * 2) > 0 ? 1 : -1;
  ctx.save();
  ctx.translate(P.x - side * 30, P.y - 52);
  ctx.rotate(0.9 + Math.sin(state.t * 2.4) * 0.1);
  ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 16;
  drawBladeBody(w, 27, 3.2, state.t, 0.9);
  ctx.restore();
}
function drawProjectiles(){
  for(const pr of projectiles){
    ctx.save();
    ctx.translate(pr.x, pr.y);
    ctx.rotate(Math.atan2(pr.vy, pr.vx) + Math.PI/2);
    ctx.fillStyle = `rgba(${pr.color},1)`;
    if(pr.isEnemy){
      ctx.shadowColor = `rgba(${pr.color},1)`; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0,0,pr.r,0,7); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      const w = weaponOf(pr.weapon);
      ctx.shadowColor = `rgba(${pr.color},1)`; ctx.shadowBlur = 12;
      ctx.save();
      ctx.translate(0, -8);
      drawBladeBody(w, 17, 2.2, state.t, 0.7);
      ctx.restore();
    }
    ctx.restore();
  }
}
function drawBeams(){
  for(const b of beams){
    const a = b.life / b.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = `rgba(${b.color},1)`;
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath();
    for(let i = 0; i <= b.segs; i++){
      const tt = i / b.segs;
      let x = b.x1 + (b.x2 - b.x1) * tt;
      let y = b.y1 + (b.y2 - b.y1) * tt;
      if(i > 0 && i < b.segs){ x += rnd(-b.jitter, b.jitter); y += rnd(-b.jitter, b.jitter); }
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = `rgba(${b.sub || '255,255,255'},.95)`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for(let i = 0; i <= b.segs; i++){
      const tt = i / b.segs;
      let x = b.x1 + (b.x2 - b.x1) * tt;
      let y = b.y1 + (b.y2 - b.y1) * tt;
      if(i > 0 && i < b.segs){ x += rnd(-b.jitter, b.jitter) * 0.5; y += rnd(-b.jitter, b.jitter) * 0.5; }
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of particles){
    const a = p.life / p.maxLife;
    if(p.type === 'dot'){
      const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = `rgb(${p.color})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
      ctx.globalAlpha = a * 0.95;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawEffects(){
  for(const fx of effects){
    const t = fx.life / fx.maxLife;
    if(fx.type === 'fan'){
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = t * 0.7;
      ctx.fillStyle = `rgba(${fx.color},0.5)`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, fx.range, -fx.halfAngle, fx.halfAngle);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(fx.type === 'ring'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},0.9)`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(fx.type === 'shockwave'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t * 0.9;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * t + 1;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(fx.type === 'beam'){
      ctx.save();
      ctx.lineCap = 'round';
      ctx.globalAlpha = t * 0.35;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * (fx.core ? 1.5 : 1.0) * t + 10;
      ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
      ctx.globalAlpha = t;
      ctx.lineWidth = fx.width * t * 0.6 + 4;
      ctx.stroke();
      if(fx.core){
        ctx.globalAlpha = t;
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.lineWidth = Math.max(2, fx.width * t * 0.22);
        ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
      }
      ctx.restore();
    } else if(fx.type === 'slash'){
      const k = 1 - t;
      const L = fx.len * (0.55 + 0.45 * k);
      const wdt = (fx.thin || 4) * (0.4 + t * 0.6);
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = Math.min(1, t * 1.3);
      ctx.shadowColor = `rgba(${fx.color},1)`;
      ctx.shadowBlur = 14 * t;
      const grd = ctx.createLinearGradient(0, 0, L, 0);
      grd.addColorStop(0, `rgba(${fx.color},0)`);
      grd.addColorStop(0.55, `rgba(${fx.color},${0.85 * t})`);
      grd.addColorStop(1, `rgba(255,255,255,${t})`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(L * 0.18, 0);
      ctx.quadraticCurveTo(L * 0.62, -wdt * 1.6 * (1 - t * 0.4), L, 0);
      ctx.quadraticCurveTo(L * 0.62, wdt * 0.5, L * 0.18, 0);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = `rgba(255,255,255,${t * 0.95})`;
      ctx.lineWidth = Math.max(1, wdt * 0.3);
      ctx.beginPath();
      ctx.moveTo(L * 0.2, 0);
      ctx.quadraticCurveTo(L * 0.62, -wdt * 1.1 * (1 - t * 0.4), L, 0);
      ctx.stroke();
      ctx.restore();
    } else if(fx.type === 'pillar'){
      const k = 1 - t;
      const h = fx.maxR * 2.6 * (0.25 + 0.75 * Math.min(1, k * 2.2));
      const w = fx.width * (0.35 + 0.65 * t);
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.globalAlpha = t;
      const pg = ctx.createLinearGradient(0, 0, 0, -h);
      pg.addColorStop(0, `rgba(${fx.color},.85)`);
      pg.addColorStop(0.45, `rgba(${fx.color},.45)`);
      pg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(-w, 0);
      ctx.lineTo(-w * 0.35, -h);
      ctx.lineTo(w * 0.35, -h);
      ctx.lineTo(w, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.5 * t})`;
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, 0); ctx.lineTo(-w * 0.08, -h * 0.92); ctx.lineTo(w * 0.08, -h * 0.92); ctx.lineTo(w * 0.25, 0);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = t * 0.8;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, fx.maxR, fx.maxR * 0.5, 0, 0, 7); ctx.stroke();
      ctx.restore();
    } else if(fx.type === 'glow'){
      const r = fx.maxR * (0.4 + 0.6 * (1 - t));
      ctx.save();
      const gg = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, r);
      gg.addColorStop(0, `rgba(255,255,255,${0.75 * t})`);
      gg.addColorStop(0.35, `rgba(${fx.color},${0.5 * t})`);
      gg.addColorStop(1, `rgba(${fx.color},0)`);
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, 7); ctx.fill();
      ctx.restore();
    } else if(fx.type === 'runes'){
      const k = 1 - t;
      const R = fx.maxR * (0.5 + 0.5 * Math.min(1, k * 3));
      ctx.save();
      ctx.translate(fx.x, fx.y + 2);
      ctx.scale(1, 0.58);
      ctx.rotate(state.t * 1.6 + fx.i * 0.7);
      ctx.globalAlpha = t * 0.9;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = 2;
      ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.72, 0, Math.PI * 2); ctx.stroke();
      const segs = 8 + (fx.i % 4) * 2;
      for(let i = 0; i < segs; i++){
        const a1 = i / segs * Math.PI * 2;
        const a2 = a1 + Math.PI / segs;
        ctx.beginPath(); ctx.arc(0, 0, R * 0.86, a1, a2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a1) * R * 0.86, Math.sin(a1) * R * 0.86);
        ctx.lineTo(Math.cos(a1) * R, Math.sin(a1) * R);
        ctx.stroke();
      }
      for(let i = 0; i < 6; i++){
        const a = -state.t * 2.2 + i / 6 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R * 0.74, Math.sin(a) * R * 0.74);
        ctx.lineTo(Math.cos(a + 0.5) * R * 0.6, Math.sin(a + 0.5) * R * 0.6);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
      if(fx.label){
        ctx.save();
        ctx.globalAlpha = t * 0.85;
        ctx.font = `bold ${Math.round(fx.maxR * 0.5)}px "Songti SC","STSong",serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(${fx.color},1)`;
        ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 18;
        ctx.fillText(fx.label, fx.x, fx.y - 8);
        ctx.restore();
      }
    } else if(fx.type === 'falling'){
      const start = fx.maxLife + 0.05;
      const k = clamp((start - fx.life) / fx.maxLife, 0, 1);
      const dropH = 260;
      const y = fx.y - dropH * (1 - k);
      const trailLen = 60 + 120 * k;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.5 * k;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(fx.x, fx.y, (fx.meteor ? 46 : 34) * (0.6 + 0.4 * k),
        (fx.meteor ? 46 : 34) * 0.55 * (0.6 + 0.4 * k), 0, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
      const tg = ctx.createLinearGradient(fx.x, y - trailLen, fx.x, y);
      tg.addColorStop(0, `rgba(${fx.color},0)`);
      tg.addColorStop(1, `rgba(${fx.sub},.95)`);
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(fx.x - (fx.meteor ? 9 : 4), y);
      ctx.lineTo(fx.x, y - trailLen);
      ctx.lineTo(fx.x + (fx.meteor ? 9 : 4), y);
      ctx.closePath(); ctx.fill();
      ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 16;
      ctx.fillStyle = `rgba(${fx.sub},1)`;
      if(fx.meteor){
        ctx.beginPath(); ctx.arc(fx.x, y, 8, 0, 7); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(fx.x, y + 14); ctx.lineTo(fx.x + 3.5, y - 6); ctx.lineTo(fx.x, y - 18); ctx.lineTo(fx.x - 3.5, y - 6);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    } else if(fx.type === 'ghost'){
      ctx.save();
      ctx.globalAlpha = t * 0.42;
      ctx.translate(fx.x, fx.y);
      ctx.fillStyle = `rgba(${fx.color},1)`;
      ctx.beginPath();
      ctx.moveTo(-10, -2); ctx.lineTo(10, -2); ctx.lineTo(8, -36); ctx.lineTo(-8, -36);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -46, 8, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawDomain(){
  if(state.domain <= 0) return;
  const R = state.domainRadius;
  const c = state.domainColor || '255,220,140';
  const pulse = 0.85 + Math.sin(state.t * 6) * 0.12;
  ctx.save();
  ctx.globalAlpha = 0.18 * pulse;
  const bg = ctx.createRadialGradient(P.x, P.y + 4, 10, P.x, P.y + 4, R);
  bg.addColorStop(0, `rgba(${c}, 0.7)`);
  bg.addColorStop(1, `rgba(${c}, 0)`);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.9 * pulse;
  ctx.strokeStyle = `rgba(${c}, 1)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.stroke();
  ctx.restore();
}
function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const f of floats){
    const a = f.life / f.maxLife;
    const fs = (f.big ? 21 : 17);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.font = `bold ${fs.toFixed(1)}px "Songti SC","STSong",serif`;
    ctx.strokeStyle = 'rgba(0,0,0,0.82)';
    ctx.lineWidth = f.big ? 4.5 : 3.6;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
const motes = [];
for(let i=0;i<60;i++){
  motes.push({ x:Math.random(), y:Math.random(),
    s:Math.random()*1.8+0.8, v:Math.random()*0.02+0.008,
    a:Math.random()*0.55+0.25 });
}
function drawMotes(dt){
  for(const m of motes){
    m.y -= m.v * dt;
    if(m.y < -0.02){ m.y = 1.02; m.x = Math.random(); }
    ctx.fillStyle = `rgba(180,255,230,${m.a})`;
    ctx.beginPath(); ctx.arc(m.x*W, m.y*H, m.s, 0, 7); ctx.fill();
  }
}
function collectVisibleProps(){
  const cx0 = Math.floor((state.camX - 120) / CELL);
  const cx1 = Math.floor((state.camX + W + 120) / CELL);
  const cy0 = Math.floor((state.camY - 160) / CELL);
  const cy1 = Math.floor((state.camY + H + 120) / CELL);
  const out = [];
  if(!isFinite(cx0) || !isFinite(cx1) || !isFinite(cy0) || !isFinite(cy1)) return out;
  if(cx1 - cx0 > 30 || cy1 - cy0 > 30) return out;
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const c = getChunk(cx, cy);
      for(const p of c.props) out.push(p);
    }
  }
  return out;
}
function collectVisibleLakes(){
  const lx0 = Math.floor((state.camX - 200) / LAKE_CELL);
  const lx1 = Math.floor((state.camX + W + 200) / LAKE_CELL);
  const ly0 = Math.floor((state.camY - 200) / LAKE_CELL);
  const ly1 = Math.floor((state.camY + H + 200) / LAKE_CELL);
  const out = [];
  if(!isFinite(lx0) || !isFinite(lx1) || !isFinite(ly0) || !isFinite(ly1)) return out;
  if(lx1 - lx0 > 20 || ly1 - ly0 > 20) return out;
  for(let ly = ly0; ly <= ly1; ly++){
    for(let lx = lx0; lx <= lx1; lx++){
      const lake = lakeAt(lx, ly);
      if(lake) out.push(lake);
    }
  }
  return out;
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx = 0, sy = 0;
  if(state.shakeT > 0){
    const k = state.shakeT / 0.12;
    sx = (Math.random()-0.5) * state.shakeMag * k * 2;
    sy = (Math.random()-0.5) * state.shakeMag * k * 2;
  }
  const camX = state.camX - sx, camY = state.camY - sy;
  ctx.save();
  ctx.translate(-camX, -camY);
  drawGround();
  for(const site of collectVisibleSites()) drawSiteGround(site);
  for(const lake of collectVisibleLakes()) drawLake(lake);
  drawHazards();
  for(const h of state.herbs){
    if(!h.alive) continue;
    if(h.x < camX-60 || h.x > camX+W+60 || h.y < camY-60 || h.y > camY+H+60) continue;
    drawHerb(h);
  }
  drawDomain();
  for(const p of particles){
    if(p.type !== 'dot') continue;
    const a = p.life / p.maxLife;
    const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
    ctx.globalAlpha = a * 0.3;
    ctx.fillStyle = `rgb(${p.color})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
    ctx.globalAlpha = a * 0.95;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const propsList = collectVisibleProps();
  const list = [];
  for(const p of propsList){
    if(p.x < camX-80 || p.x > camX+W+80 || p.y < camY-160 || p.y > camY+H+80) continue;
    list.push({ y: p.y, kind: 0, ref: p });
  }
  for(const st of collectVisibleSites()){
    for(const b of st.buildings){
      const pad = b.r * 3;
      if(b.x < camX - pad || b.x > camX + W + pad ||
         b.y < camY - pad * 2 || b.y > camY + H + pad) continue;
      list.push({ y: b.y, kind: 3, ref: b });
    }
    for(const sc of st.scenery){
      if(sc.x < camX - 160 || sc.x > camX + W + 160 ||
         sc.y < camY - 320 || sc.y > camY + H + 160) continue;
      list.push({ y: sc.y, kind: 5, ref: sc });
    }
  }
  for(const e of state.enemies){
    if(!isNum(e.x) || !isNum(e.y)) continue;
    const pad = e.elite ? 400 : 120;
    if(e.x < camX-pad || e.x > camX+W+pad || e.y < camY-pad*1.5 || e.y > camY+H+pad) continue;
    list.push({ y: e.y, kind: 1, ref: e });
  }
  list.push({ y: P.y, kind: 2, ref: null });
  list.sort((a,b) => a.y - b.y);
  for(const o of list){
    if(o.kind === 0) drawPropByType(o.ref);
    else if(o.kind === 1) drawEnemy(o.ref);
    else if(o.kind === 2) drawPlayer();
    else if(o.kind === 3) drawLandmark(o.ref);
    else if(o.kind === 5) drawBigProp(o.ref);
  }
  drawSwordArray();
  drawProjectiles();
  drawBeams();
  for(const p of particles){
    if(p.type === 'dot') continue;
    const a = p.life / p.maxLife;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawEffects();
  drawFloats();
  ctx.restore();
  const bio = BIOMES[state.biome] || BIOMES[0];
  ctx.fillStyle = bio.tint;
  ctx.fillRect(0,0,W,H);
  drawMotes(dt);
  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);
}

let hudAcc = 0;
function renderHUD(){
  const rn = $('realmName'); if(rn) rn.textContent = isMaxLv() ? '化神期·圆满' : realmText();
  const hpF = $('hpFill'); if(hpF) hpF.style.width = (G.hp/G.maxHp*100).toFixed(1)+'%';
  const hpL = $('hpLbl'); if(hpL) hpL.textContent = '气血 ' + fmt(G.hp) + ' / ' + fmt(G.maxHp);

  const need = qiNeed();
  const qiF = $('qiFill'), qiL = $('qiLbl');
  if(isMaxLv()){
    if(qiF) qiF.style.width = '100%';
    if(qiL) qiL.textContent = '化神圆满 · 修为 ' + fmt(G.qi);
  } else {
    if(qiF) qiF.style.width = Math.min(100, G.qi/need*100).toFixed(1)+'%';
    if(qiL) qiL.textContent = '修为 ' + fmt(G.qi) + ' / ' + fmt(need);
  }
  const sl = $('stoneLine'); if(sl) sl.textContent = '灵石 ' + fmt(G.stones);
  const w = currentWeapon();
  const wl = $('weaponLine'); if(wl) wl.textContent = '「' + w.name + '」' + ' +' + Math.round(w.atkBonus*100) + '%';
  const swCnt = swordCount();
  let sw = '剑阵 · 未悟';
  if(isSwordGod()) sw = '剑阵 · ' + swCnt + ' 剑齐出';
  else if(isSwordArrayOn()) sw = '剑阵 · ' + swCnt + ' 剑环绕';
  const swl = $('swordLine'); if(swl) swl.textContent = sw;
  const bl = $('biomeLine');
  if(bl) bl.textContent = (BIOMES[state.biome]||BIOMES[0]).name + ' · 难度 ' + (state.biome + 1);
  const shl = $('shieldLine');
  if(shl){
    if(state.shield > 0){
      shl.style.display = 'block';
      shl.textContent = '护盾 ' + fmt(state.shield);
    } else shl.style.display = 'none';
  }
}
function updateBossBar(){
  let boss = null, bd = 1e9;
  for(const e of state.enemies){
    if(e.dead || !e.elite) continue;
    const screenX = e.x - state.camX;
    const screenY = e.y - state.camY;
    if(screenX < -100 || screenX > W + 100 || screenY < -100 || screenY > H + 100) continue;
    const d = Math.hypot(e.x-P.x, e.y-P.y);
    if(d < bd){ bd = d; boss = e; }
  }
  const bar = $('bossBar');
  if(!bar) return;
  if(boss){
    bar.style.display = 'flex';
    const bn = $('bossName'); if(bn) bn.textContent = boss.name;
    const pct = Math.max(0, boss.hp / boss.maxHp);
    const bf = $('bossHpFill'); if(bf) bf.style.width = (pct * 100).toFixed(1) + '%';
    const bt = $('bossHpText');
    if(bt) bt.textContent = fmt(Math.max(0, boss.hp)) + ' / ' + fmt(boss.maxHp);
  } else {
    bar.style.display = 'none';
  }
}

function buildSkillBar(){
  const bar = $('skillBar'); if(!bar) return;
  bar.innerHTML = '';
  for(let i = 0; i < 8; i++){
    const b = document.createElement('button');
    b.className = 'skillBtn'; b.id = 'skillBtn' + i;
    b.innerHTML = '<span class="skName"></span><span class="skMp"></span><div class="cdMask"></div>';
    b.addEventListener('pointerdown', ev=>{ ev.preventDefault(); castSkill(i); });
    bar.appendChild(b);
  }
}
const atkBtn = $('attackBtn');
if(atkBtn) atkBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); doAttack(); });
const herbBtn = $('herbBtn');
if(herbBtn) herbBtn.addEventListener('click', ()=>{
  if(!state.nearHerb || !state.nearHerb.alive) return;
  const h = state.nearHerb; h.alive = false;
  if(Math.random() < 0.6){
    const q = Math.floor(qiNeed() * 0.5);
    G.qi += q;
    toast('灵草 · 修为 +' + fmt(q));
  } else {
    G.mp = Math.min(G.maxMp, G.mp + Math.floor(G.maxMp * 0.4));
    toast('灵草 · 灵力恢复');
  }
  const idx = state.herbs.indexOf(h);
  if(idx >= 0) state.herbs.splice(idx, 1);
  renderHUD(); save();
});
const mapBtn = $('mapBtn');
if(mapBtn) mapBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleMap(); });
const mapCloseBtn = $('mapCloseBtn');
if(mapCloseBtn) mapCloseBtn.addEventListener('click', closeMap);
const mapOverlayEl = $('mapOverlay');
if(mapOverlayEl) mapOverlayEl.addEventListener('click', e=>{ if(e.target === mapOverlayEl) closeMap(); });
const skillBookBtn = $('skillBookBtn');
if(skillBookBtn) skillBookBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleSkillBook(); });
const skillBookCloseBtn = $('skillBookCloseBtn');
if(skillBookCloseBtn) skillBookCloseBtn.addEventListener('click', closeSkillBook);
const skillBookOverlayEl = $('skillBookOverlay');
if(skillBookOverlayEl) skillBookOverlayEl.addEventListener('click', e=>{ if(e.target === skillBookOverlayEl) closeSkillBook(); });
const bagBtn = $('bagBtn');
if(bagBtn) bagBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleBag(); });
const bagCloseBtn = $('bagCloseBtn');
if(bagCloseBtn) bagCloseBtn.addEventListener('click', closeBag);
const bagOverlayEl = $('bagOverlay');
if(bagOverlayEl) bagOverlayEl.addEventListener('click', e=>{ if(e.target === bagOverlayEl) closeBag(); });
const advanceBtn = $('advanceBtn');
if(advanceBtn) advanceBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); advanceRealm(); });
const menuBtn = $('menuBtn');
if(menuBtn) menuBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); backToMenu(); });
const saveBtn = $('saveBtn');
if(saveBtn) saveBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); manualSave(); });
const loadBtn = $('loadBtn');
if(loadBtn) loadBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); loadGame(); });
const restartBtn = $('restartBtn');
if(restartBtn) restartBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); restartGame(); });

function tryBreak(){
  if(!state.started || isMaxLv()) return;
  const need = qiNeed();
  if(G.qi < need) return;
  G.qi -= need;
  G.layer++;
  if(G.layer > MAX_LAYER){ G.layer = 1; G.realm++; }
  if(G.realm > MAX_REALM){ G.realm = MAX_REALM; G.layer = MAX_LAYER; }
  recalc(); G.hp = G.maxHp; G.mp = G.maxMp;
  refreshUnlockedSkills();
  toast('突破 · ' + realmText());
  renderHUD(); save();
  checkBiomeUnlocks();
}

function save(){
  try{
    localStorage.setItem('xiantu16', JSON.stringify({
      realm:G.realm, layer:G.layer, qi:G.qi, stones:G.stones,
      biome:state.biome,
      seenBiomes: Array.from(G.seenBiomes),
      equipped: G.equipped,
      unlockedSkills: Array.from(G.unlockedSkills),
      weapons: Array.from(G.weapons),
      currentWeapon: G.currentWeapon,
      px: P.x, py: P.y
    }));
  }catch(e){}
}
function load(){
  loadedPos = null;
  try{
    const d = JSON.parse(localStorage.getItem('xiantu16') || 'null');
    if(d){
      G.realm = d.realm|0;
      G.layer = d.layer|0 || 1;
      G.qi    = d.qi|0;
      G.stones= d.stones|0;
      if(typeof d.biome === 'number' && d.biome >= 0 && d.biome < BIOMES.length){
        if(G.realm >= (BIOMES[d.biome].realmReq || 0)) state.biome = d.biome;
      }
      if(Array.isArray(d.seenBiomes)){
        G.seenBiomes = new Set(d.seenBiomes.filter(n => typeof n === 'number' && n >= 0 && n < BIOMES.length));
      }
      for(let i = 0; i < BIOMES.length; i++) if(G.realm >= (BIOMES[i].realmReq || 0)) G.seenBiomes.add(i);
      G.seenBiomes.add(0);
      if(Array.isArray(d.equipped) && d.equipped.length === 8) G.equipped = d.equipped;
      if(Array.isArray(d.unlockedSkills)) G.unlockedSkills = new Set(d.unlockedSkills);
      if(Array.isArray(d.weapons)){ G.weapons = new Set(d.weapons); G.weapons.add(0); }
      if(typeof d.currentWeapon === 'number' && G.weapons.has(d.currentWeapon)){
        G.currentWeapon = d.currentWeapon;
      }
      if(isNum(d.px) && isNum(d.py)) loadedPos = { x: d.px, y: d.py };
    }
  }catch(e){}
}


let loadedPos = null;
let paused = false;

function backToMenu(){
  if(!state.started) return;
  save();
  paused = true;
  state.started = false;
  hazards.length = 0;
  state.vortex = null;
  closeMap(); closeSkillBook(); closeBag();
  const ss = $('startScreen');
  if(ss) ss.style.display = 'flex';
  const sb = $('startBtn');
  if(sb) sb.textContent = '继 续';
}

function resumeGame(){
  const ss = $('startScreen');
  if(ss) ss.style.display = 'none';
  const sb = $('startBtn');
  if(sb) sb.textContent = '继 续';
  paused = false;
  state.started = true;
  state.grace = Math.max(state.grace, 1.5);
  lastT = performance.now();
  toast('继续修行');
}

function manualSave(){
  if(!state.started) return;
  save();
  toast('已存档 · ' + realmText());
}

function loadGame(){
  if(!localStorage.getItem('xiantu16')){ toast('暂无存档'); return; }
  clearUnlockTimers();
  load();
  recalc();
  refreshUnlockedSkills();
  G.hp = G.maxHp; G.mp = G.maxMp;
  G.cd = {};
  for(const id of ALL_SKILL_IDS) G.cd[id] = 0;
  G.atkCd = 0;
  if(loadedPos){ P.x = loadedPos.x; P.y = loadedPos.y; }
  else {
    const o = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    P.x = o.x; P.y = o.y;
  }
  loadedPos = null;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  state.enemies.length = 0;
  state.herbs.length = 0;
  projectiles.length = 0;
  effects.length = 0;
  floats.length = 0;
  beams.length = 0;
  hazards.length = 0;
  state.vortex = null;
  state.domain = 0; state.shield = 0; state.grace = 3;
  chunks.clear(); lakeCache.clear(); siteCache.clear();
  if(!state.started){ resumeGame(); }
  buildSkillBar(); updateSkillUI(); renderHUD();
  closeMap(); closeSkillBook(); closeBag();
  toast('已读档 · ' + realmText());
  showBiomeBanner((BIOMES[state.biome] || BIOMES[0]).name);
}

function restartGame(){
  if(!confirm('重新开始将清空当前存档与进度，确定吗？')) return;
  try{ localStorage.removeItem('xiantu16'); }catch(e){}
  paused = false;
  loadedPos = null;
  G.realm = 0; G.layer = 1; G.qi = 0; G.stones = 0;
  G.equipped = [0,1,2,3,4,5,6,7];
  G.unlockedSkills = new Set();
  G.weapons = new Set([0]);
  G.currentWeapon = 0;
  G.seenBiomes = new Set([0]);
  clearUnlockTimers();
  G.cd = {}; G.atkCd = 0;
  state.biome = 0;
  state.started = false;
  const ss = $('startScreen');
  if(ss) ss.style.display = 'none';
  initGame();
  toast('已重新开始');
}

let lastT = performance.now();
let cleanTimer = 0;
let errorShown = false;
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  try {
    if(state.started){
      if(W < 10 || H < 10) resize();
      state.t += dt;
      if(state.grace > 0) state.grace = Math.max(0, state.grace - dt);
      if(playerInvuln > 0) playerInvuln = Math.max(0, playerInvuln - dt);
      if(!isMaxLv()){
        G.qi += cultSpeed() * dt;
        if(G.qi >= qiNeed()) tryBreak();
      }
      for(const id of ALL_SKILL_IDS){
        if(G.cd[id] > 0) G.cd[id] = Math.max(0, G.cd[id] - dt);
      }
      G.mp = Math.min(G.maxMp, G.mp + G.maxMp * 0.08 * dt);
      G.hp = Math.min(G.maxHp, G.hp + G.maxHp * 0.005 * dt);
      updatePlayer(dt);
      for(let i = state.enemies.length - 1; i >= 0; i--){
        const e = state.enemies[i];
        updateEnemy(e, dt);
        if(e.dead && e.deadTimer <= 0) state.enemies.splice(i, 1);
      }
      updateSwordArray(dt);
      updateProjectiles(dt);
      updateDomain(dt);
      updateCamera(dt);
      updateInteract();
      updateEffects(dt);
      updateParticles(dt);
      updateHazards(dt);
      maintainEnemies();
      maintainHerbs();
      updateSkillUI();
      updateBossBar();
      cleanTimer += dt;
      if(cleanTimer > 8){ cleanTimer = 0; cleanChunks(); }
      hudAcc += dt;
      if(hudAcc > 0.12){ hudAcc = 0; renderHUD(); }
      render(dt);
    }
  } catch(err){
    if(!errorShown){ errorShown = true; console.error('[仙途] 运行错误]', err); }
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    if(!isNum(P.x) || !isNum(P.y)){ P.x = origin.x; P.y = origin.y; }
    if(!isNum(state.camX) || !isNum(state.camY)){ state.camX = P.x - W/2; state.camY = P.y - H/2; }
    if(!isNum(G.hp) || G.hp <= 0) G.hp = 1;
    if(!isNum(G.mp) || G.mp < 0) G.mp = 0;
  }
  requestAnimationFrame(loop);
}

let saveTimer = 0;
function initGame(){
  load();
  recalc();
  refreshUnlockedSkills();
  checkBiomeUnlocks();
  G.hp = G.maxHp;
  G.mp = G.maxMp;
  G.cd = {};
  for(const id of ALL_SKILL_IDS) G.cd[id] = 0;
  G.atkCd = 0;
  if(W < 10 || H < 10) resize();
  const startBi = state.biome >= 0 && state.biome < BIOMES.length ? state.biome : 0;
  const origin = BIOME_ORIGIN[startBi];
  if(loadedPos){ P.x = loadedPos.x; P.y = loadedPos.y; loadedPos = null; }
  else { P.x = origin.x; P.y = origin.y; }
  P.swing = 0; P.flying = 0; P.escaping = 0;
  P.dir = 0; P.moving = false; P.anim = 0;
  P.escapeHit = new Set();
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  state.started = true;
  state.grace = 3;
  state.t = 0;
  state.nextSpawnT = 0;
  state.nextHerbT = 0;
  state.nextBossT = 15;
  state.swordCd = 0;
  state.domain = 0;
  state.biome = startBi;
  state.shakeT = 0;
  state.shield = 0; state.shieldTime = 0;
  state.enemies.length = 0;
  state.herbs.length = 0;
  particles.length = 0;
  effects.length = 0;
  floats.length = 0;
  projectiles.length = 0;
  beams.length = 0;
  chunks.clear(); lakeCache.clear();
  hazards.length = 0;
  state.vortex = null;
  setupLandmarks();
  for(let i = 0; i < 5; i++) spawnHerb();
  buildSkillBar();
  updateSkillUI();
  renderHUD();
  lastT = performance.now();
  errorShown = false;
  toast('拖动屏幕 / WASD 移动');
  setTimeout(()=> toast('建筑群落散落四方 · 奇遇各处不同'), 2600);
  setTimeout(()=> toast('妖王会施展专属神通，注意地面预警'), 5200);
  setTimeout(()=> toast('越深处妖气越盛 · 突破境界可开启新境'), 7600);
  if(!saveTimer) saveTimer = setInterval(save, 5000);
}
const startBtn = $('startBtn');
if(startBtn) startBtn.addEventListener('click', ()=>{
  if(state.started) return;
  if(paused){ resumeGame(); return; }
  const ss = $('startScreen');
  if(ss) ss.style.display = 'none';
  setTimeout(()=>{ resize(); initGame(); }, 30);
});

(function(){
  const q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const ss = $('startScreen'); if(ss) ss.style.display = 'none';
  resize();
  initGame();
  if(q.get('edit') === '1') maintainEnemies = function(){};
  const bi = parseInt(q.get('bi') || '0', 10) || 0;
  if(bi !== 0){
    state.biome = bi;
    setupLandmarks();
    chunks.clear(); lakeCache.clear();
  }
  let hx = parseFloat(q.get('x') || '0');
  let hy = parseFloat(q.get('y') || '0');
  if(hx || hy){
    P.x = BIOME_ORIGIN[bi].x + hx;
    P.y = BIOME_ORIGIN[bi].y + hy;
    state.camX = P.x - W / 2;
    state.camY = P.y - H / 2;
  }
  if(q.get('ui') === '0'){
    for(const id of ['hud', 'topButtons', 'skillBar', 'attackBtn', 'herbBtn', 'toast', 'bossBar']){
      const el = $(id); if(el) el.style.display = 'none';
    }
  }
  if(q.get('haz') === '1'){
    addHazard(P.x - 140, P.y - 40, 78, 9, 1, '255,120,60');
    addHazard(P.x + 60, P.y - 150, 66, 9, 1, '255,120,60');
    addHazard(P.x + 150, P.y + 30, 84, 9, 1, '255,120,60');
  }
  if(q.get('menu') === '1') backToMenu();
})();

requestAnimationFrame(loop);
</script>
