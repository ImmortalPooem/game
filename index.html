<style>

#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:40;

.mapCard{padding:12px;border-radius:6px;cursor:pointer;

#skillBookSlots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;

.skSlotBtn{aspect-ratio:1;border-radius:8px;cursor:pointer;

.skSlotBtn .slotName{font-size:9px;opacity:.65;margin-top:3px}
.skSlotBtn .slotNum{position:absolute;top:2px;left:6px;font-size:9px;opacity:.4}
#skillBookLibrary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;overflow-y:auto;max-height:44vh;padding:4px}
.skCard{padding:8px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);transition:.15s;
  display:flex;flex-direction:column;gap:3px}
.skCard.equipped{border-color:rgba(120,255,190,.55);

.skCard.locked{opacity:.35;cursor:not-allowed;filter:grayscale(0.7)}
.skCard .cardTop{display:flex;align-items:center;gap:6px}
.skCard .cardKey{width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(50,80,100,.7);border:1px solid rgba(200,164,92,.35);
  font-size:12px}
.skCard .cardName{font-size:12px;color:#e8c878}
.skCard .cardStats{font-size:10px;color:rgba(200,190,170,.6)}
.skCard .cardTag{font-size:9px;color:#89e2ce;margin-top:1px}
.skCard .cardLock{font-size:9px;color:#d9604a}
#bagGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;overflow-y:auto;max-height:60vh;padding:4px}
.bagWeapon{padding:12px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);
  transition:.18s;display:flex;flex-direction:column;gap:4px;position:relative}
.bagWeapon.equipped{border-color:#ffd870;
  box-shadow:0 0 22px rgba(255,216,112,.55);
  background:rgba(50,42,20,.85)}
.bagWeapon.locked{opacity:.35;cursor:not-allowed;filter:grayscale(0.7)}
.bagWeapon .wname{font-size:14px;color:#e8c878}
.bagWeapon .wbonus{font-size:11px;color:#89e2ce}
.bagWeapon .weffect{font-size:10px;color:rgba(200,190,170,.6);margin-top:2px}
.bagWeapon .wtag{font-size:10px;color:rgba(200,190,170,.5)}
.bagWeapon .wdot{position:absolute;top:10px;right:10px;width:14px;height:14px;border-radius:50%;
  box-shadow:0 0 12px currentColor}
.bagHint{font-size:11px;color:rgba(200,190,170,.55);text-align:center;margin-top:8px}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="hurtOverlay"></div>
<div id="flashOverlay"></div>

  <h1>仙 途 · 问 道</h1>

    拖动屏幕 / WASD 移动　·　空格或 J 平A<br>
    1 ~ 8 释放技能　·　「遁光」化光球冲刺撞击<br>
    十方天地各具宫阙楼宇 · 妖王各据一方
  </p>
</div>

<script>
/* ============ Polyfill ============ */
(function(){
  const CR = window.CanvasRenderingContext2D;
  if(!CR) return;
  if(!CR.prototype.ellipse){
    CR.prototype.ellipse = function(x, y, rx, ry, rot, a1, a2, ccw){
      this.save(); this.translate(x, y); this.rotate(rot || 0);
      this.scale(rx, ry || rx); this.arc(0, 0, 1, a1, a2, ccw); this.restore();
    };
  }
  if(!CR.prototype.setLineDash){
    CR.prototype.setLineDash = function(){};
    CR.prototype.getLineDash = function(){ return []; };
  }
})();
if(!Math.imul){
  Math.imul = function(a, b){
    const ah = (a >>> 16) & 0xffff, al = a & 0xffff;
    const bh = (b >>> 16) & 0xffff, bl = b & 0xffff;
    return ((al * bl) + (((ah * bl + al * bh) << 16) >>> 0) | 0);
  };
}

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = (a,b) => a + Math.random()*(b-a);
const isNum = n => typeof n === 'number' && isFinite(n);
const fmt = n => {
  n = Math.floor(n);
  if(n < 10000) return String(n);
  if(n < 1e8) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
  if(n < 1e12) return (n/1e8).toFixed(2).replace(/\.00$/,'') + '亿';
  return (n/1e12).toFixed(2) + '兆';
};
function hashInt(x,y){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return (n ^ (n>>>16)) >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x,y){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>> 0) / 4294967296;
}

const cvs = $('game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth || 800;
  H = window.innerHeight || 600;
  if(W < 1) W = 800; if(H < 1) H = 600;
  cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const rOuter = Math.max(W,H) * 0.86;
  const rInner = Math.min(W,H) * 0.42;
  vignette = ctx.createRadialGradient(W/2,H/2,Math.max(1,rInner),W/2,H/2,Math.max(1,rOuter));
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(6,14,24,.26)');
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize, 200));
resize();

const BIOME_ORIGIN = [];
const BIOME_EMOJIS = ['🎋','🌋','🌳','👻','🏜️','❄️','🌊','⛩️','💀','✨'];
const BIOMES = [
  { id:'bamboo', name:'青云竹林', desc:'翠竹连绵', realmReq:0,
    h1:128,h2:40,s1:32,s2:22,l1:19,l2:10, tint:'rgba(40,90,60,0.06)',
    propTypes:['bamboo','bamboo','bamboo','pine','rock'], lakeType:'water' },
  { id:'volcano', name:'赤炎火山', desc:'熔岩奔涌', realmReq:1,
    h1:5,h2:25,s1:50,s2:22,l1:16,l2:9, tint:'rgba(180,50,20,0.13)',

const CELL = 260;
const LAKE_CELL = 1000;
const chunks = new Map();
const lakeCache = new Map();
function getChunk(cx, cy){
  const k = cx + ',' + cy;
  let c = chunks.get(k);
  if(c) return c;
  c = genChunk(cx, cy);
  chunks.set(k, c);
  return c;
}
function genChunk(cx, cy){
  const bio = BIOMES[state.biome] || BIOMES[0];
  const biomeSeed = state.biome * 7919;
  const r = mulberry32(hashInt(cx + biomeSeed, cy + state.biome * 3571));
  const props = [];
  const wx = cx*CELL + CELL/2, wy = cy*CELL + CELL/2;
  let distOrigin = Math.hypot(wx - BIOME_ORIGIN[state.biome].x, wy - BIOME_ORIGIN[state.biome].y);
  let nearLandmark = false;
  for(const lm of state.landmarks){
    if(Math.hypot(wx - lm.x, wy - lm.y) < lm.r * 2.2){ nearLandmark = true; break; }
  }
  if(distOrigin > 300 && !nearLandmark){
    const rn = r();
    let n = 0;
    if(rn > 0.45) n = (r() < 0.65) ? 1 : 2;
    for(let i=0;i<n;i++){
      const t = bio.propTypes[Math.floor(r() * bio.propTypes.length)];
      let rad = 17;
      if(t === 'bamboo') rad = 15;
      else if(t === 'pine' || t === 'snowpine' || t === 'deadtree' || t === 'goldtree' || t === 'bigtree' || t === 'cactus') rad = 19;
      else if(t === 'obsidian' || t === 'goldpillar' || t === 'meteor') rad = 21;
      else if(t === 'icecrystal' || t === 'coral' || t === 'thorn') rad = 15;
      else if(t === 'cloud' || t === 'voidcloud' || t === 'mushroom') rad = 11;
      else if(t === 'bone' || t === 'shell' || t === 'skull') rad = 8;
      else if(t === 'grave' || t === 'dune' || t === 'darkcrystal') rad = 16;
      else if(t === 'ashrock' || t === 'starstone') rad = 12;
      else if(t === 'vine' || t === 'seaweed' || t === 'starflower') rad = 9;
      props.push({ x: cx*CELL + r()*CELL, y: cy*CELL + r()*CELL, type: t, r: rad, seed: r()*100 });
    }
  }
  return { props };
}
function lakeAt(cx, cy){
  const k = cx + ',' + cy;
  if(lakeCache.has(k)) return lakeCache.get(k);
  const biomeSeed = state.biome * 9973;
  const r = mulberry32(hashInt(cx*7+13 + biomeSeed, cy*11+7 + state.biome * 4211));
  let lake = null;
  if(r() > 0.72){
    const lx = cx*LAKE_CELL + LAKE_CELL*(0.3 + r()*0.4);
    const ly = cy*LAKE_CELL + LAKE_CELL*(0.3 + r()*0.4);
    const origin = BIOME_ORIGIN[state.biome];
    if(Math.hypot(lx - origin.x, ly - origin.y) > 500){
      lake = { x: lx, y: ly, rx: 100 + r()*130, ry: 80 + r()*100,
        type: (BIOMES[state.biome] || BIOMES[0]).lakeType };
    }
  }
  lakeCache.set(k, lake);
  return lake;
}
function cleanChunks(){
  const px = Math.floor(P.x / CELL);
  const py = Math.floor(P.y / CELL);
  for(const k of chunks.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-px) > 15 || Math.abs(+p[1]-py) > 15) chunks.delete(k);
  }
  const lx = Math.floor(P.x / LAKE_CELL);
  const ly = Math.floor(P.y / LAKE_CELL);
  for(const k of lakeCache.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-lx) > 8 || Math.abs(+p[1]-ly) > 8) lakeCache.delete(k);
  }
}

  const bossCount = alive.filter(e => e.elite).length;

  if(state.herbs.length < 10 && state.t > state.nextHerbT){
    spawnHerb();
    state.nextHerbT = state.t + 0.9;
  }
}

const joy = { active:false, pid:null, ox:0, oy:0, vx:0, vy:0 };
const JOY_R = 46;
const leftZone = $('leftZone');
const joyBase  = $('joyBase');
const joyKnob  = $('joyKnob');
function joyStart(x, y, pid){
  if(!isNum(x) || !isNum(y)) return;
  joy.active = true; joy.pid = pid;
  joy.ox = x; joy.oy = y; joy.vx = joy.vy = 0;
  joyBase.style.display = 'block';
  joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px';
  joyBase.style.transform = 'translate(-50%,-50%)';
  joyKnob.style.transform = 'translate(0,0)';
}
function joyMove(x, y){
  if(!isNum(x) || !isNum(y)) return;
  let dx = x - joy.ox, dy = y - joy.oy;
  const d = Math.hypot(dx, dy);
  if(d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.vx = dx / JOY_R; joy.vy = dy / JOY_R;
}
function joyEnd(){
  joy.active = false; joy.pid = null;
  joy.vx = joy.vy = 0;
  joyBase.style.display = 'none';
}

  if(!state.started || joy.active) return;
  e.preventDefault();
  joyStart(e.clientX, e.clientY, e.pointerId);
});
window.addEventListener('pointermove', e=>{
  if(!joy.active || e.pointerId !== joy.pid) return;
  joyMove(e.clientX, e.clientY);
});
window.addEventListener('pointerup', e=>{
  if(joy.active && e.pointerId === joy.pid) joyEnd();
});
window.addEventListener('pointercancel', e=>{
  if(joy.active && e.pointerId === joy.pid) joyEnd();
});

function resolveCollision(o){
  const cx0 = Math.floor((o.x - 60) / CELL);
  const cx1 = Math.floor((o.x + 60) / CELL);
  const cy0 = Math.floor((o.y - 60) / CELL);
  const cy1 = Math.floor((o.y + 60) / CELL);
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const chunk = getChunk(cx, cy);
      for(const p of chunk.props){
        const dx = o.x - p.x, dy = o.y - p.y;
        const d = Math.hypot(dx, dy);
        const min = o.r + p.r;
        if(d < min && d > 0.01){
          const push = min - d;
          o.x += dx/d * push; o.y += dy/d * push;
        }
      }
    }
  }
  const lcx = Math.floor(o.x / LAKE_CELL);
  const lcy = Math.floor(o.y / LAKE_CELL);
  for(let j = -1; j <= 1; j++){
    for(let i = -1; i <= 1; i++){
      const lake = lakeAt(lcx+i, lcy+j);
      if(!lake) continue;
      const nx = (o.x - lake.x)/lake.rx, ny = (o.y - lake.y)/lake.ry;
      const d = Math.hypot(nx, ny);
      if(d < 1 && d > 0.01){
        o.x = lake.x + nx/d * lake.rx * 1.03;
        o.y = lake.y + ny/d * lake.ry * 1.03;
      }
    }
  }
}

const PARTICLE_CAP = 720;
function addParticle(x, y, o){
  if(!isNum(x) || !isNum(y)) return;
  if(particles.length > PARTICLE_CAP) return;
  particles.push({ x, y, vx: o.vx || 0, vy: o.vy || 0,
    life: o.life || 0.6, maxLife: o.life || 0.6,
    size: o.size || 4, color: o.color || '255,255,255',
    type: o.type || 'dot', gravity: o.gravity || 0,
    drag: o.drag != null ? o.drag : 0.94,
    angle: o.angle || 0, spin: o.spin || 0, grow: o.grow || 0 });
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0 || !isNum(p.x) || !isNum(p.y)){ particles.splice(i,1); continue; }
    p.vx *= Math.pow(p.drag, dt * 60);
    p.vy *= Math.pow(p.drag, dt * 60);
    p.vy += p.gravity * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.angle += p.spin * dt;
  }
}
function addFloat(x, y, text, color, big){

  const c = w.color;
  const n = 10 + Math.floor(Math.random()*4);
  for(let k = 0; k < n; k++){
    const a = angle + rnd(-0.55, 0.55);
    const sp = rnd(240, 420);
    const ox = P.x + Math.cos(angle)*30;
    const oy = P.y - 28 + Math.sin(angle)*30;
    addParticle(ox, oy, { vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.4, size: rnd(3,8), color: c,
      type: 'spark', angle: a, spin: rnd(-10,10), drag: 0.88, grow: 1 });
  }
  effects.push({ type:'fan', x:P.x, y:P.y, angle, range: 105, halfAngle: Math.PI/3,
    color: c, life:0.2, maxLife:0.2 });
}

function doAttack(){
  if(!state.started || state.t < G.atkCd) return;
  G.atkCd = state.t + 0.4;
  let target = null, td = 150;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
    if(d < td){ td = d; target = e; }
  }
  let angle;
  if(target){
    angle = Math.atan2(target.y - P.y, target.x - P.x);
    if(Math.abs(Math.cos(angle)) >= Math.abs(Math.sin(angle)))
      P.dir = Math.cos(angle) > 0 ? 2 : 1;
    else P.dir = Math.sin(angle) > 0 ? 0 : 3;
  } else {
    angle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
          : P.dir === 2 ? 0 : -Math.PI/2;
  }
  P.swing = 0.26; P.swingAngle = angle; P.swingSide = -P.swingSide;
  const range = 105, halfAngle = Math.PI / 3;
  const dmgMul = (isSwordGod() ? 1.3 : 1) * weaponAtkMul();
  for(const e of state.enemies){
    if(e.dead) continue;
    const dx = e.x - P.x, dy = e.y - P.y;
    const d = Math.hypot(dx, dy);
    if(d > range + e.r) continue;
    let diff = Math.abs(Math.atan2(dy, dx) - angle);
    if(diff > Math.PI) diff = Math.PI*2 - diff;
    if(diff > halfAngle) continue;
    damageEnemy(e, G.atk * dmgMul, angle);
  }
  emitWeaponStrike(angle);
  shake(1.8);
}

function castSkill(slot){
  if(!state.started) return;
  const skillId = G.equipped[slot];
  if(skillId == null) return;
  const sk = SKILL_LIBRARY[skillId];
  if(!sk) return;
  if(!G.unlockedSkills.has(skillId)){ toast('此术未悟。'); return; }
  if((G.cd[skillId] || 0) > 0 || G.mp < sk.mp) return;
  G.mp -= sk.mp;
  G.cd[skillId] = sk.cd;
  const c = sk.color;
  const wMul = 1 + (currentWeapon()?.atkBonus || 0) * 0.6;
  switch(sk.type){
    case 'escape': {
      P.escaping = 6.0;
      P.escapeHit = new Set();
      P.escapeTrail = 0;
      toast('遁光 · 6 秒！');
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:130, color:c, life:0.7, maxLife:0.7 });
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:160, color:c, life:0.5, maxLife:0.5, width:10 });
      screenFlash('rgba(255,240,180,.5)', 400);
      shake(5, 0.25);
      break;
    }
    case 'fan': {
      const dmgMul = (isSwordGod() ? 1.25 : 1) * wMul;
      const radius = sk.radius;
      const halfAngle = Math.PI / 3;
      let targetAngle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
                       : P.dir === 2 ? 0 : -Math.PI/2;
      let target = null, td = radius + 50;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d < td){ td = d; target = e; }
      }
      if(target){
        targetAngle = Math.atan2(target.y - P.y, target.x - P.x);
        if(Math.abs(Math.cos(targetAngle)) >= Math.abs(Math.sin(targetAngle)))
          P.dir = Math.cos(targetAngle) > 0 ? 2 : 1;
        else P.dir = Math.sin(targetAngle) > 0 ? 0 : 3;
      }
      for(const e of state.enemies){
        if(e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y;
        const d = Math.hypot(dx, dy);
        if(d > radius + e.r) continue;
        let diff = Math.abs(Math.atan2(dy, dx) - targetAngle);
        if(diff > Math.PI) diff = Math.PI*2 - diff;
        if(diff > halfAngle) continue;
        damageEnemy(e, G.atk * sk.power * dmgMul, targetAngle);
      }
      effects.push({ type:'fan', x:P.x, y:P.y, angle:targetAngle, range:radius, halfAngle,
        color:c, life:0.28, maxLife:0.28 });
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:radius, color:c,
        life:0.42, maxLife:0.42, width:6 });
      shake(3, 0.15);
      break;
    }
    case 'pierce': {
      let target = null, td = sk.radius;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y);
        if(d < td){ td = d; target = e; }
      }
      let angle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
                : P.dir === 2 ? 0 : -Math.PI/2;
      if(target) angle = Math.atan2(target.y - P.y, target.x - P.x);
      const dmgMul = (isSwordGod() ? 1.25 : 1) * wMul;
      const lineWidth = 60;
      for(const e of state.enemies){
        if(e.dead) continue;
        const dx = e.x - P.x, dy = e.y - P.y;
        const proj = dx * Math.cos(angle) + dy * Math.sin(angle);
        if(proj < 0 || proj > sk.radius) continue;
        const perp = Math.abs(-dx * Math.sin(angle) + dy * Math.cos(angle));
        if(perp > lineWidth/2 + e.r) continue;
        damageEnemy(e, G.atk * sk.power * dmgMul, angle);
      }
      const ex = P.x + Math.cos(angle) * sk.radius;
      const ey = P.y + Math.sin(angle) * sk.radius;
      effects.push({ type:'beam', x1:P.x, y1:P.y-26, x2:ex, y2:ey-26,
        color:c, life:0.32, maxLife:0.32, width:lineWidth });
      break;
    }
    case 'dash': {
      let ix = 0, iy = 0;
      if(keys['a'] || keys['arrowleft'])  ix -= 1;
      if(keys['d'] || keys['arrowright']) ix += 1;
      if(keys['w'] || keys['arrowup'])    iy -= 1;
      if(keys['s'] || keys['arrowdown'])  iy += 1;
      if(joy.active){ ix += joy.vx; iy += joy.vy; }
      if(Math.hypot(ix, iy) < 0.1){
        ix = P.dir === 2 ? 1 : P.dir === 1 ? -1 : 0;
        iy = P.dir === 0 ? 1 : P.dir === 3 ? -1 : 0;
      }
      const len = Math.hypot(ix, iy) || 1;
      ix /= len; iy /= len;
      P.x += ix * 220; P.y += iy * 220;
      resolveCollision(P);
      break;
    }
    case 'rain': {
      const centerX = P.x, centerY = P.y - 26;
      const R = sk.radius;
      const dmg = G.atk * sk.power * wMul;
      const count = 12;
      for(let k = 0; k < count; k++){
        const delay = k * 80;
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * R;
        const tx = centerX + Math.cos(a) * r;
        const ty = centerY + Math.sin(a) * r * 0.65;
        addParticle(tx, ty - 150, { vx: 0, vy: 500, life: 0.3, size: 14,
          color: c, type: 'line', angle: Math.PI/2, drag: 1 });
        setTimeout(() => {
          if(!state.started) return;
          for(const e of state.enemies){
            if(e.dead) continue;
            const dd = Math.hypot(e.x - tx, e.y - ty);
            if(dd < 60 + e.r){
              damageEnemy(e, dmg, Math.atan2(e.y - ty, e.x - tx));
            }
          }
        }, delay);
      }
      effects.push({ type:'ring', x:centerX, y:centerY, maxR:R, color:c, life:0.55, maxLife:0.55 });
      shake(5, 0.22);
      break;
    }
    case 'shield': {
      const amount = Math.floor(G.maxHp * sk.power);
      state.shield = (state.shield || 0) + amount;
      state.shieldTime = 8;
      addFloat(P.x, P.y - 56, '+' + fmt(amount) + ' 护盾', '#ffe070', true);
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:85, color:c, life:0.6, maxLife:0.6 });
      break;
    }
    case 'ultimate': {
      const radius = sk.radius * (isSwordGod() ? 1.2 : 1);
      const dmg = G.atk * sk.power * (isSwordGod() ? 1.3 : 1) * wMul;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d > radius) continue;
        damageEnemy(e, dmg, Math.atan2(e.y - P.y, e.x - P.x));
      }
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:radius, color:c, life:1.0, maxLife:1.0, width:18 });
      shake(14, 0.6);
      screenFlash('rgba(255,240,180,.7)', 600);
      break;
    }
    case 'teleport': {
      const oldX = P.x, oldY = P.y;
      let ix = 0, iy = 0;
      if(keys['a'] || keys['arrowleft'])  ix -= 1;
      if(keys['d'] || keys['arrowright']) ix += 1;
      if(keys['w'] || keys['arrowup'])    iy -= 1;
      if(keys['s'] || keys['arrowdown'])  iy += 1;
      if(joy.active){ ix += joy.vx; iy += joy.vy; }
      if(Math.hypot(ix, iy) < 0.1){
        ix = P.dir === 2 ? 1 : P.dir === 1 ? -1 : 0;
        iy = P.dir === 0 ? 1 : P.dir === 3 ? -1 : 0;
      }
      const len = Math.hypot(ix, iy) || 1;
      ix /= len; iy /= len;
      P.x += ix * sk.radius; P.y += iy * sk.radius;
      resolveCollision(P);
      effects.push({ type:'ring', x:oldX, y:oldY, maxR:50, color:c, life:0.4, maxLife:0.4 });
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:60, color:c, life:0.4, maxLife:0.4 });
      break;
    }
    case 'heal': {
      const v = Math.floor(G.maxHp * sk.power);
      G.hp = Math.min(G.maxHp, G.hp + v);
      addFloat(P.x, P.y - 56, '+' + fmt(v), '#89e2ce', true);
      effects.push({ type:'ring', x:P.x, y:P.y, maxR:95, color:c, life:0.55, maxLife:0.55 });
      break;
    }
    case 'fly': {
      P.flying = 8.0;
      toast('御剑飞行 · 8 秒！');
      break;
    }
    case 'nova': {
      const radius = sk.radius * (isSwordGod() ? 1.2 : 1);
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d > radius) continue;
        const ang = Math.atan2(e.y - P.y, e.x - P.x);
        damageEnemy(e, G.atk * sk.power * (isSwordGod() ? 1.25 : 1) * wMul, ang);
        if(sk.freeze) e.frozen = Math.max(e.frozen || 0, sk.freeze);
      }
      effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:radius, color:c, life:0.5, maxLife:0.5, width:9 });
      shake(8, 0.22);
      break;
    }
    case 'swords': {
      const n = 18;
      const dmg = G.atk * sk.power * wMul;
      for(let k = 0; k < n; k++){
        const a = (k / n) * Math.PI * 2 + rnd(-0.08, 0.08);
        projectiles.push({
          x: P.x + Math.cos(a)*20, y: P.y - 26 + Math.sin(a)*20,
          vx: Math.cos(a) * 620, vy: Math.sin(a) * 620,
          target: null, damage: dmg, life: 1.0,
          color: c, r: 3, homing: false
        });
      }
      shake(5, 0.16);
      break;
    }
    case 'chain': {
      let curX = P.x, curY = P.y - 26;
      let remaining = 5, mul = 1;
      const used = new Set();
      while(remaining-- > 0){
        let best = null, bd = sk.radius;
        for(const e of state.enemies){
          if(e.dead || used.has(e)) continue;
          const d = Math.hypot(e.x - curX, e.y - 20 - curY);
          if(d < bd){ bd = d; best = e; }
        }
        if(!best) break;
        used.add(best);
        beams.push({ x1: curX, y1: curY, x2: best.x, y2: best.y - 20,
          color: c, life: 0.3, maxLife: 0.3, segs: 7, jitter: 14 });
        const ang = Math.atan2(best.y - curY, best.x - curX);
        damageEnemy(best, G.atk * sk.power * mul * wMul, ang);
        curX = best.x; curY = best.y - 20; mul *= 0.82;
      }
      if(used.size === 0){ G.mp += sk.mp; G.cd[skillId] = 0.5; return; }
      break;
    }
    case 'domain': {
      state.domain = 5.5;
      state.domainTick = 0;
      state.domainPower = sk.power * wMul;
      state.domainRadius = sk.radius;
      state.domainColor = sk.color;
      toast('领域展开！');
      shake(9, 0.4);
      screenFlash('rgba(255,220,140,.5)', 500);
      break;
    }
  }
}

function damageEnemy(e, rawAtk, angle){
  if(e.dead) return;
  const dmg = Math.max(1, Math.floor(rawAtk - e.def * 0.6));
  e.hp -= dmg;
  e.hitFlash = 0.14;
  const dx = Math.cos(angle || 0), dy = Math.sin(angle || 0);
  const push = e.elite ? 4 : 10;
  e.x += dx * push; e.y += dy * push;
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
  addFloat(e.x + rnd(-6,6), e.y - (e.elite ? 150 : 32), dmg, '#ffe0a0', dmg > G.atk * 2);
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  e.deadTimer = e.elite ? 1.4 : 0.55;
  e.chasing = false;
  G.qi     += e.rewardQi;
  G.stones += e.rewardStones;
  addFloat(e.x, e.y - (e.elite ? 180 : 44), '修为 +' + fmt(e.rewardQi), '#89e2ce', e.elite);
  if(e.elite){
    const sid = BIOME_SKILL_ID(state.biome);
    if(!G.unlockedSkills.has(sid)){
      G.unlockedSkills.add(sid);
      const sk = SKILL_LIBRARY[sid];
      if(sk){ addFloat(P.x, P.y - 240, '领悟 · ' + sk.name, '#ffd870', true); toast('领悟 · ' + sk.name); }
    }
    const wid = state.biome + 1;
    if(WEAPON_MAP[wid] && !G.weapons.has(wid)){
      G.weapons.add(wid);
      const w = WEAPON_MAP[wid];
      addFloat(P.x, P.y - 270, '获得 · ' + w.name, 'rgb(' + w.color + ')', true);
      toast('获得神兵 · ' + w.name);
    }
    shake(14, 0.6);
    screenFlash('rgba(255,180,220,.5)', 600);
    save();
  } else {
    shake(3, 0.18);
  }
}
function damagePlayer(e){
  if(state.t < playerInvuln) return;
  playerInvuln = state.t + 0.5;
  let dmg = Math.max(1, Math.floor(e.atk - G.def * 0.6));
  if(state.shield > 0){
    const absorbed = Math.min(dmg, state.shield);
    state.shield -= absorbed;
    dmg -= absorbed;
    if(dmg <= 0) return;
  }
  G.hp -= dmg;
  addFloat(P.x, P.y - 52, dmg, '#ff6b5a');
  shake(5, 0.14);
  hurtFlash();
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  P.x += dx/d * 16; P.y += dy/d * 16;
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(G.hp <= 0) playerDie();
}
function playerDie(){
  G.hp = Math.floor(G.maxHp * 0.3);
  G.qi = Math.floor(G.qi * 0.8);
  state.shield = 0;
  P.escaping = 0;
  const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
  P.x = origin.x; P.y = origin.y;
  state.grace = 3;
  state.domain = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  toast('你被击倒，修为受损。');
  save();
}

function updateSwordArray(dt){
  if(!isSwordArrayOn()) return;
  state.swordAngle += dt * 2.2;
  state.swordInnerAngle -= dt * 3.2;
  if(state.t < state.swordCd) return;
  const n = swordCount();
  if(n === 0) return;
  const radius = 58;
  let target = null, td = 450;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if(d < td){ td = d; target = e; }
  }
  if(!target) return;
  const idx = Math.floor(Math.random() * n);
  const ang = state.swordAngle + idx * (Math.PI*2 / n);
  const sx = P.x + Math.cos(ang) * radius;
  const sy = P.y - 26 + Math.sin(ang) * radius * 0.55;
  const dx = target.x - sx, dy = (target.y - 20) - sy;
  const d = Math.hypot(dx, dy) || 1;
  const dmgBase = G.atk * (isSwordGod() ? 1.2 : 0.8) * weaponAtkMul();
  projectiles.push({
    x: sx, y: sy, vx: dx/d * 720, vy: dy/d * 720,
    target, damage: dmgBase,
    life: 1.8, color: isSwordGod() ? '255,220,120' : '150,230,255',
    r: 3, homing: true, isArray: true
  });
  state.swordCd = state.t + (isSwordGod() ? 0.3 : totalLv() >= 27 ? 0.42 : 0.5);
}
function updateProjectiles(dt){
  for(let i = projectiles.length-1; i >= 0; i--){
    const pr = projectiles[i];
    pr.life -= dt;
    if(pr.life <= 0 || !isNum(pr.x) || !isNum(pr.y)){ projectiles.splice(i,1); continue; }
    if(pr.homing && pr.target && !pr.target.dead){
      const dx = pr.target.x - pr.x;
      const dy = (pr.target.y - 20) - pr.y;
      const d = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(pr.vx, pr.vy) || 600;
      pr.vx += (dx/d*sp - pr.vx) * Math.min(1, dt*8);
      pr.vy += (dy/d*sp - pr.vy) * Math.min(1, dt*8);
    }
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    let hit = null;
    for(const e of state.enemies){
      if(e.dead) continue;
      if(Math.hypot(e.x - pr.x, (e.y - 18) - pr.y) < e.r + 18){ hit = e; break; }
    }
    if(hit){
      damageEnemy(hit, pr.damage, Math.atan2(pr.vy, pr.vx));
      projectiles.splice(i,1);
    }
  }
}
function updateDomain(dt){
  if(state.domain <= 0) return;
  state.domain -= dt;
  state.domainTick -= dt;
  if(state.domainTick <= 0){
    state.domainTick = 0.28;
    const R = state.domainRadius;
    for(const e of state.enemies){
      if(e.dead) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
      if(d > R) continue;
      damageEnemy(e, G.atk * state.domainPower, Math.atan2(e.y - P.y, e.x - P.x));
    }
  }
}

function updatePlayer(dt){
  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;
  if(joy.active){ ix += joy.vx; iy += joy.vy; }
  const len = Math.hypot(ix, iy);
  if(len > 1){ ix /= len; iy /= len; }
  if(!isNum(ix)) ix = 0; if(!isNum(iy)) iy = 0;
  let speed = 178;
  if(P.flying > 0) speed = 450;
  if(P.escaping > 0) speed = 900;
  P.x += ix * speed * dt; P.y += iy * speed * dt;
  P.moving = Math.hypot(ix, iy) > 0.12;
  if(P.moving){
    P.anim += dt * (P.flying > 0 ? 4 : P.escaping > 0 ? 2 : 11);
    if(Math.abs(ix) >= Math.abs(iy)) P.dir = ix > 0 ? 2 : 1;
    else P.dir = iy > 0 ? 0 : 3;
  }
  if(P.swing > 0) P.swing = Math.max(0, P.swing - dt);
  if(P.flying > 0){
    P.flying = Math.max(0, P.flying - dt);
    P.flyTrail += dt;
    if(P.flyTrail > 0.03 && P.moving){
      P.flyTrail = 0;
      addParticle(P.x + rnd(-8,8), P.y + rnd(-4,4), {
        vx: rnd(-20,20), vy: rnd(-20,20),
        life: 0.4, size: rnd(2,5), color: '150,230,255',
        type: 'dot', drag: 0.94
      });
    }
  }
  if(P.escaping > 0){
    P.escaping = Math.max(0, P.escaping - dt);
    P.escapeTrail += dt;
    if(P.escapeTrail > 0.02){
      P.escapeTrail = 0;
      addParticle(P.x + rnd(-12,12), P.y - 26 + rnd(-12,12), {
        vx: rnd(-30,30), vy: rnd(-30,30),
        life: 0.5, size: rnd(4,10),
        color: '255,240,180', type: 'dot', drag: 0.92, grow: 4
      });
    }
    const hitR = 45;
    for(const e of state.enemies){
      if(e.dead || P.escapeHit.has(e)) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if(d < hitR + e.r){
        P.escapeHit.add(e);
        const dmg = G.atk * 3.5 * weaponAtkMul();
        damageEnemy(e, dmg, Math.atan2(e.y - P.y, e.x - P.x));
        effects.push({ type:'shockwave', x:e.x, y:e.y - 20, maxR:180,
          color:'255,240,180', life:0.45, maxLife:0.45, width:8 });
        shake(6, 0.2);
      }
    }
  }
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(!isNum(P.x) || !isNum(P.y)){
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    P.x = origin.x; P.y = origin.y;
    state.camX = P.x - W/2; state.camY = P.y - H/2;
  }
}

function updateEnemy(e, dt){
  if(e.dead){ e.deadTimer -= dt; return; }
  if(!isNum(e.x) || !isNum(e.y)) return;
  if(e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
  if(e.frozen > 0){ e.frozen -= dt; if(e.frozen <= 0) e.frozen = 0; }
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy);
  const canChase = state.grace <= 0 && state.t >= (e.calmUntil || 0);
  const chaseDist = e.elite ? 650 : 380;
  if(e.frozen > 0){
    e.chasing = false;
  } else if(canChase && d < chaseDist){
    e.chasing = true;
    const atkRange = e.elite ? 110 : (e.isHuman ? 200 : 46);
    if(d > atkRange){
      const sp = e.elite ? 105 : (e.isHuman ? 85 : 92);
      e.x += dx/d * sp * dt; e.y += dy/d * sp * dt;
    }
    if(e.isHuman && d < 500){
      e.spellCd -= dt;
      if(e.spellCd <= 0){
        e.spellCd = rnd(2.5, 4.0);
        castEnemySpell(e, dx, dy, d);
      }
    }
    if(d <= atkRange + 5){
      e.atkCd -= dt;
      if(e.atkCd <= 0){
        e.atkCd = e.elite ? 1.4 : 1.5;
        damagePlayer(e);
      }
    }
    if(e.elite){
      e.abilityCd -= dt;
      if(e.abilityCd <= 0 && d < 380){
        e.abilityCd = 4.5;
        effects.push({ type:'shockwave', x:e.x, y:e.y - 10, maxR:360,
          color:'255,110,160', life:0.6, maxLife:0.6, width:11 });
        shake(8, 0.24);
        if(d < 360){
          playerInvuln = 0;
          damagePlayer({ atk: e.atk * 1.5, x: e.x, y: e.y });
        }
      }
    }
  } else {
    e.chasing = false;
    e.wanderT -= dt;
    if(e.wanderT <= 0){
      e.wanderT = rnd(1.2, 3.2);
      e.wanderDir = rnd(0, Math.PI*2);
      e.wanderMove = Math.random() < 0.6;
    }
    if(e.wanderMove){
      e.x += Math.cos(e.wanderDir) * 32 * dt;
      e.y += Math.sin(e.wanderDir) * 32 * dt;
    }
  }
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
}
function castEnemySpell(e, dx, dy, d){
  const angle = Math.atan2(dy, dx);
  if(e.spellType === 'fan'){
    const wcol = e.color.replace('#','');
    const rr = parseInt(wcol.substr(0,2),16) || 140;
    const gg = parseInt(wcol.substr(2,2),16) || 200;
    const bb = parseInt(wcol.substr(4,2),16) || 255;
    const cStr = rr+','+gg+','+bb;
    for(let k = 0; k < 12; k++){
      const a = angle + rnd(-0.5, 0.5);
      const sp = rnd(200, 320);
      addParticle(e.x, e.y - 20, {
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.35, size: 10, color: cStr,
        type: 'line', angle: a, drag: 0.88
      });
    }
    effects.push({ type:'fan', x:e.x, y:e.y - 20, angle, range:220, halfAngle: Math.PI/3,
      color: cStr, life:0.3, maxLife:0.3 });
    let diff = Math.abs(angle - Math.atan2(P.y - e.y, P.x - e.x));
    if(diff > Math.PI) diff = Math.PI*2 - diff;
    if(d < 220 && diff < Math.PI/3){
      damagePlayer({ atk: e.atk * 1.3, x: e.x, y: e.y });
    }
  } else if(e.spellType === 'fireball'){
    projectiles.push({
      x: e.x, y: e.y - 20,
      vx: Math.cos(angle) * 320, vy: Math.sin(angle) * 320,
      target: null, damage: e.atk * 1.6, life: 2.0,
      color: '255,140,200', r: 6, isEnemy: true
    });
  } else if(e.spellType === 'blink'){
    if(d > 100 && d < 450){
      const targetX = P.x - dx/d * 60;
      const targetY = P.y - dy/d * 60;
      e.x = targetX; e.y = targetY;
      e.atkCd = 0.3;
      effects.push({ type:'ring', x:e.x, y:e.y, maxR:60, color:'150,80,200', life:0.4, maxLife:0.4 });
    }
  }
}

function updateCamera(dt){
  const tx = P.x - W/2, ty = P.y - H/2;
  if(!isNum(tx) || !isNum(ty)) return;
  state.camX += (tx - state.camX) * Math.min(1, dt*9);
  state.camY += (ty - state.camY) * Math.min(1, dt*9);
}
function updateInteract(){
  state.nearHerb = null;
  let hd = 78;
  for(const h of state.herbs){
    if(!h.alive) continue;
    const d = Math.hypot(h.x - P.x, h.y - P.y);
    if(d < hd){ hd = d; state.nearHerb = h; }
  }
  const hb = $('herbBtn');
  if(hb) hb.style.display = state.nearHerb ? 'block' : 'none';
}
function updateEffects(dt){
  for(let i = effects.length - 1; i >= 0; i--){
    effects[i].life -= dt;
    if(effects[i].life <= 0) effects.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y += f.vy * dt;
    if(f.life <= 0) floats.splice(i, 1);
  }
  for(let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if(beams[i].life <= 0) beams.splice(i, 1);
  }
  if(state.shakeT > 0) state.shakeT = Math.max(0, state.shakeT - dt);
  if(state.shield > 0){
    state.shieldTime -= dt;
    if(state.shieldTime <= 0){ state.shield = 0; state.shieldTime = 0; }
  }
}
function updateSkillUI(){
  for(let slot = 0; slot < 8; slot++){
    const btn = $('skillBtn' + slot);
    if(!btn) continue;
    const mask = btn.querySelector('.cdMask');
    const nameEl = btn.querySelector('.skName');
    const mpEl = btn.querySelector('.skMp');
    if(!mask || !nameEl || !mpEl) continue;
    const skillId = G.equipped[slot];
    if(skillId == null){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = '空'; mpEl.textContent = '—'; continue;
    }
    const sk = SKILL_LIBRARY[skillId];
    if(!sk || !G.unlockedSkills.has(skillId)){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = '未悟'; mpEl.textContent = '—'; continue;
    }
    btn.classList.remove('empty');
    nameEl.textContent = sk.key;
    mpEl.textContent = sk.mp + '灵';
    const cd = G.cd[skillId] || 0;
    if(cd > 0){
      mask.style.height = (cd / sk.cd * 100) + '%';
      btn.classList.add('cooling');
    } else {
      mask.style.height = '0%'; btn.classList.remove('cooling');
    }
    if(G.mp < sk.mp) btn.classList.add('noMp'); else btn.classList.remove('noMp');
  }
}

let mapOpen = false;
function toggleMap(){ if(!state.started) return; if(mapOpen) closeMap(); else openMap(); }
function openMap(){ if(mapOpen) return; mapOpen = true; renderMap(); const el = $('mapOverlay'); if(el) el.style.display = 'flex'; }
function closeMap(){ mapOpen = false; const el = $('mapOverlay'); if(el) el.style.display = 'none'; }
function renderMap(){
  const grid = $('mapGrid'); if(!grid) return;
  grid.innerHTML = '';
  BIOMES.forEach((bio, i) => {
    const unlocked = G.realm >= bio.realmReq;
    const isCurrent = state.biome === i;
    const card = document.createElement('div');
    card.className = 'mapCard' + (unlocked ? '' : ' locked') + (isCurrent ? ' current' : '');

function teleportToBiome(bi){

let skillBookOpen = false;
let selectedSlot = 0;
function toggleSkillBook(){ if(!state.started) return; if(skillBookOpen) closeSkillBook(); else openSkillBook(); }

function closeSkillBook(){ skillBookOpen = false; const el = $('skillBookOverlay'); if(el) el.style.display = 'none'; }
function renderSkillBook(){
  const slotsEl = $('skillBookSlots');
  const libEl = $('skillBookLibrary');
  if(!slotsEl || !libEl) return;
  slotsEl.innerHTML = ''; libEl.innerHTML = '';
  for(let i = 0; i < 8; i++){
    const skillId = G.equipped[i];
    const sk = skillId != null ? SKILL_LIBRARY[skillId] : null;
    const b = document.createElement('button');
    b.className = 'skSlotBtn' + (i === selectedSlot ? ' selected' : '');
    b.innerHTML = `
      <span class="slotNum">${i+1}</span>
      <span class="slotKey" style="color:${sk?`rgba(${sk.color},1)`:'#555'}">${sk?sk.key:'—'}</span>
      <span class="slotName">${sk?sk.name:'空'}</span>
    `;
    b.onclick = () => { selectedSlot = i; renderSkillBook(); };
    slotsEl.appendChild(b);
  }
  for(const id of ALL_SKILL_IDS){
    const sk = SKILL_LIBRARY[id];
    if(!sk) continue;
    const unlocked = G.unlockedSkills.has(id);
    const equippedIn = G.equipped.indexOf(id);
    const card = document.createElement('div');
    card.className = 'skCard' + (equippedIn >= 0 ? ' equipped' : '') + (unlocked ? '' : ' locked');
    let tag = '';
    if(equippedIn >= 0) tag = `<div class="cardTag">已装备 · 槽 ${equippedIn+1}</div>`;
    else if(!unlocked){
      if(id >= 14 && id <= 23) tag = `<div class="cardLock">🔒 击败${BIOMES[id-14].name}妖王</div>`;
      else if(sk.unlockLv) tag = `<div class="cardLock">🔒 需${REALM_NAMES[Math.floor(sk.unlockLv/9)]}期</div>`;
      else tag = `<div class="cardLock">🔒 未解锁</div>`;
    }
    card.innerHTML = `
      <div class="cardTop"><span class="cardKey" style="color:${unlocked?`rgba(${sk.color},1)`:'#888'}">${sk.key}</span><span class="cardName">${sk.name}</span></div>
      <div class="cardStats">耗灵 ${sk.mp} · CD ${sk.cd}s</div>${tag}
    `;
    if(unlocked){
      card.onclick = () => {
        const otherSlot = G.equipped.indexOf(id);
        if(otherSlot >= 0 && otherSlot !== selectedSlot){
          const tmp = G.equipped[selectedSlot];
          G.equipped[selectedSlot] = id;
          G.equipped[otherSlot] = tmp;
        } else if(otherSlot !== selectedSlot){
          G.equipped[selectedSlot] = id;
        }
        renderSkillBook(); updateSkillUI(); save();
      };
    }
    libEl.appendChild(card);
  }
}

function drawGround(){
  const T = 80;
  const x0 = Math.floor(state.camX / T) - 1;
  const x1 = Math.ceil((state.camX + W) / T) + 1;
  const y0 = Math.floor(state.camY / T) - 1;
  const y1 = Math.ceil((state.camY + H) / T) + 1;
  if(!isFinite(x0) || !isFinite(x1) || !isFinite(y0) || !isFinite(y1)) return;
  if(x1 - x0 > 200 || y1 - y0 > 200) return;
  const bio = BIOMES[state.biome] || BIOMES[0];
  for(let ty = y0; ty < y1; ty++){
    for(let tx = x0; tx < x1; tx++){
      const h = hash2(tx, ty);
      ctx.fillStyle = `hsl(${bio.h1 + h*bio.h2},${bio.s1 + h*bio.s2}%,${bio.l1 + h*bio.l2}%)`;
      ctx.fillRect(tx*T, ty*T, T+1, T+1);
      if(h > 0.38){
        ctx.fillStyle = `hsla(${bio.h1 + h*bio.h2 + 14},${bio.s1 + h*bio.s2 + 8}%,${bio.l1 + h*bio.l2 + 10}%,.6)`;
        for(let i=0;i<3;i++){
          const px = tx*T + hash2(tx*3+i, ty*7+i*13) * T;
          const py = ty*T + hash2(tx*11+i*5, ty*3+i) * T;
          ctx.fillRect(px, py, 2.5, 8);
        }
      }
    }
  }
}
function drawLake(lake){
  ctx.save(); ctx.translate(lake.x, lake.y);
  let c0, c1, c2;
  if(lake.type === 'lava'){ c0='#ffaa40'; c1='#cc2200'; c2='rgba(60,20,10,.8)'; }
  else if(lake.type === 'blood'){ c0='#8a1a2a'; c1='#4a0818'; c2='rgba(30,4,10,.8)'; }
  else if(lake.type === 'ice'){ c0='#bfe8f8'; c1='#7fb8d8'; c2='rgba(150,200,230,.75)'; }
  else if(lake.type === 'spirit'){ c0='#ffd870'; c1='#e8a840'; c2='rgba(120,80,20,.6)'; }
  else if(lake.type === 'swamp'){ c0='#4a6a30'; c1='#2a4a18'; c2='rgba(20,30,10,.85)'; }
  else if(lake.type === 'oasis'){ c0='#5aa8c8'; c1='#2a7a9a'; c2='rgba(20,80,120,.75)'; }
  else if(lake.type === 'star'){ c0='#5a4aa0'; c1='#2a1a6a'; c2='rgba(10,4,40,.85)'; }
  else { c0='#3f8a9a'; c1='#2a627a'; c2='rgba(26,60,74,.65)'; }
  const g = ctx.createRadialGradient(0,0,0,0,0,Math.max(1,lake.rx));
  g.addColorStop(0,c0); g.addColorStop(.72,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0,0,lake.rx,lake.ry,0,0,7); ctx.fill();
  ctx.restore();
}

/* ============ 玩家绘制（修复版：遁光不 return，光球叠加） ============ */
function drawPlayer(){
  ctx.save();
  ctx.translate(P.x, P.y);
  
  // 遁光光球效果（叠加在人形之上，不 return）
  if(P.escaping > 0){
    const pulse = 0.9 + Math.sin(state.t*14)*0.1;
    ctx.save();
    const gg = ctx.createRadialGradient(0, -26, 5, 0, -26, 55*pulse);
    gg.addColorStop(0, 'rgba(255,255,220,.85)');
    gg.addColorStop(0.4, 'rgba(255,240,180,.5)');
    gg.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, -26, 55*pulse, 0, 7); ctx.fill();
    for(let i=0;i<6;i++){
      const a = state.t*6 + i * Math.PI/3;
      ctx.fillStyle = 'rgba(255,240,180,.7)';
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*22, -26 + Math.sin(a)*22, 8, 3, a, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  }
  
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 6, 0, 0, 7); ctx.fill();
  
  // 护盾
  if(state.shield > 0){
    const shPulse = 0.7 + Math.sin(state.t*6)*0.3;
    ctx.strokeStyle = `rgba(255,240,150,${0.5*shPulse})`;
    ctx.fillStyle = `rgba(255,240,150,${0.12*shPulse})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -26, 40, 0, 7); ctx.fill(); ctx.stroke();
  }
  
  // 御剑飞行脚下的剑
  if(P.flying > 0){
    const w0 = currentWeapon() || WEAPONS[0];
    ctx.save(); ctx.translate(0, 2);
    ctx.shadowColor = `rgba(${w0.color},1)`; ctx.shadowBlur = 18;
    ctx.fillStyle = '#e8faff';
    ctx.beginPath(); ctx.moveTo(-32,0); ctx.lineTo(-6,3); ctx.lineTo(26,0); ctx.lineTo(-6,-3); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
  }
  
  // 光晕（武器颜色）
  const w = currentWeapon() || WEAPONS[0];
  const g = ctx.createRadialGradient(0,-30,2,0,-30,42);
  g.addColorStop(0, `rgba(${w.color},.22)`);
  g.addColorStop(0.6,`rgba(${w.color},.08)`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-30,42,0,7); ctx.fill();
  
  // 应用飞行/上下浮动偏移
  const bob = P.moving ? Math.abs(Math.sin(P.anim))*3 : 0;
  const flyOffset = P.flying > 0 ? 12 + Math.sin(state.t*14)*3 : 0;
  ctx.translate(0, -flyOffset);
  const y0 = -bob;
  
  // 长袍
  ctx.fillStyle = '#35597e';
  ctx.beginPath();
  ctx.moveTo(-12,-2); ctx.lineTo(12,-2); ctx.lineTo(9,-36+y0); ctx.lineTo(-9,-36+y0);
  ctx.closePath(); ctx.fill();
  
  // 衣纹
  ctx.fillStyle = 'rgba(150,210,240,.28)';
  ctx.fillRect(-3.5,-34+y0,7,29);
  
  // 腰带
  ctx.fillStyle = '#c8a45c';
  ctx.fillRect(-11,-16+y0,22,3);
  
  // 领口
  ctx.fillStyle = '#e4d4ac';
  ctx.beginPath();
  ctx.moveTo(-6,-36+y0); ctx.lineTo(6,-36+y0); ctx.lineTo(0,-28+y0);
  ctx.closePath(); ctx.fill();
  
  // 头
  ctx.fillStyle = '#f0d4ac';
  ctx.beginPath(); ctx.arc(0,-46+y0,9,0,7); ctx.fill();
  
  // 头发
  ctx.fillStyle = '#1a1c26';
  ctx.beginPath(); ctx.arc(0,-48+y0,9.5, Math.PI*1.02, Math.PI*1.98); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-57+y0,4.8,0,7); ctx.fill();
  
  // 眼睛
  if(P.dir !== 3){
    ctx.fillStyle = '#1a1a1a';
    const off = P.dir === 1 ? -2.2 : P.dir === 2 ? 2.2 : 0;
    ctx.beginPath(); ctx.arc(-3+off,-46+y0,1.4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc( 3+off,-46+y0,1.4,0,7); ctx.fill();
  }
  
  // 挥剑
  if(P.swing > 0){
    try { drawSwordInLocal(); } catch(e){}
  }
  
  ctx.restore();
}
function drawSwordInLocal(){
  const w = currentWeapon() || WEAPONS[0];
  const total = 0.26;
  const prog = 1 - P.swing / total;
  const eased = 1 - Math.pow(1 - prog, 2.4);
  const base = P.swingAngle;
  const sweep = Math.PI * 1.0;
  const side = P.swingSide;
  const start = base - sweep/2 * side;
  const cur = start + sweep * eased * side;
  ctx.save();
  ctx.translate(0, -28);
  const trailA = Math.pow(1 - prog, 0.6);
  ctx.globalAlpha = trailA * 0.55;
  const g = ctx.createRadialGradient(0,0,12,0,0,95);
  g.addColorStop(0, `rgba(${w.color},0)`);
  g.addColorStop(0.5, `rgba(${w.color},0.5)`);
  g.addColorStop(1, 'rgba(240,250,255,0)');
  ctx.fillStyle = g;
  const a1 = Math.min(start, cur), a2 = Math.max(start, cur);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,95, a1, a2); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = trailA * 0.9;
  ctx.strokeStyle = `rgba(${w.color},0.95)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0,0,92, a1, a2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.rotate(cur);
  ctx.shadowColor = `rgba(${w.color},1)`; ctx.shadowBlur = 14;
  ctx.fillStyle = '#f2faff';
  ctx.beginPath(); ctx.moveTo(16,-3); ctx.lineTo(80,0); ctx.lineTo(16,3); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemy(e){
  const alpha = e.dead ? Math.max(0, e.deadTimer / (e.elite?1.4:0.55)) : 1;
  const wob = Math.sin(state.t*6 + e.seed)*2;
  const scale = e.elite ? 5.0 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(e.x, e.y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,0, e.elite?36:15, e.elite?14:6, 0,0,7); ctx.fill();
  const glowR = e.elite ? 110 : (e.isHuman ? 45 : 30);
  const g = ctx.createRadialGradient(0,-40,3,0,-40,glowR);
  g.addColorStop(0, e.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-40,glowR,0,7); ctx.fill();
  if(e.frozen > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(160,230,255,.42)';
    ctx.beginPath(); ctx.ellipse(0,-30+wob,26,34,0,0,7); ctx.fill();
    ctx.restore();
  }
  if(e.elite) drawBossBody(e, state.t, wob);
  else drawEnemyBody(e, state.t, wob);
  ctx.restore();
  if(!e.dead && !e.elite && e.hp < e.maxHp){
    const w = 32, h = 4;
    const bx = e.x - w/2, by = e.y - 56;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(bx-1, by-1, w+2, h+2);
    ctx.fillStyle = '#5a2020'; ctx.fillRect(bx, by, w, h);
    ctx.fillStyle = '#e8705a';
    ctx.fillRect(bx, by, w * Math.max(0, e.hp/e.maxHp), h);
  }
}

function drawSwordArray(){
  if(!isSwordArrayOn()) return;
  const n = swordCount();
  if(n === 0) return;
  const w = currentWeapon() || WEAPONS[0];
  const primaryRGB = isSwordGod() ? '255,220,120' : w.color;
  const radius = 58;
  for(let i = 0; i < n; i++){
    const ang = state.swordAngle + i * (Math.PI*2 / n);
    const sx = P.x + Math.cos(ang) * radius;
    const sy = P.y - 26 + Math.sin(ang) * radius * 0.55;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang + Math.PI/2);
    ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 14;

    ctx.closePath(); ctx.fill();

function drawBeams(){
  for(const b of beams){
    const a = b.life / b.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = `rgba(${b.color},1)`;
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath();
    for(let i = 0; i <= b.segs; i++){
      const tt = i / b.segs;
      let x = b.x1 + (b.x2 - b.x1) * tt;
      let y = b.y1 + (b.y2 - b.y1) * tt;
      if(i > 0 && i < b.segs){ x += rnd(-b.jitter, b.jitter); y += rnd(-b.jitter, b.jitter); }
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of particles){
    const a = p.life / p.maxLife;
    if(p.type === 'dot'){
      const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = `rgb(${p.color})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
      ctx.globalAlpha = a * 0.95;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawEffects(){
  for(const fx of effects){
    const t = fx.life / fx.maxLife;
    if(fx.type === 'fan'){
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = t * 0.7;
      ctx.fillStyle = `rgba(${fx.color},0.5)`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, fx.range, -fx.halfAngle, fx.halfAngle);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(fx.type === 'ring'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},0.9)`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(fx.type === 'shockwave'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t * 0.9;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * t + 1;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(fx.type === 'beam'){
      ctx.save();
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * t * 0.6 + 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawDomain(){
  if(state.domain <= 0) return;
  const R = state.domainRadius;
  const c = state.domainColor || '255,220,140';
  const pulse = 0.85 + Math.sin(state.t * 6) * 0.12;
  ctx.save();
  ctx.globalAlpha = 0.18 * pulse;
  const bg = ctx.createRadialGradient(P.x, P.y + 4, 10, P.x, P.y + 4, R);
  bg.addColorStop(0, `rgba(${c}, 0.7)`);
  bg.addColorStop(1, `rgba(${c}, 0)`);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.9 * pulse;
  ctx.strokeStyle = `rgba(${c}, 1)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.stroke();
  ctx.restore();
}
function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const f of floats){
    const a = f.life / f.maxLife;
    const fs = (f.big ? 21 : 17);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.font = `bold ${fs.toFixed(1)}px "Songti SC","STSong",serif`;
    ctx.strokeStyle = 'rgba(0,0,0,0.82)';

    ctx.strokeText(f.text, f.x, f.y);

    ctx.fillText(f.text, f.x, f.y);

const motes = [];

function drawMotes(dt){

    m.y -= m.v * dt;
    if(m.y < -0.02){ m.y = 1.02; m.x = Math.random(); }
    ctx.fillStyle = `rgba(180,255,230,${m.a})`;

function collectVisibleProps(){
  const cx0 = Math.floor((state.camX - 120) / CELL);
  const cx1 = Math.floor((state.camX + W + 120) / CELL);
  const cy0 = Math.floor((state.camY - 160) / CELL);
  const cy1 = Math.floor((state.camY + H + 120) / CELL);
  const out = [];
  if(!isFinite(cx0) || !isFinite(cx1) || !isFinite(cy0) || !isFinite(cy1)) return out;
  if(cx1 - cx0 > 30 || cy1 - cy0 > 30) return out;
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const c = getChunk(cx, cy);
      for(const p of c.props) out.push(p);
    }
  }
  return out;
}
function collectVisibleLakes(){
  const lx0 = Math.floor((state.camX - 200) / LAKE_CELL);
  const lx1 = Math.floor((state.camX + W + 200) / LAKE_CELL);
  const ly0 = Math.floor((state.camY - 200) / LAKE_CELL);
  const ly1 = Math.floor((state.camY + H + 200) / LAKE_CELL);
  const out = [];
  if(!isFinite(lx0) || !isFinite(lx1) || !isFinite(ly0) || !isFinite(ly1)) return out;
  if(lx1 - lx0 > 20 || ly1 - ly0 > 20) return out;
  for(let ly = ly0; ly <= ly1; ly++){
    for(let lx = lx0; lx <= lx1; lx++){
      const lake = lakeAt(lx, ly);
      if(lake) out.push(lake);
    }
  }
  return out;
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx = 0, sy = 0;
  if(state.shakeT > 0){
    const k = state.shakeT / 0.12;
    sx = (Math.random()-0.5) * state.shakeMag * k * 2;
    sy = (Math.random()-0.5) * state.shakeMag * k * 2;
  }
  const camX = state.camX - sx, camY = state.camY - sy;
  ctx.save();
  ctx.translate(-camX, -camY);
  drawGround();
  for(const lake of collectVisibleLakes()) drawLake(lake);
  for(const h of state.herbs){
    if(!h.alive) continue;
    if(h.x < camX-60 || h.x > camX+W+60 || h.y < camY-60 || h.y > camY+H+60) continue;
    drawHerb(h);
  }
  drawDomain();
  for(const p of particles){
    if(p.type !== 'dot') continue;
    const a = p.life / p.maxLife;
    const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
    ctx.globalAlpha = a * 0.3;
    ctx.fillStyle = `rgb(${p.color})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
    ctx.globalAlpha = a * 0.95;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const propsList = collectVisibleProps();
  const list = [];
  for(const p of propsList){
    if(p.x < camX-80 || p.x > camX+W+80 || p.y < camY-160 || p.y > camY+H+80) continue;
    list.push({ y: p.y, kind: 0, ref: p });
  }
  for(const lm of state.landmarks){
    const pad = lm.r * 3;
    if(lm.x < camX - pad || lm.x > camX + W + pad ||
       lm.y < camY - pad * 2 || lm.y > camY + H + pad) continue;
    list.push({ y: lm.y, kind: 3, ref: lm });
  }
  for(const e of state.enemies){
    if(!isNum(e.x) || !isNum(e.y)) continue;
    const pad = e.elite ? 400 : 120;
    if(e.x < camX-pad || e.x > camX+W+pad || e.y < camY-pad*1.5 || e.y > camY+H+pad) continue;
    list.push({ y: e.y, kind: 1, ref: e });
  }
  list.push({ y: P.y, kind: 2, ref: null });
  list.sort((a,b) => a.y - b.y);
  for(const o of list){
    if(o.kind === 0) drawPropByType(o.ref);
    else if(o.kind === 1) drawEnemy(o.ref);
    else if(o.kind === 2) drawPlayer();
    else if(o.kind === 3) drawLandmark(o.ref);
  }
  drawSwordArray();
  drawProjectiles();
  drawBeams();
  for(const p of particles){
    if(p.type === 'dot') continue;
    const a = p.life / p.maxLife;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawEffects();
  drawFloats();
  ctx.restore();
  const bio = BIOMES[state.biome] || BIOMES[0];
  ctx.fillStyle = bio.tint;
  ctx.fillRect(0,0,W,H);
  drawMotes(dt);
  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);
}

let hudAcc = 0;
function renderHUD(){
  const rn = $('realmName'); if(rn) rn.textContent = isMaxLv() ? '化神期·圆满' : realmText();
  const hpF = $('hpFill'); if(hpF) hpF.style.width = (G.hp/G.maxHp*100).toFixed(1)+'%';
  const hpL = $('hpLbl'); if(hpL) hpL.textContent = '气血 ' + fmt(G.hp) + ' / ' + fmt(G.maxHp);
  const mpF = $('mpFill'); if(mpF) mpF.style.width = (G.mp/G.maxMp*100).toFixed(1)+'%';
  const mpL = $('mpLbl'); if(mpL) mpL.textContent = '灵力 ' + fmt(G.mp) + ' / ' + fmt(G.maxMp);
  const need = qiNeed();
  const qiF = $('qiFill'), qiL = $('qiLbl');
  if(isMaxLv()){
    if(qiF) qiF.style.width = '100%';
    if(qiL) qiL.textContent = '化神圆满 · 修为 ' + fmt(G.qi);
  } else {
    if(qiF) qiF.style.width = Math.min(100, G.qi/need*100).toFixed(1)+'%';
    if(qiL) qiL.textContent = '修为 ' + fmt(G.qi) + ' / ' + fmt(need);
  }
  const sl = $('stoneLine'); if(sl) sl.textContent = '灵石 ' + fmt(G.stones);
  const w = currentWeapon();
  const wl = $('weaponLine'); if(wl) wl.textContent = '⚔ ' + w.name + ' +' + Math.round(w.atkBonus*100) + '%';
  const swCnt = swordCount();
  let sw = '剑阵 · 未悟';
  if(isSwordGod()) sw = '剑阵 · ' + swCnt + ' 剑齐鸣';
  else if(isSwordArrayOn()) sw = '剑阵 · ' + swCnt + ' 剑环身';
  const swl = $('swordLine'); if(swl) swl.textContent = sw;
  const bl = $('biomeLine'); if(bl) bl.textContent = (BIOMES[state.biome]||BIOMES[0]).name;
  const shl = $('shieldLine');
  if(shl){
    if(state.shield > 0){
      shl.style.display = 'block';
      shl.textContent = '护盾 ' + fmt(state.shield);
    } else shl.style.display = 'none';
  }
}
function updateBossBar(){
  let boss = null, bd = 1e9;
  for(const e of state.enemies){
    if(e.dead || !e.elite) continue;
    const screenX = e.x - state.camX;
    const screenY = e.y - state.camY;
    if(screenX < -100 || screenX > W + 100 || screenY < -100 || screenY > H + 100) continue;
    const d = Math.hypot(e.x-P.x, e.y-P.y);
    if(d < bd){ bd = d; boss = e; }
  }
  const bar = $('bossBar');
  if(!bar) return;
  if(boss){
    bar.style.display = 'flex';
    const bn = $('bossName'); if(bn) bn.textContent = boss.name;
    const pct = Math.max(0, boss.hp / boss.maxHp);
    const bf = $('bossHpFill'); if(bf) bf.style.width = (pct * 100).toFixed(1) + '%';
    const bt = $('bossHpText');
    if(bt) bt.textContent = fmt(Math.max(0, boss.hp)) + ' / ' + fmt(boss.maxHp);
  } else {
    bar.style.display = 'none';
  }
}

function buildSkillBar(){
  const bar = $('skillBar'); if(!bar) return;
  bar.innerHTML = '';
  for(let i = 0; i < 8; i++){
    const b = document.createElement('button');
    b.className = 'skillBtn'; b.id = 'skillBtn' + i;
    b.innerHTML = '<span class="skName">—</span><span class="skMp">—</span><div class="cdMask"></div>';
    b.addEventListener('pointerdown', ev=>{ ev.preventDefault(); castSkill(i); });
    bar.appendChild(b);
  }
}
const atkBtn = $('attackBtn');
if(atkBtn) atkBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); doAttack(); });
const herbBtn = $('herbBtn');
if(herbBtn) herbBtn.addEventListener('click', ()=>{
  if(!state.nearHerb || !state.nearHerb.alive) return;
  const h = state.nearHerb; h.alive = false;
  if(Math.random() < 0.6){
    const q = Math.floor(qiNeed() * 0.5);
    G.qi += q;
    toast('灵草 · 修为 +' + fmt(q));
  } else {
    G.mp = Math.min(G.maxMp, G.mp + Math.floor(G.maxMp * 0.4));
    toast('灵草 · 灵力恢复');
  }
  const idx = state.herbs.indexOf(h);
  if(idx >= 0) state.herbs.splice(idx, 1);
  renderHUD(); save();
});
const mapBtn = $('mapBtn');
if(mapBtn) mapBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleMap(); });
const mapCloseBtn = $('mapCloseBtn');
if(mapCloseBtn) mapCloseBtn.addEventListener('click', closeMap);
const mapOverlayEl = $('mapOverlay');
if(mapOverlayEl) mapOverlayEl.addEventListener('click', e=>{ if(e.target === mapOverlayEl) closeMap(); });
const skillBookBtn = $('skillBookBtn');
if(skillBookBtn) skillBookBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleSkillBook(); });
const skillBookCloseBtn = $('skillBookCloseBtn');
if(skillBookCloseBtn) skillBookCloseBtn.addEventListener('click', closeSkillBook);
const skillBookOverlayEl = $('skillBookOverlay');
if(skillBookOverlayEl) skillBookOverlayEl.addEventListener('click', e=>{ if(e.target === skillBookOverlayEl) closeSkillBook(); });
const bagBtn = $('bagBtn');
if(bagBtn) bagBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); toggleBag(); });
const bagCloseBtn = $('bagCloseBtn');
if(bagCloseBtn) bagCloseBtn.addEventListener('click', closeBag);
const bagOverlayEl = $('bagOverlay');
if(bagOverlayEl) bagOverlayEl.addEventListener('click', e=>{ if(e.target === bagOverlayEl) closeBag(); });
const advanceBtn = $('advanceBtn');
if(advanceBtn) advanceBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); advanceRealm(); });

function tryBreak(){
  if(!state.started || isMaxLv()) return;
  const need = qiNeed();
  if(G.qi < need) return;
  G.qi -= need;
  G.layer++;
  if(G.layer > MAX_LAYER){ G.layer = 1; G.realm++; }
  if(G.realm > MAX_REALM){ G.realm = MAX_REALM; G.layer = MAX_LAYER; }
  recalc(); G.hp = G.maxHp; G.mp = G.maxMp;
  refreshUnlockedSkills();
  toast('突破 · ' + realmText());
  renderHUD(); save();
}

function save(){
  try{
    localStorage.setItem('xiantu16', JSON.stringify({
      realm:G.realm, layer:G.layer, qi:G.qi, stones:G.stones,
      biome:state.biome,
      equipped: G.equipped,
      unlockedSkills: Array.from(G.unlockedSkills),
      weapons: Array.from(G.weapons),
      currentWeapon: G.currentWeapon
    }));
  }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem('xiantu16') || 'null');
    if(d){
      G.realm = d.realm|0;
      G.layer = d.layer|0 || 1;
      G.qi    = d.qi|0;
      G.stones= d.stones|0;
      if(typeof d.biome === 'number' && d.biome >= 0 && d.biome < BIOMES.length){
        if(G.realm >= (BIOMES[d.biome].realmReq || 0)) state.biome = d.biome;
      }
      if(Array.isArray(d.equipped) && d.equipped.length === 8) G.equipped = d.equipped;
      if(Array.isArray(d.unlockedSkills)) G.unlockedSkills = new Set(d.unlockedSkills);
      if(Array.isArray(d.weapons)){ G.weapons = new Set(d.weapons); G.weapons.add(0); }
      if(typeof d.currentWeapon === 'number' && G.weapons.has(d.currentWeapon)){
        G.currentWeapon = d.currentWeapon;
      }
    }
  }catch(e){}
}

let lastT = performance.now();
let cleanTimer = 0;
let errorShown = false;
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  try {
    if(state.started){
      if(W < 10 || H < 10) resize();
      state.t += dt;
      if(state.grace > 0) state.grace = Math.max(0, state.grace - dt);
      if(playerInvuln > 0) playerInvuln = Math.max(0, playerInvuln - dt);
      if(!isMaxLv()){
        G.qi += cultSpeed() * dt;
        if(G.qi >= qiNeed()) tryBreak();
      }
      for(const id of ALL_SKILL_IDS){
        if(G.cd[id] > 0) G.cd[id] = Math.max(0, G.cd[id] - dt);
      }
      G.mp = Math.min(G.maxMp, G.mp + G.maxMp * 0.08 * dt);
      G.hp = Math.min(G.maxHp, G.hp + G.maxHp * 0.005 * dt);
      updatePlayer(dt);
      for(let i = state.enemies.length - 1; i >= 0; i--){
        const e = state.enemies[i];
        updateEnemy(e, dt);
        if(e.dead && e.deadTimer <= 0) state.enemies.splice(i, 1);
      }
      updateSwordArray(dt);
      updateProjectiles(dt);
      updateDomain(dt);
      updateCamera(dt);
      updateInteract();
      updateEffects(dt);
      updateParticles(dt);
      maintainEnemies();
      maintainHerbs();
      updateSkillUI();
      updateBossBar();
      cleanTimer += dt;
      if(cleanTimer > 8){ cleanTimer = 0; cleanChunks(); }
      hudAcc += dt;
      if(hudAcc > 0.12){ hudAcc = 0; renderHUD(); }
      render(dt);
    }
  } catch(err){
    if(!errorShown){ errorShown = true; console.error('[仙途] 运行错误：', err); }
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    if(!isNum(P.x) || !isNum(P.y)){ P.x = origin.x; P.y = origin.y; }
    if(!isNum(state.camX) || !isNum(state.camY)){ state.camX = P.x - W/2; state.camY = P.y - H/2; }
    if(!isNum(G.hp) || G.hp <= 0) G.hp = 1;
    if(!isNum(G.mp) || G.mp < 0) G.mp = 0;
  }
  requestAnimationFrame(loop);
}

function initGame(){
  load();
  recalc();
  refreshUnlockedSkills();
  G.hp = G.maxHp;
  G.mp = G.maxMp;
  G.cd = {};
  for(const id of ALL_SKILL_IDS) G.cd[id] = 0;
  G.atkCd = 0;
  if(W < 10 || H < 10) resize();
  const startBi = state.biome >= 0 && state.biome < BIOMES.length ? state.biome : 0;
  const origin = BIOME_ORIGIN[startBi];
  P.x = origin.x; P.y = origin.y;
  P.swing = 0; P.flying = 0; P.escaping = 0;
  P.dir = 0; P.moving = false; P.anim = 0;
  P.escapeHit = new Set();
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  state.started = true;
  state.grace = 3;
  state.t = 0;
  state.nextSpawnT = 0;
  state.nextHerbT = 0;
  state.nextBossT = 15;
  state.swordCd = 0;
  state.domain = 0;
  state.biome = startBi;
  state.shakeT = 0;
  state.shield = 0; state.shieldTime = 0;
  state.enemies.length = 0;
  state.herbs.length = 0;
  particles.length = 0;
  effects.length = 0;
  floats.length = 0;
  projectiles.length = 0;
  beams.length = 0;
  chunks.clear(); lakeCache.clear();
  setupLandmarks();
  for(let i = 0; i < 5; i++) spawnHerb();
  buildSkillBar();
  updateSkillUI();
  renderHUD();
  lastT = performance.now();
  errorShown = false;
  toast('拖动屏幕 / WASD 移动');
  setTimeout(()=> toast('金丹期解锁「遁光」· 化光球撞击敌人'), 2600);
  setTimeout(()=> toast('每区三处建筑群落'), 5000);
  setInterval(save, 5000);
}
const startBtn = $('startBtn');
if(startBtn) startBtn.addEventListener('click', ()=>{
  if(state.started) return;
  const ss = $('startScreen');
  if(ss) ss.style.display = 'none';
  setTimeout(()=>{ resize(); initGame(); }, 30);
});
requestAnimationFrame(loop);
</script>
