      screenFlash('rgba(200,160,255,.3)', 460);
      shake(8, 0.3);
      break;
    }
  }
}

function damageEnemy(e, rawAtk, angle, fxCfg){
  if(e.dead) return;
  const dmg = Math.max(1, Math.floor(rawAtk - e.def * 0.6));
  e.hp -= dmg;
  e.hitFlash = 0.14;
  const dx = Math.cos(angle || 0), dy = Math.sin(angle || 0);
  const push = e.elite ? 4 : 10;
  e.x += dx * push; e.y += dy * push;
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
  const crit = dmg > G.atk * 2;
  addFloat(e.x + rnd(-6,6), e.y - (e.elite ? 108 : 32), dmg, crit ? '#ffd060' : '#ffe0a0', crit);
  const hx = e.x, hy = e.y - (e.elite ? 44 : 20);
  const col = fxCfg ? (fxCfg.fx || fxCfg.color) : '255,230,170';
  const kind = fxCfg && fxCfg.hitFx ? fxCfg.hitFx : 'spark';
  const cnt = crit ? 12 : 7;
  for(let k = 0; k < cnt; k++){
    const a = (angle || 0) + rnd(-1.4, 1.4);
    const sp = rnd(90, crit ? 380 : 260);
    addParticle(hx + rnd(-6,6), hy + rnd(-10,10), {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
      life: rnd(0.22, 0.5), size: rnd(2, crit ? 7 : 5),
      color: col, type: kind === 'frost' ? 'dot' : 'spark',
      angle: a, spin: rnd(-12,12), drag: 0.88, grow: kind === 'frost' ? 3 : 0
    });
  }
  if(kind === 'frost'){
    fxPillar(hx, e.y, 22, col, 0.35, 14);
    fxRing(hx, hy, e.r + 22, '235,252,255', 0.3, 2.5);
  } else if(kind === 'burn'){
    for(let k = 0; k < 5; k++){
      addParticle(hx + rnd(-8,8), hy + rnd(-10,10), { vx: rnd(-30,30), vy: rnd(-140,-60),
        life: rnd(0.35,0.6), size: rnd(3,6), color: k % 2 ? col : '255,230,140', type: 'dot', drag: 0.95, grow: 4 });
    }
    fxGlow(hx, hy, e.r + 34, col, 0.28);
  } else if(kind === 'shadow'){
    for(let k = 0; k < 6; k++){
      const a = rnd(0, Math.PI*2);
      addParticle(hx, hy, { vx: Math.cos(a)*rnd(60,200), vy: Math.sin(a)*rnd(60,200) - 20,
        life: rnd(0.3,0.55), size: rnd(3,6), color: col, type: 'dot', drag: 0.92, grow: 3 });
    }
    fxSlash(hx, hy, (angle || 0) + Math.PI/2, e.r + 30, col, 0.26, 4);
    fxSlash(hx, hy, (angle || 0) - Math.PI/2, e.r + 30, col, 0.26, 4);
  } else if(kind === 'leaf'){
    for(let k = 0; k < 6; k++){
      const a = rnd(0, Math.PI*2);
      addParticle(hx, hy, { vx: Math.cos(a)*rnd(50,170), vy: Math.sin(a)*rnd(50,140) - 60,
        life: rnd(0.5,0.9), size: rnd(2.5,5), color: k % 2 ? col : '190,255,190', type: 'dot', drag: 0.96, grow: 1 });
    }
  } else if(kind === 'burst'){
    fxGlow(hx, hy, e.r + 26, col, 0.25);
  }
  if(crit) fxSlash(hx, hy, angle || 0, e.r + 34, '255,240,190', 0.22, 3);
  else fxRing(hx, hy, e.r + 14, col, 0.2, 2.5);
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  e.deadTimer = e.elite ? 1.4 : 0.55;
  e.chasing = false;
  G.qi     += e.rewardQi;
  G.stones += e.rewardStones;
  addFloat(e.x, e.y - (e.elite ? 130 : 44), '修为 +' + fmt(e.rewardQi), '#89e2ce', e.elite);
  const nP = e.elite ? 46 : (e.refined ? 18 : 12);
  for(let k = 0; k < nP; k++){
    const a = rnd(0, Math.PI*2), sp = rnd(50, e.elite ? 300 : 170);
    addParticle(e.x + rnd(-8,8), e.y - 22 + rnd(-16,16), {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp*0.7 - rnd(30, 120),
      life: rnd(0.4, 0.9), size: rnd(2, e.elite ? 7 : 4.5),
      color: k % 3 === 0 ? '137,226,206' : (e.refined ? '255,230,150' : (e.rgb || '200,200,200')),
      type: k % 2 ? 'dot' : 'spark', angle: a, drag: 0.93, grow: k % 3 === 0 ? 2 : 0
    });
  }
  fxRing(e.x, e.y - 10, e.elite ? 116 : (e.refined ? 70 : 46), '150,240,220',
    e.elite ? 0.8 : 0.45, e.elite ? 5 : 3);
  if(e.elite){
    const sid = BIOME_SKILL_ID(state.biome);
    if(!G.unlockedSkills.has(sid)){
      G.unlockedSkills.add(sid);
      const sk = SKILL_LIBRARY[sid];
      if(sk){ addFloat(P.x, P.y - 240, '领悟 · ' + sk.name, '#ffd870', true); toast('领悟 · ' + sk.name); }
    }
    const wid = state.biome + 1;
    if(WEAPON_MAP[wid] && !G.weapons.has(wid)){
      G.weapons.add(wid);
      const w = WEAPON_MAP[wid];
      addFloat(P.x, P.y - 270, '获得 · ' + w.name, 'rgb(' + w.color + ')', true);
      toast('获得神兵 · ' + w.name);
    }
    shake(14, 0.6);
    screenFlash('rgba(255,180,220,.5)', 600);
    save();
  } else {
    shake(3, 0.18);
  }
}
function damagePlayer(e){
  if(state.t < playerInvuln) return;
  if((P.flying > 0 && Math.random() < 0.3) || P.escaping > 0) return;
  playerInvuln = state.t + 0.5;
  let dmg = Math.max(1, Math.floor(e.atk * enemyAtkMul() - G.def * 0.6));
  if(state.shield > 0){
    const absorbed = Math.min(dmg, state.shield);
    state.shield -= absorbed;
    dmg -= absorbed;
    if(state.shield <= 0){
      for(let k = 0; k < 16; k++){
        const a = rnd(0, Math.PI*2);
        addParticle(P.x, P.y - 26, { vx: Math.cos(a)*rnd(90,260), vy: Math.sin(a)*rnd(60,200) - 40,
          life: rnd(0.3,0.6), size: rnd(2,5), color:'255,236,160', type:'spark', angle:a, drag:0.9 });
      }
      fxRing(P.x, P.y - 10, 90, '255,236,160', 0.4, 3);
    }
    if(dmg <= 0){ addFloat(P.x, P.y - 52, '格挡', '#ffe070', false); return; }
  }
  G.hp -= dmg;
  addFloat(P.x, P.y - 52, dmg, '#ff6b5a');
  shake(5, 0.14);
  hurtFlash();
  for(let k = 0; k < 7; k++){
    const a = rnd(0, Math.PI*2);
    addParticle(P.x, P.y - 28, { vx: Math.cos(a)*rnd(40,150), vy: Math.sin(a)*rnd(30,120) - 30,
      life: rnd(0.25,0.5), size: rnd(2,4), color:'255,90,70', type:'spark', angle:a, drag:0.88 });
  }
  fxShock(P.x, P.y - 20, 52, '255,90,80', 0.25, 4);
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  P.x += dx/d * 16; P.y += dy/d * 16;
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(G.hp <= 0) playerDie();
}
function playerDie(){
  G.hp = Math.floor(G.maxHp * 0.3);
  G.qi = Math.floor(G.qi * 0.8);
  state.shield = 0;
  hazards.length = 0;
  state.vortex = null;
  P.escaping = 0;
  const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
  P.x = origin.x; P.y = origin.y;
  state.grace = 3;
  state.domain = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  toast('你被击倒，修为受损');
  save();
}

function updateSwordArray(dt){
  if(!isSwordArrayOn()) return;
  state.swordAngle += dt * 2.2;
  state.swordInnerAngle -= dt * 3.2;
  if(state.t < state.swordCd) return;
  const n = swordCount();
  if(n === 0) return;
  const radius = 58;
  let target = null, td = 450;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if(d < td){ td = d; target = e; }
  }
  if(!target) return;
  const idx = Math.floor(Math.random() * n);
  const ang = state.swordAngle + idx * (Math.PI*2 / n);
  const sx = P.x + Math.cos(ang) * radius;
  const sy = P.y - 26 + Math.sin(ang) * radius * 0.55;
  const dx = target.x - sx, dy = (target.y - 20) - sy;
  const d = Math.hypot(dx, dy) || 1;
  const dmgBase = G.atk * (isSwordGod() ? 1.2 : 0.8) * weaponAtkMul();
  const w = currentWeapon() || WEAPONS[0];
  projectiles.push({
    x: sx, y: sy, vx: dx/d * 720, vy: dy/d * 720,
    target, damage: dmgBase,
    life: 1.8, color: isSwordGod() ? '255,220,120' : w.color,
    r: 3, homing: true, isArray: true,
    angle: Math.atan2(dy, dx), weapon: w.id, flySword: true,
    glowColor: isSwordGod() ? '255,235,170' : '255,255,255'
  });
  for(let k = 0; k < 4; k++){
    addParticle(sx, sy, { vx: -Math.cos(ang) * rnd(20, 70) + rnd(-30,30), vy: -Math.sin(ang)*rnd(10,40),
      life: 0.3, size: rnd(3, 6), color: isSwordGod() ? '255,235,170' : w.color,
      type: 'dot', drag: 0.9, grow: 2 });
  }
  state.swordCd = state.t + (isSwordGod() ? 0.3 : totalLv() >= 27 ? 0.42 : 0.5);
}
function updateProjectiles(dt){
  for(let i = projectiles.length-1; i >= 0; i--){
    const pr = projectiles[i];
    pr.life -= dt;
    if(pr.life <= 0 || !isNum(pr.x) || !isNum(pr.y)){ projectiles.splice(i,1); continue; }
    if(pr.freeT > 0) pr.freeT -= dt;
    if(!pr.isEnemy && pr.target && pr.target.dead) pr.target = null;
    if(!pr.isEnemy && !pr.target && (pr.homing || pr.freeT != null)){
      /* 出鞘之后自动锁定最近的妖物 */
      let best = null, bd = 520;
      for(const e of state.enemies){
        if(e.dead) continue;
        const dd = Math.hypot(e.x - pr.x, e.y - 20 - pr.y);
        if(dd < bd){ bd = dd; best = e; }
      }
      if(best && !(pr.freeT > 0)) pr.target = best;
    }
    if(pr.freeT <= 0 && pr.target && !pr.target.dead){
      const dx = pr.target.x - pr.x;
      const dy = (pr.target.y - 20) - pr.y;
      const d = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(pr.vx, pr.vy) || 600;
      const turn = pr.homing ? 8 : 5.5;
      pr.vx += (dx/d*sp - pr.vx) * Math.min(1, dt*turn);
      pr.vy += (dy/d*sp - pr.vy) * Math.min(1, dt*turn);
    }
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    if((pr.homing || pr.target) && Math.random() < 0.75){
      addParticle(pr.x + rnd(-3,3), pr.y + rnd(-3,3), {
        vx: -pr.vx * 0.05 + rnd(-15,15), vy: -pr.vy * 0.05 + rnd(-15,15),
        life: 0.28, size: rnd(2.5, 5), color: pr.glowColor || pr.color, type: 'dot', drag: 0.9, grow: 1 });
    }
    if(pr.isEnemy){
      if(Math.hypot(P.x - pr.x, (P.y - 26) - pr.y) < 24 + pr.r){
        damagePlayer({ atk: pr.damage, x: pr.x, y: pr.y });
        projectiles.splice(i, 1);
        continue;
      }
      continue;
    }
    /* 天光刃穿透：沿途每一个未击中过的妖物都吃一次伤害，剑不消失 */
    if(pr.pierce){
      if(!pr.hitSet) pr.hitSet = new Set();
      let any = false;
      for(const e of state.enemies){
        if(e.dead || pr.hitSet.has(e)) continue;
        if(Math.hypot(e.x - pr.x, (e.y - 18) - pr.y) < e.r + 26){
          pr.hitSet.add(e);
          const ha = Math.atan2(pr.vy, pr.vx);
          damageEnemy(e, pr.damage, ha);
          fxSlash(pr.x, pr.y, ha, 60, pr.glowColor || '255,255,255', 0.24, 5);
          fxBurst(pr.x, pr.y, 8, 240, pr.color, { size: 4, life: 0.3 });
          any = true;
        }
      }
      if(any) shake(3, 0.1);
      continue;
    }
    let hit = null;
    for(const e of state.enemies){
      if(e.dead) continue;
      if(Math.hypot(e.x - pr.x, (e.y - 18) - pr.y) < e.r + 18){ hit = e; break; }
    }
    if(hit){
      const ha = Math.atan2(pr.vy, pr.vx);
      damageEnemy(hit, pr.damage, ha);
      fxSlash(pr.x, pr.y, ha, 46, pr.glowColor || '255,255,255', 0.22, 4);
      fxBurst(pr.x, pr.y, 7, 220, pr.color, { size: 4, life: 0.3 });
      /* 冰魄彗星：命中即爆，冰封一片 */
      if(pr.comet){
        const R = pr.blast || 90;
        effects.push({ type:'shockwave', x:pr.x, y:pr.y, maxR:R * 1.6, color:pr.color, life:0.6, maxLife:0.6, width:14 });
        fxShock(pr.x, pr.y, R * 1.2, '255,255,255', 0.5, 10);
        fxBurst(pr.x, pr.y, 24, 380, pr.glowColor || '255,255,255', { size: 6, life: 0.6, type: 'dot', grow: 3 });
        for(let g = 0; g < 16; g++){
          const ga = rnd(0, Math.PI * 2);
          addParticle(pr.x, pr.y, { vx: Math.cos(ga) * rnd(120, 320), vy: Math.sin(ga) * rnd(90, 240),
            life: rnd(0.3, 0.6), size: rnd(3, 8), color: pr.color, type: 'spark', angle: ga, drag: 0.92 });
        }
        for(const e of state.enemies){
          if(e.dead || e === hit) continue;
          if(Math.hypot(e.x - pr.x, e.y - pr.y) < R + e.r){
            damageEnemy(e, pr.damage * 0.55, Math.atan2(e.y - pr.y, e.x - pr.x));
            if(pr.freeze) e.frozen = Math.max(e.frozen || 0, pr.freeze);
          }
        }
        if(pr.freeze) hit.frozen = Math.max(hit.frozen || 0, pr.freeze);
        screenFlash('rgba(220,245,255,.35)', 380);
        shake(12, 0.35);
      }
      projectiles.splice(i,1);
    }
  }
}
let domainFxT = 0;
function updateDomain(dt){
  if(state.domain <= 0) return;
  state.domain -= dt;
  state.domainTick -= dt;
  domainFxT -= dt;
  const c = state.domainColor || '255,220,140';
  const sub = state.domainColorSub || '255,255,255';
  if(Math.random() < 0.6){
    const R = state.domainRadius * Math.sqrt(Math.random());
    const a = rnd(0, Math.PI*2);
    addParticle(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R * 0.62, {
      vx: -Math.sin(a) * 120, vy: -Math.cos(a) * 60 - 50,
      life: rnd(0.3, 0.6), size: rnd(3, 6), color: Math.random() < 0.5 ? c : sub,
      type: 'dot', drag: 0.94, grow: 1 });
  }
  if(state.domainTick <= 0){
    state.domainTick = 0.28;
    const R = state.domainRadius;
    for(const e of state.enemies){
      if(e.dead) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
      if(d > R) continue;
      const a = Math.atan2(e.y - P.y, e.x - P.x);
      damageEnemy(e, G.atk * state.domainPower, a, state.domainSkill || null);
      fxSlash(e.x, e.y - 20, a + rnd(-0.6, 0.6), 40, sub, 0.25, 3);
      if(state.domainTrail === 'blood'){
        G.hp = Math.min(G.maxHp, G.hp + Math.floor(G.maxHp * 0.004));
      }
    }
    if(domainFxT <= 0){ domainFxT = 0.56; fxShock(P.x, P.y, R, c, 0.55, 3); }
  }
}

function updatePlayer(dt){
  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;
  if(joy.active){ ix += joy.vx; iy += joy.vy; }
  const len = Math.hypot(ix, iy);
  if(len > 1){ ix /= len; iy /= len; }
  if(!isNum(ix)) ix = 0; if(!isNum(iy)) iy = 0;
  if(P.frozen > 0){ P.frozen = Math.max(0, P.frozen - dt); ix = 0; iy = 0; }
  if(P.slow > 0) P.slow = Math.max(0, P.slow - dt);
  /* 步行略微提速（原 178 → 205），御剑与遁光同步上调 */
  let speed = 205;
  if(P.slow > 0) speed *= 0.55;
  if(P.flying > 0) speed = 470;
  if(P.escaping > 0) speed = 900;
  P.x += ix * speed * dt; P.y += iy * speed * dt;
  P.moving = Math.hypot(ix, iy) > 0.12;
  if(P.moving){
    P.anim += dt * (P.flying > 0 ? 4 : P.escaping > 0 ? 2 : 11);
    if(Math.abs(ix) >= Math.abs(iy)) P.dir = ix > 0 ? 2 : 1;
    else P.dir = iy > 0 ? 0 : 3;
  }
  if(P.swing > 0) P.swing = Math.max(0, P.swing - dt);
  if(P.flying > 0){
    P.flying = Math.max(0, P.flying - dt);
    P.flyTrail += dt;
    if(P.flyTrail > 0.03){
      P.flyTrail = 0;
      const wc = (currentWeapon() || WEAPONS[0]).color;
      addParticle(P.x + rnd(-10,10), P.y + rnd(-6,6), {
        vx: rnd(-25,25), vy: rnd(-25,25),
        life: 0.45, size: rnd(2,5), color: wc,
        type: 'dot', drag: 0.94
      });
      if(Math.random() < 0.5){
        addParticle(P.x + rnd(-16,16), P.y - 6 + rnd(-4,4), {
          vx: rnd(-40,40), vy: rnd(-10,30), life: 0.3, size: rnd(5,9),
          color: '235,250,255', type: 'line', angle: rnd(0, 6), drag: 0.9 });
      }
    }
  }
  if(P.escaping > 0){
    P.escaping = Math.max(0, P.escaping - dt);
    P.escapeTrail += dt;
    if(P.escapeTrail > 0.02){
      P.escapeTrail = 0;
      addParticle(P.x + rnd(-12,12), P.y - 26 + rnd(-12,12), {
        vx: rnd(-30,30), vy: rnd(-30,30),
        life: 0.5, size: rnd(4,10),
        color: '255,240,180', type: 'dot', drag: 0.92, grow: 4
      });
    }
    const hitR = 45;
    for(const e of state.enemies){
      if(e.dead || P.escapeHit.has(e)) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if(d < hitR + e.r){
        P.escapeHit.add(e);
        const dmg = G.atk * 3.5 * weaponAtkMul();
        const ea = Math.atan2(e.y - P.y, e.x - P.x);
        damageEnemy(e, dmg, ea, SKILL_LIBRARY[24]);
        effects.push({ type:'shockwave', x:e.x, y:e.y - 20, maxR:180,
          color:'255,240,180', life:0.45, maxLife:0.45, width:8 });
        fxSlash(e.x, e.y - 20, ea + Math.PI/2, 70, '255,255,240', 0.3, 6);
        fxPillar(e.x, e.y, 34, '255,245,200', 0.35, 20);
        shake(6, 0.2);
      }
    }
  }
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(!isNum(P.x) || !isNum(P.y)){
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    P.x = origin.x; P.y = origin.y;
    state.camX = P.x - W/2; state.camY = P.y - H/2;
  }
}

function updateEnemy(e, dt){
  if(e.dead){ e.deadTimer -= dt; return; }
  if(!isNum(e.x) || !isNum(e.y)) return;
  if(e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
  if(e.frozen > 0){ e.frozen -= dt; if(e.frozen <= 0) e.frozen = 0; }
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy);
  const canChase = state.grace <= 0 && state.t >= (e.calmUntil || 0);
  const chaseDist = e.elite ? 650 : 380;
  if(e.frozen > 0){
    e.chasing = false;
  } else if(canChase && d < chaseDist){
    e.chasing = true;
    const atkRange = e.elite ? 110 : (e.isHuman ? 200 : 46);
    const dm = curDiff();
    if(d > atkRange){
      const sp = (e.elite ? 105 : (e.isHuman ? 85 : 92)) * (1 + (dm - 1) * 0.11) * (e.refined ? 1.14 : 1);
      e.x += dx/d * sp * dt; e.y += dy/d * sp * dt;
    }
    if(e.isHuman && d < 500){
      e.spellCd -= dt;
      if(e.spellCd <= 0){
        e.spellCd = rnd(2.5, 4.0) * Math.max(0.6, 1 / Math.sqrt(dm));
        castEnemySpell(e, dx, dy, d);
      }
    }
    if(d <= atkRange + 5){
      e.atkCd -= dt;
      if(e.atkCd <= 0){
        e.atkCd = (e.elite ? 1.4 : 1.5) * Math.max(0.60, 1 / Math.sqrt(dm));
        damagePlayer(e);
        if(e.refined) fxSlash(P.x, P.y - 26, Math.atan2(dy, dx), 54, '255,200,140', 0.22, 4);
      }
    }
    if(e.elite){
      if(!e.enraged && e.hp < e.maxHp * 0.5){
        e.enraged = true;
        toast('「' + e.name + '」暴怒！');
        addFloat(e.x, e.y - 152, '暴怒', '#ff6070', true);
        effects.push({ type:'shockwave', x:e.x, y:e.y, maxR:300, color:'255,80,100',
          life:0.6, maxLife:0.6, width:14 });
        screenFlash('rgba(255,80,110,.35)', 420);
        shake(10, 0.4);
      }
      e.skillCd = (e.skillCd == null ? 4 : e.skillCd) - dt;
      if(e.skillCd <= 0 && d < 640){
        castBossSkill(e);
      }
      if(Math.random() < 0.3){
        const a = rnd(0, Math.PI*2), rr = rnd(50, 110);
        const bsk = SKILL_LIBRARY[BIOME_SKILL_ID(state.biome)];
        addParticle(e.x + Math.cos(a)*rr, e.y - 40 + Math.sin(a)*rr*0.6, {
          vx: -Math.cos(a)*30, vy: -rnd(20, 70), life: rnd(0.4, 0.8),
          size: rnd(3, 7), color: (bsk && bsk.fx) || '255,200,200',
          type: 'dot', drag: 0.96, grow: 3 });
      }
    }
  } else {
    e.chasing = false;
    e.wanderT -= dt;
    if(e.wanderT <= 0){
      e.wanderT = rnd(1.2, 3.2);
      e.wanderDir = rnd(0, Math.PI*2);
      e.wanderMove = Math.random() < 0.6;
    }
    if(e.wanderMove){
      e.x += Math.cos(e.wanderDir) * 32 * dt;
      e.y += Math.sin(e.wanderDir) * 32 * dt;
    }
  }
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
}
function castEnemySpell(e, dx, dy, d){
  const angle = Math.atan2(dy, dx);
  if(e.spellType === 'fan'){
    const wcol = e.color.replace('#','');
    const rr = parseInt(wcol.substr(0,2),16) || 140;
    const gg = parseInt(wcol.substr(2,2),16) || 200;
    const bb = parseInt(wcol.substr(4,2),16) || 255;
    const cStr = rr+','+gg+','+bb;
    for(let k = 0; k < 12; k++){
      const a = angle + rnd(-0.5, 0.5);
      const sp = rnd(200, 320);
      addParticle(e.x, e.y - 20, {
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.35, size: 10, color: cStr,
        type: 'line', angle: a, drag: 0.88
      });
    }
    effects.push({ type:'fan', x:e.x, y:e.y - 20, angle, range:220, halfAngle: Math.PI/3,
      color: cStr, life:0.3, maxLife:0.3 });
    let diff = Math.abs(angle - Math.atan2(P.y - e.y, P.x - e.x));
    if(diff > Math.PI) diff = Math.PI*2 - diff;
    if(d < 220 && diff < Math.PI/3){
      damagePlayer({ atk: e.atk * 1.3, x: e.x, y: e.y });
    }
  } else if(e.spellType === 'fireball'){
    projectiles.push({
      x: e.x, y: e.y - 20,
      vx: Math.cos(angle) * 320, vy: Math.sin(angle) * 320,
      target: null, damage: e.atk * 1.6, life: 2.0,
      color: '255,140,200', r: 6, isEnemy: true,
      angle: angle + Math.PI/2, glowColor: '255,200,240'
    });
    fxGlow(e.x + Math.cos(angle)*24, e.y - 32, 24, '255,150,220', 0.35);
    fxBurst(e.x + Math.cos(angle)*24, e.y - 32, 6, 160, '255,180,240', { angle, spread: 0.5, size: 4, life: 0.3 });
  } else if(e.spellType === 'blink'){
    if(d > 100 && d < 450){
      const targetX = P.x - dx/d * 60;
      const targetY = P.y - dy/d * 60;
      const ox = e.x, oy = e.y;
      e.x = targetX; e.y = targetY;
      e.atkCd = 0.3;
      fxRing(ox, oy, 60, '150,80,200', 0.4, 3);
      fxRing(e.x, e.y, 60, '190,130,255', 0.4, 3);
      effects.push({ type:'ghost', x: ox, y: oy, color:'150,80,200', life:0.5, maxLife:0.5, kind: e.kind });
      fxBurst(e.x, e.y - 26, 12, 220, '190,130,255', { size: 5, life: 0.4 });
    }
  }
}

function updateCamera(dt){
  const tx = P.x - W/2, ty = P.y - H/2;
  if(!isNum(tx) || !isNum(ty)) return;
  state.camX += (tx - state.camX) * Math.min(1, dt*9);
  state.camY += (ty - state.camY) * Math.min(1, dt*9);
}
function updateInteract(){
  /* 灵芝 */
  state.nearHerb = null;
  let hd = 78;
  for(const h of state.herbs){
    if(!h.alive) continue;
    const d = Math.hypot(h.x - P.x, h.y - P.y);
    if(d < hd){ hd = d; state.nearHerb = h; }
  }
  /* 宝箱：走近即开，已开启的不再提示；身边有妖物时暂缓开启 */
  state.nearChest = null;
  for(const st of collectChestSites()){
    if(chestOpened(st.chest)) continue;
    const cp = chestBoxPos(st);
    if(Math.hypot(cp.x - P.x, cp.y - P.y) < 96){ state.nearChest = st; break; }
  }
  if(state.nearChest && state.t > 0.8 &&
     !state.enemies.some(e => !e.dead && Math.hypot(e.x - P.x, e.y - P.y) < 70)){
    openChest(state.nearChest);
    state.nearChest = null;
  }
  const hb = $('herbBtn');
  if(hb) hb.style.display = state.nearHerb ? 'block' : 'none';
  const cbtn = $('chestBtn');
  if(cbtn){
    const cs = state.nearChest;
    if(cs && !chestOpened(cs.chest)){
      const cname = (cs.cfg ? cs.cfg.chest : '宝箱');
      cbtn.style.display = 'block';
      cbtn.textContent = '秘 境 · ' + cname + '（走近即开）';
    } else cbtn.style.display = 'none';
  }
}function updateEffects(dt){
  for(let i = effects.length - 1; i >= 0; i--){
    effects[i].life -= dt;
    if(effects[i].life <= 0) effects.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y += f.vy * dt;
    if(f.life <= 0) floats.splice(i, 1);
  }
  for(let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if(beams[i].life <= 0) beams.splice(i, 1);
  }
  if(state.shakeT > 0) state.shakeT = Math.max(0, state.shakeT - dt);
  if(state.shield > 0){
    state.shieldTime -= dt;
    if(state.shieldTime <= 0){ state.shield = 0; state.shieldTime = 0; }
  }
}
function updateSkillUI(){
  for(let slot = 0; slot < 8; slot++){
    const btn = $('skillBtn' + slot);
    if(!btn) continue;
    const mask = btn.querySelector('.cdMask');
    const nameEl = btn.querySelector('.skName');
    const mpEl = btn.querySelector('.skMp');
    if(!mask || !nameEl || !mpEl) continue;
    const skillId = G.equipped[slot];
    if(skillId == null){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = ''; mpEl.textContent = ''; continue;
    }
    const sk = SKILL_LIBRARY[skillId];
    if(!sk || !G.unlockedSkills.has(skillId)){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = '未悟'; mpEl.textContent = ''; continue;
    }
    btn.classList.remove('empty');
    nameEl.textContent = sk.key;
    mpEl.textContent = sk.mp + '灵';
    const cd = G.cd[skillId] || 0;
    if(cd > 0){
      mask.style.height = (cd / sk.cd * 100) + '%';
      btn.classList.add('cooling');
    } else {
      mask.style.height = '0%'; btn.classList.remove('cooling');
    }
    if(G.mp < sk.mp) btn.classList.add('noMp'); else btn.classList.remove('noMp');
  }
}

let mapOpen = false;
function toggleMap(){ if(!state.started) return; if(mapOpen) closeMap(); else openMap(); }
function openMap(){ if(mapOpen) return; mapOpen = true; renderMap(); const el = $('mapOverlay'); if(el) el.style.display = 'flex'; }
function closeMap(){ mapOpen = false; const el = $('mapOverlay'); if(el) el.style.display = 'none'; }
function renderMap(){
  const grid = $('mapGrid'); if(!grid) return;
  grid.innerHTML = '';
  BIOMES.forEach((bio, i) => {
    const unlocked = totalLv() >= bio.realmReq;
    const isCurrent = state.biome === i;
    const card = document.createElement('div');
    card.className = 'mapCard' + (unlocked ? '' : ' locked') + (isCurrent ? ' current' : '');
    const reqName = biomeReqText(i);
    const skillId = BIOME_SKILL_ID(i);
    const skillUnlocked = G.unlockedSkills.has(skillId);
    const skillName = SKILL_LIBRARY[skillId] ? SKILL_LIBRARY[skillId].name : '';
    const boss = BOSS_BY_BIOME[i];
    const weapon = WEAPON_MAP[i + 1];
    const weaponOwned = weapon && G.weapons.has(weapon.id);
    const isNew = unlocked && !G.seenBiomes.has(i);
    const nextBio = BIOMES[i + 1];
    card.innerHTML = `
      <div class="mcHeader"><span class="mcEmoji">${BIOME_EMOJIS[i] || '🗺️'}</span><span class="mcName">${bio.name}</span></div>
      <div class="mcReq">难度 ${diffLabel(i)} · 开境于 ${reqName}${isCurrent ? ' · 当前所在' : ''}${isNew ? ' · <b style="color:#ffd870">新</b>' : ''}</div>
      <div class="mcDesc">${bio.desc}</div>
      <div class="mcDesc" style="color:#e0a8ff">专属妖物 · ${(bio.mobs || []).map(k => (ENEMY_TYPES.find(o => o.kind === k) || {}).name).filter(Boolean).join('、') || '—'}</div>
      <div class="mcDesc" style="color:#ffb8c8">妖王 · ${boss ? boss.name : '未现'}</div>
      <div class="mcDesc" style="color:${skillUnlocked?'#89e2ce':'rgba(200,190,170,.45)'}">功法：${skillUnlocked ? '「' + skillName : '击败妖王可得'}</div>
      <div class="mcDesc" style="color:${weaponOwned?'#ffd870':'rgba(200,190,170,.45)'}">神兵：${weaponOwned ? '「' + weapon.name : '击败妖王可得'}</div>
      ${nextBio ? `<div class="mcDesc" style="color:rgba(255,200,120,.5)">下一境 · ${nextBio.name}（${biomeReqText(i + 1)}）</div>` : ''}
      ${unlocked ? '' : `<div class="mcLock">🔒 需修为至 ${reqName}（当前 ${realmText()}）</div>`}
    `;
    if(unlocked && !isCurrent) card.onclick = () => teleportToBiome(i);
    else if(isCurrent) card.onclick = () => closeMap();
    grid.appendChild(card);
  });
}
function teleportToBiome(bi){
  if(!state.started) return;
  if(bi < 0 || bi >= BIOMES.length) return;
  const bio = BIOMES[bi];
  if(totalLv() < bio.realmReq){ toast('境界不足 · 需修为至 ' + biomeReqText(bi)); return; }
  state.biome = bi;
  const origin = BIOME_ORIGIN[bi];
  P.x = origin.x; P.y = origin.y;
  P.flying = 0; P.swing = 0; P.escaping = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  chunks.clear(); lakeCache.clear();
  state.enemies = []; state.herbs = [];
  state.grace = 3;
  state.nextSpawnT = state.t + 0.5;
  state.nextHerbT = state.t + 0.5;
  state.nextBossT = state.t + 20;
  state.domain = 0; state.shield = 0;
  hazards.length = 0;
  state.vortex = null;
  setupLandmarks();
  for(let i = 0; i < 5; i++) spawnHerb();
  closeMap();
  showBiomeBanner(bio.name);
  toast(bio.name + ' · 难度 ' + diffLabel(bi));
  effects.push({ type:'shockwave', x:P.x, y:P.y, maxR:220, color:'200,240,255', life:0.7, maxLife:0.7, width:10 });
  screenFlash('rgba(200,240,255,.5)', 500);
  shake(4, 0.2);
  renderHUD(); save();
}

function genChestSite(bi, cx, cy, rng){
  const cfg = CHEST_POOL[bi] || CHEST_POOL[0];
  const ids = biomeSecrets(bi);
  const chest = {
    x: cx, y: cy, id: 'ch' + bi + '_' + Math.round(cx) + '_' + Math.round(cy),
    bi: bi, open: false
  };
  const buildings = [makeSiteBuilding(cx, cy, 'chestHut', 92, bi, rng, cx, cy)];
  /* 左右各一座守护石灯 */
  buildings.push(makeSiteBuilding(cx - 96, cy + 24, 'lantern', 38, bi, rng, cx, cy));
  buildings.push(makeSiteBuilding(cx + 96, cy + 24, 'lantern', 38, bi, rng, cx, cy));
  const scenery = [];
  const propTypes = (BIOMES[bi] && BIOMES[bi].propTypes) || ['rock'];
  for(let i = 0; i < 6; i++){
    const a = rng() * Math.PI * 2;
    const rad = 120 + rng() * 80;
    scenery.push({
      x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad * 0.86,
      type: propTypes[Math.floor(rng() * propTypes.length)],
      k: 0.9 + rng() * 0.5, seed: rng() * 100
    });
  }
  const pavers = [];
  for(let i = 0; i < 18; i++){
    const a = rng() * Math.PI * 2;
    const rad = Math.sqrt(rng()) * 130;
    pavers.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad * 0.9,
      rx: 8 + rng() * 12, ry: 4 + rng() * 4, al: 0.06 + rng() * 0.1 });
  }
  return { x:cx, y:cy, biome:bi, kind:'chest', buildings:buildings, scenery:scenery,
    padR: 170, clear: 195, pavers:pavers, chest:chest, cfg:cfg };
}
/* 宝箱是否已经开启（跨存档记忆） */
function chestOpened(chest){
  if(!chest) return true;
  if(typeof chest.opened === 'boolean') return chest.opened;
  return G.chests.has(chest.id);
}
function chestBoxPos(st){
  const cfg = st.cfg || CHEST_POOL[st.biome] || CHEST_POOL[0];
  /* 宝箱供在建筑内部的台座前 */
  const h = st.buildings[0];
  const sc = (h ? h.r : 92) / 60;
  return { x: st.x + (h ? 0 : 0), y: st.y - 18 * sc, sc: sc, cfg: cfg };
}
function openChest(st){
  if(!st || !st.chest) return;
  if(chestOpened(st.chest)) return;
  st.chest.opened = true;
  G.chests.add(st.chest.id);
  const cfg = st.cfg || CHEST_POOL[st.biome] || CHEST_POOL[0];
  const cp = chestBoxPos(st);
  if(Math.hypot(P.x - cp.x, P.y - cp.y) > 170) return;
  /* 宝箱开启特效 */
  effects.push({ type:'ring', x: cp.x, y: cp.y, maxR: 130, color: cfg.glow, life: 0.8, maxLife: 0.8 });
  effects.push({ type:'shockwave', x: cp.x, y: cp.y, maxR: 190, color: '255,240,190', life: 0.7, maxLife: 0.7, width: 10 });
  fxPillar(cp.x, cp.y, 60, cfg.glow, 0.7, 30);
  fxBurst(cp.x, cp.y, 30, 340, cfg.glow, { size: 6, life: 0.8, type: 'dot', grow: 3 });
  fxBurst(cp.x, cp.y, 16, 260, '255,245,210', { size: 5, life: 0.6, type: 'spark', spin: 8 });
  screenFlash('rgba(255,240,190,.35)', 520);
  shake(8, 0.35);

  const sk = takeChestManual(st.biome);
  if(sk){
    setTimeout(()=>{
      if(!state.started) return;
      showManualToast(sk, '秘 籍 开 悟');
      fxRunes(P.x, P.y - 6, 80, sk.id || 0, sk.fx || sk.color, 1.4, sk.key);
    }, 650);
  } else {
    const qi = Math.floor(qiNeed() * 1.5);
    G.qi += qi;
    addFloat(cp.x, cp.y - 70, '已寻得此境全部秘术', '#89e2ce', true);
    addFloat(cp.x, cp.y - 110, '修为 +' + fmt(qi), '#ffd870');
    toast('此境秘术已尽数悟得 · 得修为 ' + fmt(qi));
  }
  renderHUD(); save();
}
/* 开箱所悟秘术：只给该区域「秘境宝箱专属」的那一部；
   突破境界所赠的功法（含击败妖王掉落的那部）绝不放进宝箱 */
function takeChestManual(bi){
  const own = BIOME_SECRET_IDS[bi] ? BIOME_SECRET_IDS[bi][0] : null;
  const sk = own != null ? SKILL_LIBRARY[own] : null;
  if(sk && !G.unlockedSkills.has(own)){
    G.unlockedSkills.add(own);
    autoEquipElsewhere();
    return sk;
  }
  return null;
}

function renderSkillBook(){
  const slotsEl = $('skillBookSlots');
  const libEl = $('skillBookLibrary');
  if(!slotsEl || !libEl) return;
  slotsEl.innerHTML = ''; libEl.innerHTML = '';
  for(let i = 0; i < 8; i++){
    const skillId = G.equipped[i];
    const sk = skillId != null ? SKILL_LIBRARY[skillId] : null;
    const b = document.createElement('button');
    b.className = 'skSlotBtn' + (i === selectedSlot ? ' selected' : '');
    b.innerHTML = `
      <span class="slotNum">${i+1}</span>
      <span class="slotKey" style="color:${sk?`rgba(${sk.color},1)`:'#555'}">${sk?sk.key:''}</span>
      <span class="slotName">${sk?sk.name:''}</span>
    `;
    b.onclick = () => { selectedSlot = i; renderSkillBook(); };
    slotsEl.appendChild(b);
  }
  for(const id of ALL_SKILL_IDS){
    const sk = SKILL_LIBRARY[id];
    if(!sk) continue;
    const unlocked = G.unlockedSkills.has(id);
    const equippedIn = G.equipped.indexOf(id);
    const card = document.createElement('div');
    card.className = 'skCard' + (equippedIn >= 0 ? ' equipped' : '') + (unlocked ? '' : ' locked');
    let tag = '';
    if(equippedIn >= 0) tag = `<div class="cardTag">已装备 · 位 ${equippedIn+1}</div>`;
    else if(!unlocked){
      const src = skillSourceText(sk);
      tag = src ? `<div class="cardLock">🔒 ${src}</div>` : `<div class="cardLock">🔒 未解锁</div>`;
    } else tag = `<div class="cardSource">${skillSourceText(sk, true) || ''}</div>`;
    card.innerHTML = `
      <div class="cardTop"><span class="cardKey" style="color:${unlocked?`rgba(${sk.color},1)`:'#888'}">${sk.key}</span><span class="cardName">${sk.name}</span></div>
      <div class="cardStats">耗灵 ${sk.mp} · CD ${sk.cd}s</div>${tag}
    `;
    if(unlocked){
      card.onclick = () => {
        /* 装备到选定格；空格（0）不参与互换，避免把剑气斩换进别的格子 */
        const otherSlot = G.equipped.indexOf(id);
        if(otherSlot >= 0 && otherSlot !== selectedSlot && G.equipped[selectedSlot] !== 0){
          const tmp = G.equipped[selectedSlot];
          G.equipped[selectedSlot] = id;
          G.equipped[otherSlot] = tmp;
        } else {
          G.equipped[selectedSlot] = id;
        }
        renderSkillBook(); updateSkillUI(); save();
      };
    }
    libEl.appendChild(card);
  }
}

/* 功法出处：开局只带剑气斩，其余皆须击败妖王或开启各境秘境宝箱 */
function skillSourceText(sk, owned){
  if(!sk) return '';
  if(sk.id === 0) return owned ? '入门本命剑' : '';
  if(sk.biome != null) return (BIOMES[sk.biome] ? BIOMES[sk.biome].name : '') + ' · 秘境宝箱';
  if(sk.id >= 14 && sk.id <= 23) return (BIOMES[sk.id - 14] ? BIOMES[sk.id - 14].name : '') + ' · 击败妖王';
  if(sk.reward && sk.unlockLv != null) return '突破境界 · ' + lvText(sk.unlockLv) + ' 凝成';
  return '散修机缘 · 秘境宝箱';
}

let bagTick = 0;
function renderBagPreviewTick(grid){
  cancelAnimationFrame(bagTick);
  const step = () => {
    if(!bagOpen) return;
    let any = false;
    grid.querySelectorAll('canvas.wprev').forEach(cv => {
      const w = WEAPON_MAP[cv.__wid];
      if(!w) return;
      any = true;
      try { drawWeaponPreview(cv, w); } catch(e){}
    });
    if(any) bagTick = requestAnimationFrame(step);
  };

function drawWeaponPreview(cv, w){
  if(!cv) return;
  cv.__wid = w.id;
  cv.dataset.wid = String(w.id);
  /* canvas 元素本身没有绘图方法，必须先取 2D 上下文 */
  const c2d = cv.getContext('2d');
  if(!c2d) return;
  c2d.setTransform(1, 0, 0, 1, 0, 0);
  const cw = cv.width, ch = cv.height;
  c2d.clearRect(0, 0, cw, ch);
  const bg = c2d.createRadialGradient(cw/2, ch/2, 6, cw/2, ch/2, cw*0.5);
  bg.addColorStop(0, `rgba(${w.color},0.18)`);
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  c2d.fillStyle = bg; c2d.fillRect(0, 0, cw, ch);
  /* ctx 是 const，不能重新赋值；改为直接把剑画在 c2d 上，
     并把 c2d 的变换交给一个包装，使 drawBladeBody 的绘制落到缩略图 canvas */
  const t = state.t || 0;
  c2d.save();
  c2d.translate(cw/2, ch/2);
  c2d.rotate(-Math.PI/4 * 0.85);
  const fit = Math.min(cw / 145, ch / 130);
  c2d.scale(fit, fit);
  c2d.shadowColor = `rgba(${w.color},0.95)`;
  c2d.shadowBlur = 14;
  /* drawBladeBody 内部只使用模块级 ctx，因此临时把它指向 c2d */
  paintOn(c2d, () => drawBladeBody(w, 74, 13.5, t, 1));
  c2d.shadowBlur = 0;
  c2d.restore();
  for(let i = 0; i < 7; i++){
    const a = t * 1.4 + i * Math.PI*2/7;
    const rr = (70 + Math.sin(t*3 + i)*8) * Math.min(cw / 260, 1);
    c2d.fillStyle = `rgba(${w.color},${0.35 + 0.4*Math.sin(t*4 + i)})`;
    c2d.beginPath(); c2d.arc(cw/2 + Math.cos(a)*rr, ch/2 + Math.sin(a)*rr*0.55, 2.2, 0, 7); c2d.fill();
  }
}

/* 在指定绘图上下文上执行一段使用模块级 ctx 的绘制代码 */
function paintOn(target, fn){
  const prev = ctx;
  ctx = target;
  try { fn(); } finally { ctx = prev; }
}

function advanceRealm(){
  if(!state.started) return;
  if(isMaxLv()){ toast('已至化神圆满'); return; }
  const prevLv = totalLv();
  G.layer++;
  if(G.layer > MAX_LAYER){ G.layer = 1; G.realm++; }
  if(G.realm > MAX_REALM){ G.realm = MAX_REALM; G.layer = MAX_LAYER; }
  recalc(); G.hp = G.maxHp; G.mp = G.maxMp;
  refreshUnlockedSkills();
  const crossed = G.realm > Math.floor(prevLv / MAX_LAYER);
  toast((crossed ? '破境 · ' : '晋升 · ') + realmText());
  screenFlash('rgba(255,230,160,.55)', 480);
  shake(crossed ? 10 : 6, crossed ? 0.4 : 0.25);
  if(mapOpen) renderMap();
  if(skillBookOpen) renderSkillBook();
  if(bagOpen) renderBag();
  renderHUD(); save();
  /* 新区域安排在「层内晋升」时开启（突破大境界那一步不另开），
     但若因读档/加速越过了开境的小境界，这里兜底补开，保证每个新区域都有提示 */
  if(isLayerReq(prevLv) || BIOMES.some((b, k) => k > 0 && !G.seenBiomes.has(k) && totalLv() >= b.realmReq)) checkBiomeUnlocks();
}

function drawGround(){
  const T = 80;
  const x0 = Math.floor(state.camX / T) - 1;
  const x1 = Math.ceil((state.camX + W) / T) + 1;
  const y0 = Math.floor(state.camY / T) - 1;
  const y1 = Math.ceil((state.camY + H) / T) + 1;
  if(!isFinite(x0) || !isFinite(x1) || !isFinite(y0) || !isFinite(y1)) return;
  if(x1 - x0 > 200 || y1 - y0 > 200) return;
  const bio = BIOMES[state.biome] || BIOMES[0];
  for(let ty = y0; ty < y1; ty++){
    for(let tx = x0; tx < x1; tx++){
      const h = hash2(tx, ty);
      ctx.fillStyle = `hsl(${bio.h1 + h*bio.h2},${bio.s1 + h*bio.s2}%,${bio.l1 + h*bio.l2}%)`;
      ctx.fillRect(tx*T, ty*T, T+1, T+1);
      if(h > 0.38){
        ctx.fillStyle = `hsla(${bio.h1 + h*bio.h2 + 14},${bio.s1 + h*bio.s2 + 8}%,${bio.l1 + h*bio.l2 + 10}%,.6)`;
        for(let i=0;i<3;i++){
          const px = tx*T + hash2(tx*3+i, ty*7+i*13) * T;
          const py = ty*T + hash2(tx*11+i*5, ty*3+i) * T;
          ctx.fillRect(px, py, 2.5, 8);
        }
      }
    }
  }
}
function drawLake(lake){
  ctx.save(); ctx.translate(lake.x, lake.y);
  let c0, c1, c2;
  if(lake.type === 'lava'){ c0='#ffaa40'; c1='#cc2200'; c2='rgba(60,20,10,.8)'; }
  else if(lake.type === 'blood'){ c0='#8a1a2a'; c1='#4a0818'; c2='rgba(30,4,10,.8)'; }
  else if(lake.type === 'ice'){ c0='#bfe8f8'; c1='#7fb8d8'; c2='rgba(150,200,230,.75)'; }
  else if(lake.type === 'spirit'){ c0='#ffd870'; c1='#e8a840'; c2='rgba(120,80,20,.6)'; }
  else if(lake.type === 'swamp'){ c0='#4a6a30'; c1='#2a4a18'; c2='rgba(20,30,10,.85)'; }
  else if(lake.type === 'oasis'){ c0='#5aa8c8'; c1='#2a7a9a'; c2='rgba(20,80,120,.75)'; }
  else if(lake.type === 'star'){ c0='#5a4aa0'; c1='#2a1a6a'; c2='rgba(10,4,40,.85)'; }
  else { c0='#3f8a9a'; c1='#2a627a'; c2='rgba(26,60,74,.65)'; }
  const g = ctx.createRadialGradient(0,0,0,0,0,Math.max(1,lake.rx));
  g.addColorStop(0,c0); g.addColorStop(.72,c1); g.addColorStop(1,c2);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0,0,lake.rx,lake.ry,0,0,7); ctx.fill();
  ctx.restore();
}

function bChestHut(s, t, seed, v){

function drawSwordInLocal(){
  const w = currentWeapon() || WEAPONS[0];
  const total = P.swing > 0.26 ? P.swing : 0.26;
  const prog = clamp(1 - P.swing / total, 0, 1);
  const eased = 1 - Math.pow(1 - prog, 2.4);
  const base = P.swingAngle;
  const sweep = Math.PI * 1.0;
  const side = P.swingSide;
  const start = base - sweep/2 * side;
  const cur = start + sweep * eased * side;
  ctx.save();
  ctx.translate(0, -28);
  const trailA = Math.pow(1 - prog, 0.6);
  const a1 = Math.min(start, cur), a2 = Math.max(start, cur);
  const g = ctx.createRadialGradient(0,0,12,0,0,112);
  g.addColorStop(0, `rgba(${w.color},0)`);
  g.addColorStop(0.5, `rgba(${w.color},0.55)`);
  g.addColorStop(1, 'rgba(240,250,255,0)');
  ctx.globalAlpha = trailA * 0.6;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,112, a1, a2); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = trailA * 0.9;
  ctx.strokeStyle = `rgba(${w.color},0.95)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0,0,108, a1, a2); ctx.stroke();
  ctx.globalAlpha = trailA * 0.8;
  ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0,0,102, a1, a2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.rotate(cur);
  ctx.translate(13, 0);
  /* 剑尖朝外：剑身局部 +X 即剑尖方向，旋转至与径向 cur 一致，
     剑柄留在半径 13 的内侧，挥砍时刃口始终朝外 */
  ctx.save();
  ctx.shadowColor = `rgba(${w.color},1)`; ctx.shadowBlur = 18;
  drawBladeBody(w, 46, 5.2, state.t, 1);
  ctx.restore();
  ctx.save();
  /* 剑尖灵光（局部 +X 端点） */
  ctx.translate(46, 0);
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.shadowColor = `rgba(${w.color},1)`; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
  weaponAura(w, P.x, P.y, 1.4, 0);
}

/* 多段线性渐变：stops = [[偏移, 颜色], ...] */

/* 平滑闭合曲线（Catmull-Rom 转三次贝塞尔） */

  ctx.moveTo(pts[0][0], pts[0][1]);

  for(let i = 0; i < last; i++){
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,

  if(closed) ctx.closePath();

/* 弯折的粗笔触（须、角、爪、闪电） */
function taper(x0, y0, cx, cy, x1, y1, w0, w1){

  ctx.quadraticCurveTo(cx + nx * (w0 + w1) * 0.5, cy + ny * (w0 + w1) * 0.5, x1, y1);
  ctx.quadraticCurveTo(cx - nx * (w0 + w1) * 0.5, cy - ny * (w0 + w1) * 0.5, x0 - nx * w0, y0 - ny * w0);

/* 妖王整体缩放：原先 5 倍显得过于巨大，缩到 3.6 倍（约占 3.6 个身位），
   身前的影子与灵光也同步按比例缩小 */
const BOSS_SCALE = 3.6;
function drawEnemy(e){
  const alpha = e.dead ? Math.max(0, e.deadTimer / (e.elite?1.4:0.55)) : 1;
  const wob = Math.sin(state.t*6 + e.seed)*2;
  const scale = e.elite ? BOSS_SCALE : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(e.x, e.y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,0, e.elite?26:15, e.elite?10:6, 0,0,7); ctx.fill();
  const glowR = e.elite ? 84 : (e.isHuman ? 45 : 30);
  const g = ctx.createRadialGradient(0,-40,3,0,-40,glowR);
  g.addColorStop(0, e.glow); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-40,glowR,0,7); ctx.fill();
  if(e.frozen > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(160,230,255,.42)';
    ctx.beginPath(); ctx.ellipse(0,-30+wob,26,34,0,0,7); ctx.fill();
    ctx.restore();
  }
  if(e.elite) drawBossBody(e, state.t, wob);
  else drawEnemyBody(e, state.t, wob);
  ctx.restore();
  if(!e.dead && !e.elite && e.hp < e.maxHp){
    const w = 32, h = 4;
    const bx = e.x - w/2, by = e.y - 56;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(bx-1, by-1, w+2, h+2);
    ctx.fillStyle = '#5a2020'; ctx.fillRect(bx, by, w, h);
    ctx.fillStyle = '#e8705a';
    ctx.fillRect(bx, by, w * Math.max(0, e.hp/e.maxHp), h);
  }
}

function drawSwordArray(){
  if(!isSwordArrayOn()) return;
  const n = swordCount();
  if(n === 0) return;
  const w = currentWeapon() || WEAPONS[0];
  const primaryRGB = isSwordGod() ? '255,220,120' : w.color;
  const radius = 58;
  const RY = 0.55;                       // 环轨的纵向压扁比
  for(let i = 0; i < n; i++){
    const ang = state.swordAngle + i * (Math.PI*2 / n);
    const sx = P.x + Math.cos(ang) * radius;
    const sy = P.y - 26 + Math.sin(ang) * radius * RY;
    /* 剑身局部 +X 即剑尖方向。
       椭圆 (cos a, RY·sin a) 在 a 处的法向（朝外）= (RY·cos a, sin a)，
       所以剑尖朝外的旋转角是 atan2(sin a, RY·cos a)；
       若用 atan2(sin a, cos a)（粒子所在的方向角）剑身会被摆成切向、横着飞。 */
    const outAng = Math.atan2(Math.sin(ang), RY * Math.cos(ang));
    const sw = Math.sin(state.t * 3 + i) * 0.16;
    ctx.save();
    /* 先移到轨道点，再沿朝外方向把剑身整体外推，
       使剑柄落在环上、剑尖朝外，不会插进身体 */
    ctx.translate(sx, sy);
    ctx.rotate(outAng + sw);
    ctx.translate(14, 0);
    ctx.globalAlpha = 0.95;
    ctx.save();
    ctx.scale(1.25, 1.25);
    ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 12;
    drawBladeBody(w, 18, 2.3, state.t + i, 0.8);
    ctx.restore();
    ctx.restore();
    ctx.fillStyle = `rgba(${primaryRGB},${0.5 + 0.5 * Math.sin(state.t * 8 + i)})`;
    ctx.beginPath();
    ctx.arc(sx + Math.cos(outAng) * 34, sy + Math.sin(outAng) * 34, 1.8, 0, 7);
    ctx.fill();
  }
  const innerN = Math.floor(n / 2) + 1;
  const innerR = 32;
  for(let i = 0; i < innerN; i++){
    const ang = state.swordInnerAngle + i * (Math.PI*2 / innerN);
    const sx = P.x + Math.cos(ang) * innerR;
    const sy = P.y - 26 + Math.sin(ang) * innerR * 0.6;
    const outAng = Math.atan2(Math.sin(ang), 0.6 * Math.cos(ang));
    ctx.save();
    ctx.translate(sx, sy);
    /* 内圈小剑同样剑尖朝外（tip 在局部 +X） */
    ctx.rotate(outAng);
    ctx.globalAlpha = 0.8;
    ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(220,245,255,0.9)';
    ctx.beginPath();
    ctx.moveTo(11,0); ctx.lineTo(-3,-2.2); ctx.lineTo(-9,0); ctx.lineTo(-3,2.2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const side = Math.sin(state.t * 2) > 0 ? 1 : -1;
  ctx.save();
  ctx.translate(P.x - side * 30, P.y - 52);
  ctx.rotate(0.9 + Math.sin(state.t * 2.4) * 0.1);
  ctx.shadowColor = `rgba(${primaryRGB},1)`; ctx.shadowBlur = 16;
  drawBladeBody(w, 27, 3.2, state.t, 0.9);
  ctx.restore();
}
function drawProjectiles(){
  for(const pr of projectiles){
    ctx.save();
    ctx.translate(pr.x, pr.y);
    /* 敌方法术弹是圆球，远近无妨；飞剑的剑身局部 +X 才是剑尖，
       所以必须直接朝速度方向，不能用 +π/2（那样剑身会被摆成横着飞） */
    ctx.rotate(Math.atan2(pr.vy, pr.vx) + (pr.isEnemy ? Math.PI/2 : 0));
    ctx.fillStyle = `rgba(${pr.color},1)`;
    if(pr.isEnemy){
      ctx.shadowColor = `rgba(${pr.color},1)`; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0,0,pr.r,0,7); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      const w = weaponOf(pr.weapon);
      ctx.shadowColor = `rgba(${pr.color},1)`; ctx.shadowBlur = 12;
      ctx.save();
      /* 高速飞剑拉出一条细长的剑气拖尾（沿 -X 即剑柄后方） */
      const spd = Math.hypot(pr.vx, pr.vy) || 0;
      if(pr.flySword && spd > 40){
        const tail = Math.min(70, spd * 0.07);
        const tg = ctx.createLinearGradient(-tail - 10, 0, 6, 0);
        tg.addColorStop(0, `rgba(${pr.color},0)`);
        tg.addColorStop(0.7, `rgba(${pr.glowColor || pr.color},.45)`);
        tg.addColorStop(1, `rgba(${pr.glowColor || '255,255,255'},.9)`);
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.moveTo(6,0); ctx.lineTo(-tail * 0.6, -3.2); ctx.lineTo(-tail - 10, 0); ctx.lineTo(-tail * 0.6, 3.2);
        ctx.closePath(); ctx.fill();
      }
      /* 剑柄落在弹道上，剑尖朝前 */
      ctx.translate(10, 0);
      drawBladeBody(w, 17, 2.2, state.t, 0.7);
      ctx.restore();
    }
    ctx.restore();
  }
}
function drawBeams(){
  for(const b of beams){
    const a = b.life / b.maxLife;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = `rgba(${b.color},1)`;
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath();
    for(let i = 0; i <= b.segs; i++){
      const tt = i / b.segs;
      let x = b.x1 + (b.x2 - b.x1) * tt;
      let y = b.y1 + (b.y2 - b.y1) * tt;
      if(i > 0 && i < b.segs){ x += rnd(-b.jitter, b.jitter); y += rnd(-b.jitter, b.jitter); }
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = `rgba(${b.sub || '255,255,255'},.95)`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for(let i = 0; i <= b.segs; i++){
      const tt = i / b.segs;
      let x = b.x1 + (b.x2 - b.x1) * tt;
      let y = b.y1 + (b.y2 - b.y1) * tt;
      if(i > 0 && i < b.segs){ x += rnd(-b.jitter, b.jitter) * 0.5; y += rnd(-b.jitter, b.jitter) * 0.5; }
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of particles){
    const a = p.life / p.maxLife;
    if(p.type === 'dot'){
      const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = `rgb(${p.color})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
      ctx.globalAlpha = a * 0.95;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawEffects(){
  for(const fx of effects){
    const t = fx.life / fx.maxLife;
    if(fx.type === 'fan'){
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = t * 0.7;
      ctx.fillStyle = `rgba(${fx.color},0.5)`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, fx.range, -fx.halfAngle, fx.halfAngle);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(fx.type === 'ring'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t;
      ctx.strokeStyle = `rgba(${fx.color},0.9)`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(fx.type === 'shockwave'){
      const r = fx.maxR * (1 - t);
      ctx.globalAlpha = t * 0.9;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * t + 1;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI*2); ctx.stroke();
    } else if(fx.type === 'beam'){
      ctx.save();
      ctx.lineCap = 'round';
      ctx.globalAlpha = t * 0.35;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = fx.width * (fx.core ? 1.5 : 1.0) * t + 10;
      ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
      ctx.globalAlpha = t;
      ctx.lineWidth = fx.width * t * 0.6 + 4;
      ctx.stroke();
      if(fx.core){
        ctx.globalAlpha = t;
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.lineWidth = Math.max(2, fx.width * t * 0.22);
        ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
      }
      ctx.restore();
    } else if(fx.type === 'slash'){
      const k = 1 - t;
      const L = fx.len * (0.55 + 0.45 * k);
      const wdt = (fx.thin || 4) * (0.4 + t * 0.6);
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.rotate(fx.angle);
      ctx.globalAlpha = Math.min(1, t * 1.3);
      ctx.shadowColor = `rgba(${fx.color},1)`;
      ctx.shadowBlur = 14 * t;
      const grd = ctx.createLinearGradient(0, 0, L, 0);
      grd.addColorStop(0, `rgba(${fx.color},0)`);
      grd.addColorStop(0.55, `rgba(${fx.color},${0.85 * t})`);
      grd.addColorStop(1, `rgba(255,255,255,${t})`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(L * 0.18, 0);
      ctx.quadraticCurveTo(L * 0.62, -wdt * 1.6 * (1 - t * 0.4), L, 0);
      ctx.quadraticCurveTo(L * 0.62, wdt * 0.5, L * 0.18, 0);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = `rgba(255,255,255,${t * 0.95})`;
      ctx.lineWidth = Math.max(1, wdt * 0.3);
      ctx.beginPath();
      ctx.moveTo(L * 0.2, 0);
      ctx.quadraticCurveTo(L * 0.62, -wdt * 1.1 * (1 - t * 0.4), L, 0);
      ctx.stroke();
      ctx.restore();
    } else if(fx.type === 'pillar'){
      const k = 1 - t;
      const h = fx.maxR * 2.6 * (0.25 + 0.75 * Math.min(1, k * 2.2));
      const w = fx.width * (0.35 + 0.65 * t);
      ctx.save();
      ctx.translate(fx.x, fx.y);
      ctx.globalAlpha = t;
      const pg = ctx.createLinearGradient(0, 0, 0, -h);
      pg.addColorStop(0, `rgba(${fx.color},.85)`);
      pg.addColorStop(0.45, `rgba(${fx.color},.45)`);
      pg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(-w, 0);
      ctx.lineTo(-w * 0.35, -h);
      ctx.lineTo(w * 0.35, -h);
      ctx.lineTo(w, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.5 * t})`;
      ctx.beginPath();
      ctx.moveTo(-w * 0.25, 0); ctx.lineTo(-w * 0.08, -h * 0.92); ctx.lineTo(w * 0.08, -h * 0.92); ctx.lineTo(w * 0.25, 0);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = t * 0.8;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, fx.maxR, fx.maxR * 0.5, 0, 0, 7); ctx.stroke();
      ctx.restore();
    } else if(fx.type === 'glow'){
      const r = fx.maxR * (0.4 + 0.6 * (1 - t));
      ctx.save();
      const gg = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, r);
      gg.addColorStop(0, `rgba(255,255,255,${0.75 * t})`);
      gg.addColorStop(0.35, `rgba(${fx.color},${0.5 * t})`);
      gg.addColorStop(1, `rgba(${fx.color},0)`);
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, 7); ctx.fill();
      ctx.restore();
    } else if(fx.type === 'runes'){
      const k = 1 - t;
      const R = fx.maxR * (0.5 + 0.5 * Math.min(1, k * 3));
      ctx.save();
      ctx.translate(fx.x, fx.y + 2);
      ctx.scale(1, 0.58);
      ctx.rotate(state.t * 1.6 + fx.i * 0.7);
      ctx.globalAlpha = t * 0.9;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = 2;
      ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.72, 0, Math.PI * 2); ctx.stroke();
      const segs = 8 + (fx.i % 4) * 2;
      for(let i = 0; i < segs; i++){
        const a1 = i / segs * Math.PI * 2;
        const a2 = a1 + Math.PI / segs;
        ctx.beginPath(); ctx.arc(0, 0, R * 0.86, a1, a2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(a1) * R * 0.86, Math.sin(a1) * R * 0.86);
        ctx.lineTo(Math.cos(a1) * R, Math.sin(a1) * R);
        ctx.stroke();
      }
      for(let i = 0; i < 6; i++){
        const a = -state.t * 2.2 + i / 6 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R * 0.74, Math.sin(a) * R * 0.74);
        ctx.lineTo(Math.cos(a + 0.5) * R * 0.6, Math.sin(a + 0.5) * R * 0.6);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
      if(fx.label){
        ctx.save();
        ctx.globalAlpha = t * 0.85;
        ctx.font = `bold ${Math.round(fx.maxR * 0.5)}px "Songti SC","STSong",serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(${fx.color},1)`;
        ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 18;
        ctx.fillText(fx.label, fx.x, fx.y - 8);
        ctx.restore();
      }
    } else if(fx.type === 'falling'){
      const start = fx.maxLife + 0.05;
      const k = clamp((start - fx.life) / fx.maxLife, 0, 1);
      const dropH = 260;
      const y = fx.y - dropH * (1 - k);
      const trailLen = 60 + 120 * k;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.5 * k;
      ctx.strokeStyle = `rgba(${fx.color},1)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(fx.x, fx.y, (fx.meteor ? 46 : 34) * (0.6 + 0.4 * k),
        (fx.meteor ? 46 : 34) * 0.55 * (0.6 + 0.4 * k), 0, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
      const tg = ctx.createLinearGradient(fx.x, y - trailLen, fx.x, y);
      tg.addColorStop(0, `rgba(${fx.color},0)`);
      tg.addColorStop(1, `rgba(${fx.sub},.95)`);
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(fx.x - (fx.meteor ? 9 : 4), y);
      ctx.lineTo(fx.x, y - trailLen);
      ctx.lineTo(fx.x + (fx.meteor ? 9 : 4), y);
      ctx.closePath(); ctx.fill();
      ctx.shadowColor = `rgba(${fx.color},1)`; ctx.shadowBlur = 16;
      ctx.fillStyle = `rgba(${fx.sub},1)`;
      if(fx.meteor){
        ctx.beginPath(); ctx.arc(fx.x, y, 8, 0, 7); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(fx.x, y + 14); ctx.lineTo(fx.x + 3.5, y - 6); ctx.lineTo(fx.x, y - 18); ctx.lineTo(fx.x - 3.5, y - 6);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    } else if(fx.type === 'ghost'){
      ctx.save();
      ctx.globalAlpha = t * 0.42;
      ctx.translate(fx.x, fx.y);
      ctx.fillStyle = `rgba(${fx.color},1)`;
      ctx.beginPath();
      ctx.moveTo(-10, -2); ctx.lineTo(10, -2); ctx.lineTo(8, -36); ctx.lineTo(-8, -36);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -46, 8, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawDomain(){
  if(state.domain <= 0) return;
  const R = state.domainRadius;
  const c = state.domainColor || '255,220,140';
  const pulse = 0.85 + Math.sin(state.t * 6) * 0.12;
  ctx.save();
  ctx.globalAlpha = 0.18 * pulse;
  const bg = ctx.createRadialGradient(P.x, P.y + 4, 10, P.x, P.y + 4, R);
  bg.addColorStop(0, `rgba(${c}, 0.7)`);
  bg.addColorStop(1, `rgba(${c}, 0)`);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.9 * pulse;
  ctx.strokeStyle = `rgba(${c}, 1)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, R, R * 0.62, 0, 0, 7); ctx.stroke();
  ctx.restore();
}
function drawFloats(){

}

function collectVisibleProps(){
  const cx0 = Math.floor((state.camX - 120) / CELL);
  const cx1 = Math.floor((state.camX + W + 120) / CELL);
  const cy0 = Math.floor((state.camY - 160) / CELL);
  const cy1 = Math.floor((state.camY + H + 120) / CELL);
  const out = [];
  if(!isFinite(cx0) || !isFinite(cx1) || !isFinite(cy0) || !isFinite(cy1)) return out;
  if(cx1 - cx0 > 30 || cy1 - cy0 > 30) return out;
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const c = getChunk(cx, cy);
      for(const p of c.props) out.push(p);
    }
  }
  return out;
}
function collectVisibleLakes(){
  const lx0 = Math.floor((state.camX - 200) / LAKE_CELL);
  const lx1 = Math.floor((state.camX + W + 200) / LAKE_CELL);
  const ly0 = Math.floor((state.camY - 200) / LAKE_CELL);
  const ly1 = Math.floor((state.camY + H + 200) / LAKE_CELL);
  const out = [];
  if(!isFinite(lx0) || !isFinite(lx1) || !isFinite(ly0) || !isFinite(ly1)) return out;
  if(lx1 - lx0 > 20 || ly1 - ly0 > 20) return out;
  for(let ly = ly0; ly <= ly1; ly++){
    for(let lx = lx0; lx <= lx1; lx++){
      const lake = lakeAt(lx, ly);
      if(lake) out.push(lake);
    }
  }
  return out;
}

function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx = 0, sy = 0;
  if(state.shakeT > 0){
    const k = state.shakeT / 0.12;
    sx = (Math.random()-0.5) * state.shakeMag * k * 2;
    sy = (Math.random()-0.5) * state.shakeMag * k * 2;
  }
  const camX = state.camX - sx, camY = state.camY - sy;
  ctx.save();
  ctx.translate(-camX, -camY);
  drawGround();
  for(const site of collectVisibleSites()) drawSiteGround(site);
  const chestSites = collectChestSites();
  for(const site of chestSites) drawSiteGround(site);
  for(const lake of collectVisibleLakes()) drawLake(lake);
  drawHazards();
  for(const h of state.herbs){
    if(!h.alive) continue;
    if(h.x < camX-60 || h.x > camX+W+60 || h.y < camY-60 || h.y > camY+H+60) continue;
    drawHerb(h);
  }
  drawDomain();
  for(const p of particles){
    if(p.type !== 'dot') continue;
    const a = p.life / p.maxLife;
    const sz = p.size * (0.4 + a * 0.7) + p.grow * (1 - a);
    ctx.globalAlpha = a * 0.3;
    ctx.fillStyle = `rgb(${p.color})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 1.8, 0, 7); ctx.fill();
    ctx.globalAlpha = a * 0.95;
    ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.72, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const propsList = collectVisibleProps();
  const list = [];
  for(const p of propsList){
    if(p.x < camX-80 || p.x > camX+W+80 || p.y < camY-160 || p.y > camY+H+80) continue;
    list.push({ y: p.y, kind: 0, ref: p });
  }
  for(const st of collectVisibleSites()){
    for(const b of st.buildings){
      const pad = b.r * 3;
      if(b.x < camX - pad || b.x > camX + W + pad ||
         b.y < camY - pad * 2 || b.y > camY + H + pad) continue;
      list.push({ y: b.y, kind: 3, ref: b });
    }
    for(const sc of st.scenery){
      if(sc.x < camX - 160 || sc.x > camX + W + 160 ||
         sc.y < camY - 320 || sc.y > camY + H + 160) continue;
      list.push({ y: sc.y, kind: 5, ref: sc });
    }
  }
  for(const e of state.enemies){
    if(!isNum(e.x) || !isNum(e.y)) continue;
    const pad = e.elite ? 400 : 120;
    if(e.x < camX-pad || e.x > camX+W+pad || e.y < camY-pad*1.5 || e.y > camY+H+pad) continue;
    list.push({ y: e.y, kind: 1, ref: e });
  }
  for(const st of chestSites){
    const pad = 200;
    if(st.x < camX - pad || st.x > camX + W + pad || st.y < camY - pad * 2 || st.y > camY + H + pad) continue;
    for(const b of st.buildings){
      list.push({ y: b.y, kind: 3, ref: b });
    }
    for(const sc of st.scenery){
      list.push({ y: sc.y, kind: 5, ref: sc });
    }
  }
  list.push({ y: P.y, kind: 2, ref: null });
  list.sort((a,b) => a.y - b.y);
  for(const o of list){
    if(o.kind === 0) drawPropByType(o.ref);
    else if(o.kind === 1) drawEnemy(o.ref);
    else if(o.kind === 3) drawLandmark(o.ref);
    else if(o.kind === 5) drawBigProp(o.ref);
    /* 环绕飞剑阵压在修士身前绘制：剑阵永远清晰可见，不会被人物挡住 */
    else if(o.kind === 2){ drawSwordArray(); drawPlayer(); }
  }
  drawProjectiles();
  drawBeams();
  for(const p of particles){
    if(p.type === 'dot') continue;
    const a = p.life / p.maxLife;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = a;
    if(p.type === 'line'){
      ctx.strokeStyle = `rgba(${p.color},${a})`;
      ctx.lineWidth = p.size * 0.45; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size * 2.2, 0); ctx.lineTo(p.size * 2.2, 0);
      ctx.stroke();
    } else if(p.type === 'spark'){
      ctx.fillStyle = `rgba(${p.color},${a})`;
      const sz = p.size * (0.6 + a * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, -sz); ctx.lineTo(sz*0.5, 0);
      ctx.lineTo(0, sz); ctx.lineTo(-sz*0.5, 0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawEffects();
  drawFloats();
  ctx.restore();
  const bio = BIOMES[state.biome] || BIOMES[0];
  ctx.fillStyle = bio.tint;
  ctx.fillRect(0,0,W,H);
  drawMotes(dt);
  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);
}

function updateBossBar(){
  let boss = null, bd = 1e9;
  for(const e of state.enemies){
    if(e.dead || !e.elite) continue;
    const screenX = e.x - state.camX;
    const screenY = e.y - state.camY;
    if(screenX < -100 || screenX > W + 100 || screenY < -100 || screenY > H + 100) continue;
    const d = Math.hypot(e.x-P.x, e.y-P.y);
    if(d < bd){ bd = d; boss = e; }
  }
  const bar = $('bossBar');
  if(!bar) return;
  if(boss){
    bar.style.display = 'flex';
    const bn = $('bossName'); if(bn) bn.textContent = boss.name;
    const pct = Math.max(0, boss.hp / boss.maxHp);
    const bf = $('bossHpFill'); if(bf) bf.style.width = (pct * 100).toFixed(1) + '%';
    const bt = $('bossHpText');
    if(bt) bt.textContent = fmt(Math.max(0, boss.hp)) + ' / ' + fmt(boss.maxHp);
  } else {
    bar.style.display = 'none';
  }
}

function tryBreak(){
  if(!state.started || isMaxLv()) return;
  const need = qiNeed();
  if(G.qi < need) return;
  G.qi -= need;
  const prevLv = totalLv();
  G.layer++;
  if(G.layer > MAX_LAYER){ G.layer = 1; G.realm++; }
  if(G.realm > MAX_REALM){ G.realm = MAX_REALM; G.layer = MAX_LAYER; }
  recalc(); G.hp = G.maxHp; G.mp = G.maxMp;
  refreshUnlockedSkills();
  /* 这一层刚好凝成的新功法：弹一次告示并自动补进空位 */
  const gained = MILESTONE_SKILLS.filter(sk => sk.unlockLv === totalLv() && sk.unlockLv !== prevLv);
  toast('突破 · ' + realmText());
  if(gained.length){
    const first = gained[0];
    grantMilestoneSkills();
    setTimeout(()=>{
      if(!state.started) return;
      showManualToast(first, '境 界 馈 赠');
      addFloat(P.x, P.y - 80, '悟得 · ' + first.name, '#ffd870', true);
    }, 700);
  }
  renderHUD(); save();
  if(isLayerReq(prevLv) || BIOMES.some((b, k) => k > 0 && !G.seenBiomes.has(k) && totalLv() >= b.realmReq)) checkBiomeUnlocks();
}

/* 境界领悟（御剑术、离火、回春、万剑阵、雷霆、冰封、太虚域）：
   修为一到即自动领悟，并补进技能栏空位；宝箱与妖王都不涉及这些功法 */
function grantMilestoneSkills(){
  let gained = 0;
  for(const sk of MILESTONE_SKILLS){
    if(totalLv() >= sk.unlockLv && !G.unlockedSkills.has(sk.id)){ G.unlockedSkills.add(sk.id); gained++; }
  }
  if(gained){
    autoEquipElsewhere();
    updateSkillUI();
    renderHUD();
  }
  return gained;
}

function save(){
  try{
    localStorage.setItem('xiantu16', JSON.stringify({
      ver: 22,
      realm:G.realm, layer:G.layer, qi:G.qi, stones:G.stones,
      biome:state.biome,
      seenBiomes: Array.from(G.seenBiomes),
      chests: Array.from(G.chests),
      equipped: G.equipped,
      unlockedSkills: Array.from(G.unlockedSkills),
      weapons: Array.from(G.weapons),
      currentWeapon: G.currentWeapon,
      px: P.x, py: P.y
    }));
  }catch(e){}
}
function load(){
  loadedPos = null;
  try{
    const d = JSON.parse(localStorage.getItem('xiantu16') || 'null');
    const _ver = d ? (d.ver | 0) : 0;
    if(d){
      G.realm = d.realm|0;
      G.layer = d.layer|0 || 1;
      G.qi    = d.qi|0;
      G.stones= d.stones|0;
      if(typeof d.biome === 'number' && d.biome >= 0 && d.biome < BIOMES.length){
        if(totalLv() >= BIOMES[d.biome].realmReq) state.biome = d.biome;
      }
      if(Array.isArray(d.seenBiomes)){
        const saved = d.seenBiomes.filter(n => typeof n === 'number' && n >= 0 && n < BIOMES.length);
        /* 旧版存档：按旧的大境界规则重算，命中者视为已见，其余交由新区告示提示 */
        G.seenBiomes = _ver < 19 ? new Set(saved.concat(Array.from(legacySeenBiomes(G.realm))))
                                    : new Set(saved);
      }
      for(let i = 0; i < BIOMES.length; i++) if(totalLv() >= BIOMES[i].realmReq) G.seenBiomes.add(i);
      G.seenBiomes.add(0);
      if(Array.isArray(d.equipped) && d.equipped.length === 8) G.equipped = d.equipped;
      /* 除「剑气斩」外的功法只能来自妖王或秘境宝箱：
         存档里未持有「剑气斩」的，按旧版规则只补偿到开箱机制上线（v21）之前已悟的那些；
         持有了剑气斩的存档一律以存档为准，不再自动塞进任何功法 */
      G.unlockedSkills.add(0);
      if(!d.unlockedSkills) refreshUnlockedSkills();
      if(Array.isArray(d.chests)) G.chests = new Set(d.chests.filter(n => typeof n === 'string'));
  /* 已开启过含「境界功法」的旧宝箱：这些功法不归宝箱发放，记录自然失效即可 */
      /* 只补齐空缺：已装备的保持不变，空位用已悟功法快速补上 */
      autoEquipElsewhere();
      if(Array.isArray(d.weapons)){ G.weapons = new Set(d.weapons); G.weapons.add(0); }
      if(typeof d.currentWeapon === 'number' && G.weapons.has(d.currentWeapon)){
        G.currentWeapon = d.currentWeapon;
      }
      if(isNum(d.px) && isNum(d.py)) loadedPos = { x: d.px, y: d.py };
    }
  }catch(e){}
}

let lastT = performance.now();
let cleanTimer = 0;
let errorShown = false;
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  try {
    if(state.started){
      if(W < 10 || H < 10) resize();
      state.t += dt;
      if(state.grace > 0) state.grace = Math.max(0, state.grace - dt);
      if(playerInvuln > 0) playerInvuln = Math.max(0, playerInvuln - dt);
      if(!isMaxLv()){
        G.qi += cultSpeed() * dt;
        if(G.qi >= qiNeed()) tryBreak();
      }
      /* 兜底：读档或加速晋升越过层数时，境界功法也能补领悟 */
      if(grantMilestoneSkills() > 0) save();
      for(const id of ALL_SKILL_IDS){
        if(G.cd[id] > 0) G.cd[id] = Math.max(0, G.cd[id] - dt);
      }
      G.mp = Math.min(G.maxMp, G.mp + G.maxMp * 0.08 * dt);
      G.hp = Math.min(G.maxHp, G.hp + G.maxHp * 0.005 * dt);
      updatePlayer(dt);
      for(let i = state.enemies.length - 1; i >= 0; i--){
        const e = state.enemies[i];
        updateEnemy(e, dt);
        if(e.dead && e.deadTimer <= 0) state.enemies.splice(i, 1);
      }
      updateSwordArray(dt);
      updateProjectiles(dt);
      updateDomain(dt);
      updateCamera(dt);
      updateInteract();
      updateEffects(dt);
      updateParticles(dt);
      updateHazards(dt);
      maintainEnemies();
      maintainHerbs();
      updateSkillUI();
      updateBossBar();
      cleanTimer += dt;
      if(cleanTimer > 8){ cleanTimer = 0; cleanChunks(); }
      hudAcc += dt;
      if(hudAcc > 0.12){ hudAcc = 0; renderHUD(); }
      render(dt);
    }
  } catch(err){
    if(!errorShown){ errorShown = true; console.error('[仙途] 运行错误]', err); }
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    if(!isNum(P.x) || !isNum(P.y)){ P.x = origin.x; P.y = origin.y; }
    if(!isNum(state.camX) || !isNum(state.camY)){ state.camX = P.x - W/2; state.camY = P.y - H/2; }
    if(!isNum(G.hp) || G.hp <= 0) G.hp = 1;
    if(!isNum(G.mp) || G.mp < 0) G.mp = 0;
  }
  requestAnimationFrame(loop);
}

let saveTimer = 0;
function initGame(autostart){
  load();
  recalc();
  refreshUnlockedSkills();
  checkBiomeUnlocks();
  G.hp = G.maxHp;
  G.mp = G.maxMp;
  G.cd = {};
  for(const id of ALL_SKILL_IDS) G.cd[id] = 0;
  G.atkCd = 0;
  if(W < 10 || H < 10) resize();
  const startBi = state.biome >= 0 && state.biome < BIOMES.length ? state.biome : 0;
  const origin = BIOME_ORIGIN[startBi];
  if(loadedPos){ P.x = loadedPos.x; P.y = loadedPos.y; loadedPos = null; }
  else { P.x = origin.x; P.y = origin.y; }
  P.swing = 0; P.flying = 0; P.escaping = 0;
  P.dir = 0; P.moving = false; P.anim = 0;
  P.escapeHit = new Set();
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  state.started = (autostart === true);
  state.grace = 3;
  state.t = 0;
  state.nextSpawnT = 0;
  state.nextHerbT = 0;
  state.nextBossT = 15;
  state.swordCd = 0;
  state.domain = 0;
  state.biome = startBi;
  state.shakeT = 0;
  state.shield = 0; state.shieldTime = 0;
  state.enemies.length = 0;
  state.herbs.length = 0;
  particles.length = 0;
  effects.length = 0;
  floats.length = 0;
  projectiles.length = 0;
  beams.length = 0;
  chunks.clear(); lakeCache.clear();
  hazards.length = 0;
  state.vortex = null;
  setupLandmarks();
  for(let i = 0; i < 5; i++) spawnHerb();
  buildSkillBar();
  updateSkillUI();
  renderHUD();
  lastT = performance.now();
  errorShown = false;
  toast('拖动屏幕 / WASD 移动');
  setTimeout(()=> toast('建筑群落散落四方 · 奇遇各处不同'), 2600);
  setTimeout(()=> toast('妖王会施展专属神通，注意地面预警'), 5200);
  setTimeout(()=> toast('越深处妖气越盛 · 突破境界可开启新境'), 7600);
  if(!saveTimer) saveTimer = setInterval(save, 5000);
}
const startBtn = $('startBtn');
if(startBtn) startBtn.addEventListener('click', ()=>{
  if(state.started) return;
  if(paused){ resumeGame(); return; }
  let fresh = false;
  try{ fresh = localStorage.getItem('xiantu17_new') === '1'; localStorage.removeItem('xiantu17_new'); }catch(e){}
  const ss = $('startScreen');
  if(ss) ss.style.display = 'none';
  setTimeout(()=>{
    resize();
    if(fresh) resetProgress();
    initGame(true);
    if(fresh){ setupLandmarks(); refreshUnlockedSkills(); renderHUD(); toast('仙途重启 · 一切从头'); }
  }, 30);
});

(function(){
  const q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  resize();
  /* 带 #menu=0 时直接进入游戏（调试用），否则在开始界面等待点击 */
  const skipMenu = q.get('menu') === '0';
  initGame(skipMenu);
  const ss = $('startScreen');
  if(ss) ss.style.display = skipMenu ? 'none' : 'flex';
  if(q.get('edit') === '1') maintainEnemies = function(){};
  const bi = parseInt(q.get('bi') || '0', 10) || 0;
  if(bi !== 0){
    state.biome = bi;
    setupLandmarks();
    chunks.clear(); lakeCache.clear();
  }
  let hx = parseFloat(q.get('x') || '0');
  let hy = parseFloat(q.get('y') || '0');
  if(hx || hy){
    P.x = BIOME_ORIGIN[bi].x + hx;
    P.y = BIOME_ORIGIN[bi].y + hy;
    state.camX = P.x - W / 2;
    state.camY = P.y - H / 2;
  }
  if(q.get('ui') === '0'){
    for(const id of ['hud', 'topButtons', 'skillBar', 'attackBtn', 'herbBtn', 'toast', 'bossBar']){
      const el = $(id); if(el) el.style.display = 'none';
    }
  }
  if(q.get('haz') === '1'){
    addHazard(P.x - 140, P.y - 40, 78, 9, 1, '255,120,60');
    addHazard(P.x + 60, P.y - 150, 66, 9, 1, '255,120,60');
    addHazard(P.x + 150, P.y + 30, 84, 9, 1, '255,120,60');
  }
  if(q.get('menu') === '1'){ const ms = $('startScreen'); if(ms) ms.style.display = 'flex'; }
})();

requestAnimationFrame(loop);
</script>
