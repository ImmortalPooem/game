<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>仙途 · 问道 v18.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0e1a16;
  font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  color:#e2d6b8;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#startScreen{position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 28%, #2a4a5a 0%, #14202e 55%, #0a1018 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#startScreen h1{font-size:36px;font-weight:400;letter-spacing:.45em;text-indent:.45em;
  color:#e8c878;text-shadow:0 0 34px rgba(232,200,120,.6)}
#startScreen .ver{font-size:12px;letter-spacing:.3em;color:rgba(232,200,120,.55);margin-top:-8px}
#startBtn{font-family:inherit;font-size:18px;letter-spacing:.3em;text-indent:.3em;
  padding:14px 50px;margin-top:8px;
  background:rgba(232,200,120,.12);border:1px solid rgba(232,200,120,.55);
  color:#f4e8cc;border-radius:4px;cursor:pointer;transition:.25s}
#startBtn:hover,#startBtn:active{background:rgba(232,200,120,.32);
  box-shadow:0 0 34px rgba(232,200,120,.5)}
#startScreen .hint{font-size:12px;line-height:2;text-align:center;letter-spacing:.05em;
  color:rgba(220,210,190,.55);padding:0 20px;margin-top:10px}
#leftZone{position:fixed;inset:0;z-index:20;touch-action:none}
#joyBase{position:fixed;width:112px;height:112px;border-radius:50%;
  border:1px solid rgba(200,164,92,.4);background:rgba(200,164,92,.07);
  display:none;z-index:25;pointer-events:none;
  box-shadow:inset 0 0 30px rgba(200,164,92,.15)}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(235,205,145,.95),rgba(160,120,60,.75));
  box-shadow:0 0 20px rgba(200,164,92,.55)}
#attackBtn{position:fixed;right:18px;bottom:34px;z-index:32;
  width:92px;height:92px;border-radius:50%;
  font-family:inherit;font-size:16px;letter-spacing:.12em;color:#ffe9b8;
  cursor:pointer;transition:.1s;
  background:radial-gradient(circle at 35% 30%,rgba(200,90,50,.95),rgba(100,35,20,.95));
  border:2px solid rgba(255,160,100,.6);
  box-shadow:0 0 26px rgba(255,90,60,.4)}
#attackBtn:active{transform:scale(.92)}
#skillBar{position:fixed;right:118px;bottom:34px;z-index:32;
  display:grid;grid-template-columns:repeat(4,50px);grid-template-rows:repeat(2,50px);gap:6px}
.skillBtn{position:relative;overflow:hidden;width:50px;height:50px;border-radius:50%;
  font-family:inherit;cursor:pointer;transition:.15s;
  background:radial-gradient(circle at 35% 30%,rgba(50,80,100,.95),rgba(18,30,45,.95));
  border:1px solid rgba(200,164,92,.4);
  box-shadow:0 0 14px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#e2d6b8}
.skillBtn:active{transform:scale(.9)}
.skillBtn .skName{font-size:15px;letter-spacing:0;z-index:2;line-height:1}
.skillBtn .skMp{font-size:8px;opacity:.62;margin-top:2px;z-index:2}
.skillBtn.cooling{opacity:.55}
.skillBtn.noMp{border-color:rgba(120,120,120,.3)}
.skillBtn.noMp .skName{opacity:.4}
.skillBtn.empty{background:radial-gradient(circle at 35% 30%,rgba(28,30,36,.9),rgba(12,13,18,.9));
  border-color:rgba(80,80,80,.25);opacity:.5}
.skillBtn.empty .skName{opacity:.3;font-size:12px}
.cdMask{position:absolute;left:0;right:0;bottom:0;height:0%;
  background:rgba(0,0,0,.72);pointer-events:none;transition:height .08s linear}
@media(max-width:390px){
  #skillBar{grid-template-columns:repeat(4,44px);grid-template-rows:repeat(2,44px);right:106px;gap:5px}
  .skillBtn{width:44px;height:44px}
  .skillBtn .skName{font-size:13px}
  #attackBtn{width:82px;height:82px;font-size:15px;right:14px;bottom:30px}
}
#herbBtn{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:33;
  padding:12px 32px;font-family:inherit;font-size:15px;letter-spacing:.2em;
  color:#b8ffe0;cursor:pointer;border-radius:4px;
  background:rgba(20,60,45,.92);border:1px solid rgba(120,255,190,.65);
  box-shadow:0 0 24px rgba(120,255,190,.5);
  animation:herbPulse 1.6s infinite}
@keyframes herbPulse{0%,100%{opacity:1}50%{opacity:.72}}
#topButtons{position:fixed;right:18px;top:14px;z-index:31;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 36px)}
.topBtn{padding:8px 16px;font-family:inherit;font-size:12px;
  letter-spacing:.15em;color:#e8c878;cursor:pointer;
  background:rgba(15,22,30,.88);border:1px solid rgba(200,164,92,.4);
  border-radius:4px;transition:.2s;box-shadow:0 0 14px rgba(0,0,0,.5)}
.topBtn:hover,.topBtn:active{background:rgba(200,164,92,.22)}
.topBtn.advance{color:#ffe070;border-color:rgba(255,220,120,.55);
  background:rgba(50,40,10,.88);box-shadow:0 0 18px rgba(255,200,60,.3)}
.topBtn.sys{font-size:11px;letter-spacing:.06em;padding:7px 10px;
  color:#a8c8d8;border-color:rgba(140,180,200,.35)}
@media(max-width:520px){
  #topButtons{right:10px;top:10px;gap:4px;max-width:calc(100vw - 20px)}
  .topBtn{padding:6px 8px;font-size:10px;letter-spacing:.04em}
  .topBtn.sys{font-size:9px;padding:5px 6px;letter-spacing:0}
}
#hud{position:fixed;left:12px;top:58px;z-index:30;width:190px;
  background:rgba(15,22,30,.78);border:1px solid rgba(200,164,92,.28);
  border-radius:5px;padding:10px 12px;backdrop-filter:blur(6px);pointer-events:none}
#realmName{font-size:13px;color:#d8b878;letter-spacing:.12em;
  padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid rgba(200,164,92,.22)}
.bar{height:7px;background:rgba(255,255,255,.09);border-radius:4px;
  overflow:hidden;margin-top:7px}
.bar>div{height:100%;width:0;transition:width .15s}
#hpFill{background:linear-gradient(90deg,#9a3b38,#e8705a)}
#mpFill{background:linear-gradient(90deg,#3b4f8a,#7f9fe6)}
#qiFill{background:linear-gradient(90deg,#3c8a7c,#89e2ce)}
.lbl{font-size:10px;opacity:.65;margin-top:4px;letter-spacing:.06em}
#stoneLine{font-size:10px;opacity:.6;margin-top:6px;letter-spacing:.06em}
#weaponLine{font-size:10px;color:#89c8e2;margin-top:3px;letter-spacing:.06em}
#swordLine{font-size:10px;opacity:.6;margin-top:3px;letter-spacing:.06em;color:#89c8e2}
#biomeLine{font-size:10px;opacity:.75;margin-top:3px;letter-spacing:.06em;color:#e8c878}
#shieldLine{font-size:10px;color:#ffe070;margin-top:3px;letter-spacing:.06em;display:none}
.ver-tag{font-size:9px;opacity:.4;margin-top:7px;text-align:right;letter-spacing:.15em}
#bossBar{position:fixed;left:0;top:0;width:100%;z-index:34;
  padding:8px 16px 12px;
  background:linear-gradient(180deg,rgba(28,6,14,.92) 0%,rgba(28,6,14,.55) 62%,transparent 100%);
  pointer-events:none;display:none;flex-direction:column;align-items:center;gap:5px}
#bossName{font-size:14px;letter-spacing:.32em;text-indent:.32em;color:#ffb8c8;
  text-shadow:0 0 14px rgba(255,50,90,.85)}
#bossHpTrack{position:relative;width:min(560px,86vw);height:15px;border-radius:8px;
  background:rgba(0,0,0,.65);border:1px solid rgba(255,120,140,.55);overflow:hidden}
#bossHpFill{height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,#7a0a1a,#e02040 55%,#ff7a6a);
  transition:width .16s}
#bossHpSegs{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1.5px),
    rgba(0,0,0,.65) calc(10% - 1.5px),rgba(0,0,0,.65) 10%)}
#bossHpText{font-size:10px;letter-spacing:.12em;color:rgba(255,190,200,.8)}
#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:40;
  padding:9px 20px;font-size:14px;letter-spacing:.1em;white-space:nowrap;
  background:rgba(20,28,36,.94);border:1px solid rgba(200,164,92,.35);
  border-radius:3px;opacity:0;transition:opacity .4s;pointer-events:none}
#hurtOverlay{position:fixed;inset:0;pointer-events:none;z-index:15;
  background:radial-gradient(ellipse at center, transparent 42%, rgba(220,40,25,.6) 100%);
  opacity:0;transition:opacity .15s}
#flashOverlay{position:fixed;inset:0;pointer-events:none;z-index:16;opacity:0;background:#fff}
#biomeBanner{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:38;
  font-size:24px;letter-spacing:.5em;text-indent:.5em;color:#e8c878;
  text-shadow:0 0 30px rgba(200,164,92,.9);
  opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#mapOverlay,#skillBookOverlay,#bagOverlay{position:fixed;inset:0;z-index:60;
  background:rgba(4,8,16,.9);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:14px}
.mapPanel,.skillBookPanel,.bagPanel{width:min(760px,100%);max-height:90vh;
  background:rgba(12,18,28,.97);
  border:1px solid rgba(200,164,92,.38);border-radius:8px;
  padding:18px;display:flex;flex-direction:column}
.mapPanel h2,.skillBookPanel h2,.bagPanel h2{font-size:20px;font-weight:400;letter-spacing:.4em;text-indent:.4em;
  color:#e8c878;text-align:center;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid rgba(200,164,92,.22)}
#mapGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  overflow-y:auto;padding:4px;flex:1;max-height:60vh}
@media(min-width:620px){#mapGrid{grid-template-columns:repeat(3,1fr)}}
.mapCard{padding:12px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);
  transition:.2s;text-align:left;display:flex;flex-direction:column;gap:4px}
.mapCard:hover:not(.locked){background:rgba(40,58,80,.9);
  border-color:rgba(200,164,92,.62)}
.mapCard.locked{opacity:.42;cursor:not-allowed}
.mapCard.current{border-color:#ffd870;
  box-shadow:0 0 22px rgba(255,216,112,.55);
  background:rgba(50,42,20,.85)}
.mapCard .mcHeader{display:flex;align-items:center;gap:8px}
.mapCard .mcEmoji{font-size:24px;line-height:1}
.mapCard .mcName{font-size:15px;color:#e8c878;letter-spacing:.08em}
.mapCard .mcReq{font-size:11px;color:rgba(220,210,190,.6)}
.mapCard .mcDesc{font-size:11px;color:rgba(200,190,170,.55);line-height:1.55}
.mapCard .mcLock{font-size:10px;color:#d9604a;margin-top:2px}
#mapCloseBtn,#skillBookCloseBtn,#bagCloseBtn{margin-top:14px;align-self:center;
  padding:10px 40px;font-family:inherit;font-size:14px;
  letter-spacing:.2em;text-indent:.2em;
  background:rgba(200,164,92,.1);
  border:1px solid rgba(200,164,92,.42);
  color:#e8dcc0;border-radius:4px;cursor:pointer;transition:.2s}
#skillBookSlots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:14px;padding:4px}
.skSlotBtn{aspect-ratio:1;border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(50,80,100,.95),rgba(18,30,45,.95));
  border:1px solid rgba(200,164,92,.35);
  color:#e2d6b8;transition:.15s;font-family:inherit;position:relative}
.skSlotBtn.selected{border-color:#ffd870;
  box-shadow:0 0 20px rgba(255,216,112,.6);
  background:radial-gradient(circle at 35% 30%,rgba(80,70,40,.95),rgba(40,30,15,.95))}
.skSlotBtn .slotKey{font-size:22px;line-height:1}
.skSlotBtn .slotName{font-size:9px;opacity:.65;margin-top:3px}
.skSlotBtn .slotNum{position:absolute;top:2px;left:6px;font-size:9px;opacity:.4}
#skillBookLibrary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;overflow-y:auto;max-height:44vh;padding:4px}
.skCard{padding:8px;border-radius:6px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);transition:.15s;
  display:flex;flex-direction:column;gap:3px}
.skCard.equipped{border-color:rgba(120,255,190,.55);
  background:rgba(20,50,40,.85)}
.skCard.locked{opacity:.35;cursor:not-allowed;filter:grayscale(0.7)}
.skCard .cardTop{display:flex;align-items:center;gap:6px}
.skCard .cardKey{width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(50,80,100,.7);border:1px solid rgba(200,164,92,.35);
  font-size:12px}
.skCard .cardName{font-size:12px;color:#e8c878}
.skCard .cardStats{font-size:10px;color:rgba(200,190,170,.6)}
.skCard .cardTag{font-size:9px;color:#89e2ce;margin-top:1px}
.skCard .cardLock{font-size:9px;color:#d9604a}
#bagGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;overflow-y:auto;max-height:60vh;padding:4px}
.bagWeapon{padding:12px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(200,164,92,.25);
  background:rgba(20,30,42,.85);
  transition:.18s;display:flex;flex-direction:column;gap:4px;position:relative}
.bagWeapon.equipped{border-color:#ffd870;
  box-shadow:0 0 22px rgba(255,216,112,.55);
  background:rgba(50,42,20,.85)}
.bagWeapon.locked{opacity:.35;cursor:not-allowed;filter:grayscale(0.7)}
.bagWeapon .wname{font-size:14px;color:#e8c878}
.bagWeapon .wattr{font-size:10px;color:rgba(200,190,170,.55);margin-left:6px;letter-spacing:.1em}
.bagWeapon .wprevWrap{position:relative;width:100%;height:130px;border-radius:6px;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,rgba(20,30,44,.9),rgba(8,12,20,.2))}
.bagWeapon .wprev{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.bagWeapon .wbonus{font-size:11px;color:#89e2ce}
.bagWeapon .weffect{font-size:10px;color:rgba(200,190,170,.6);margin-top:2px}
.bagWeapon .wtag{font-size:10px;color:rgba(200,190,170,.5)}
.bagWeapon .wdot{position:absolute;top:10px;right:10px;width:14px;height:14px;border-radius:50%;
  box-shadow:0 0 12px currentColor}
.bagHint{font-size:11px;color:rgba(200,190,170,.55);text-align:center;margin-top:8px}
/* ===== v18：区域开放提示 ===== */
#unlockNote{position:fixed;left:50%;top:11%;transform:translateX(-50%) translateY(-14px);z-index:39;
  min-width:280px;max-width:min(560px,92vw);padding:14px 28px 16px;text-align:center;
  background:linear-gradient(180deg,rgba(34,28,10,.96),rgba(14,18,26,.96));
  border:1px solid rgba(255,216,112,.7);border-radius:6px;pointer-events:none;
  box-shadow:0 0 46px rgba(255,200,80,.5),inset 0 0 34px rgba(255,216,112,.12);
  opacity:0;transition:opacity .55s ease,transform .55s ease}
#unlockNote.show{opacity:1;transform:translateX(-50%) translateY(0)}
#unlockNote .unTag{font-size:11px;letter-spacing:.5em;text-indent:.5em;color:#ffd870;opacity:.85}
#unlockNote .unName{font-size:26px;letter-spacing:.34em;text-indent:.34em;color:#fff0c0;margin:5px 0 4px;
  text-shadow:0 0 24px rgba(255,200,90,.95)}
#unlockNote .unSub{font-size:12px;letter-spacing:.1em;color:rgba(230,220,195,.82);line-height:1.85}
#unlockNote .unDiff{margin-top:7px;font-size:12px;letter-spacing:.08em;color:#ffb060}
#biomeBanner{transition:opacity .8s}
#biomeLine{color:#ffcf70}
#weaponLine{color:#8fe3ff}
#mapGrid .mapCard .mcReq b{font-weight:400}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="hurtOverlay"></div>
<div id="flashOverlay"></div>
<div id="biomeBanner"></div>
<div id="unlockNote"><div class="unTag">新 区 开 启</div><div class="unName"></div><div class="unSub"></div><div class="unDiff"></div></div>
<div id="leftZone"></div>
<div id="joyBase"><div id="joyKnob"></div></div>

<div id="bossBar">
  <div id="bossName"></div>
  <div id="bossHpTrack"><div id="bossHpFill"></div><div id="bossHpSegs"></div></div>
  <div id="bossHpText"></div>
</div>

<div id="hud">
  <div id="realmName">炼气期·一层</div>
  <div class="bar"><div id="hpFill"></div></div>
  <div class="lbl" id="hpLbl">气血 100 / 100</div>
  <div class="bar"><div id="mpFill"></div></div>
  <div class="lbl" id="mpLbl">灵力 50 / 50</div>
  <div class="bar"><div id="qiFill"></div></div>
  <div class="lbl" id="qiLbl">修为 0 / 40</div>
  <div id="stoneLine">灵石 0</div>
  <div id="weaponLine">「凡铁青锋」</div>
  <div id="swordLine">剑阵 · 未悟</div>
  <div id="biomeLine">青云竹林 · 难度 1</div>
  <div id="shieldLine">护盾 0</div>
  <div class="ver-tag">v18.0</div>
</div>

<div id="topButtons">
  <button class="topBtn sys" id="menuBtn">返回主界面</button>
  <button class="topBtn sys" id="saveBtn">存 档</button>
  <button class="topBtn sys" id="loadBtn">读 档</button>
  <button class="topBtn sys" id="restartBtn">重新开始</button>
  <button class="topBtn" id="mapBtn">地 图</button>
  <button class="topBtn" id="bagBtn">背 包</button>
  <button class="topBtn" id="skillBookBtn">功 法</button>
  <button class="topBtn advance" id="advanceBtn">晋 升</button>
</div>

<div id="skillBar"></div>
<button id="attackBtn">攻 击</button>
<button id="herbBtn" style="display:none">采 药</button>

<div id="toast"></div>

<div id="mapOverlay">
  <div class="mapPanel">
    <h2>寰 宇 地 图</h2>
    <div id="mapGrid"></div>
    <button id="mapCloseBtn">关 闭</button>
  </div>
</div>

<div id="skillBookOverlay">
  <div class="skillBookPanel">
    <h2>功 法 阁</h2>
    <div id="skillBookSlots"></div>
    <div id="skillBookLibrary"></div>
    <button id="skillBookCloseBtn">关 闭</button>
  </div>
</div>

<div id="bagOverlay">
  <div class="bagPanel">
    <h2>兵 器 囊</h2>
    <div id="bagGrid"></div>
    <div class="bagHint">点击武器装备 · 妖王掉落专属武器</div>
    <button id="bagCloseBtn">关 闭</button>
  </div>
</div>

<div id="startScreen">
  <h1>仙 途 · 问 道</h1>
  <p class="ver">VERSION 18.0</p>
  <button id="startBtn">踏 入 仙 途</button>
  <p class="hint">
    拖动屏幕 / WASD 移动　·　空格或 J 平A<br>
    1 ~ 8 释放技能　·　「遁光」化光球冲刺撞击<br>
    十方胜境 · 妖王各怀神通 · 越往深处越凶<br>
    境界精进将开启新境 · 留意「新境开启」告示  </p>
</div>

<script>
/* ============ Polyfill ============ */
(function(){
  const CR = window.CanvasRenderingContext2D;
  if(!CR) return;
  if(!CR.prototype.ellipse){
    CR.prototype.ellipse = function(x, y, rx, ry, rot, a1, a2, ccw){
      this.save(); this.translate(x, y); this.rotate(rot || 0);
      this.scale(rx, ry || rx); this.arc(0, 0, 1, a1, a2, ccw); this.restore();
    };
  }
  if(!CR.prototype.setLineDash){
    CR.prototype.setLineDash = function(){};
    CR.prototype.getLineDash = function(){ return []; };
  }
})();
if(!Math.imul){
  Math.imul = function(a, b){
    const ah = (a >>> 16) & 0xffff, al = a & 0xffff;
    const bh = (b >>> 16) & 0xffff, bl = b & 0xffff;
    return ((al * bl) + (((ah * bl + al * bh) << 16) >>> 0) | 0);
  };
}

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const rnd = (a,b) => a + Math.random()*(b-a);
const isNum = n => typeof n === 'number' && isFinite(n);
const fmt = n => {
  n = Math.floor(n);
  if(n < 10000) return String(n);
  if(n < 1e8) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
  if(n < 1e12) return (n/1e8).toFixed(2).replace(/\.00$/,'') + '亿';
  return (n/1e12).toFixed(2) + '兆';
};

  DPR = Math.min(2, window.devicePixelRatio || 1);

  H = window.innerHeight || 600;
  if(W < 1) W = 800; if(H < 1) H = 600;

  vignette = ctx.createRadialGradient(W/2,H/2,Math.max(1,rInner),W/2,H/2,Math.max(1,rOuter));
  vignette.addColorStop(0,'rgba(0,0,0,0)');

}

const CELL = 260;
const LAKE_CELL = 1000;
const chunks = new Map();
const lakeCache = new Map();
function getChunk(cx, cy){
  const k = cx + ',' + cy;
  let c = chunks.get(k);
  if(c) return c;
  c = genChunk(cx, cy);
  chunks.set(k, c);
  return c;
}
function genChunk(cx, cy){
  const bio = BIOMES[state.biome] || BIOMES[0];
  const biomeSeed = state.biome * 7919;
  const r = mulberry32(hashInt(cx + biomeSeed, cy + state.biome * 3571));
  const props = [];
  const wx = cx*CELL + CELL/2, wy = cy*CELL + CELL/2;
  let distOrigin = Math.hypot(wx - BIOME_ORIGIN[state.biome].x, wy - BIOME_ORIGIN[state.biome].y);
  if(distOrigin > 300){
    const rn = r();
    let n = 0;
    if(rn > 0.45) n = (r() < 0.65) ? 1 : 2;
    for(let i=0;i<n;i++){
      const t = bio.propTypes[Math.floor(r() * bio.propTypes.length)];
      let rad = 17;
      if(t === 'bamboo') rad = 15;
      else if(t === 'pine' || t === 'snowpine' || t === 'deadtree' || t === 'goldtree' || t === 'bigtree' || t === 'cactus') rad = 19;
      else if(t === 'obsidian' || t === 'goldpillar' || t === 'meteor') rad = 21;
      else if(t === 'icecrystal' || t === 'coral' || t === 'thorn') rad = 15;
      else if(t === 'cloud' || t === 'voidcloud' || t === 'mushroom') rad = 11;
      else if(t === 'bone' || t === 'shell' || t === 'skull') rad = 8;
      else if(t === 'grave' || t === 'dune' || t === 'darkcrystal') rad = 16;
      else if(t === 'ashrock' || t === 'starstone') rad = 12;
      else if(t === 'vine' || t === 'seaweed' || t === 'starflower') rad = 9;
      props.push({ x: cx*CELL + r()*CELL, y: cy*CELL + r()*CELL, type: t, r: rad, seed: r()*100 });
    }
  }
  return { props: props.filter(p => !siteBlocks(p.x, p.y)) };
}
function lakeAt(cx, cy){
  const k = cx + ',' + cy;
  if(lakeCache.has(k)) return lakeCache.get(k);
  const biomeSeed = state.biome * 9973;
  const r = mulberry32(hashInt(cx*7+13 + biomeSeed, cy*11+7 + state.biome * 4211));
  let lake = null;
  if(r() > 0.72){
    const lx = cx*LAKE_CELL + LAKE_CELL*(0.3 + r()*0.4);
    const ly = cy*LAKE_CELL + LAKE_CELL*(0.3 + r()*0.4);
    const origin = BIOME_ORIGIN[state.biome];
    if(Math.hypot(lx - origin.x, ly - origin.y) > 500){
      lake = { x: lx, y: ly, rx: 100 + r()*130, ry: 80 + r()*100,
        type: (BIOMES[state.biome] || BIOMES[0]).lakeType };
    }
  }
  lakeCache.set(k, lake);
  return lake;
}
function cleanChunks(){
  const px = Math.floor(P.x / CELL);
  const py = Math.floor(P.y / CELL);
  for(const k of chunks.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-px) > 15 || Math.abs(+p[1]-py) > 15) chunks.delete(k);
  }
  const lx = Math.floor(P.x / LAKE_CELL);
  const ly = Math.floor(P.y / LAKE_CELL);
  for(const k of lakeCache.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-lx) > 8 || Math.abs(+p[1]-ly) > 8) lakeCache.delete(k);
  }
  const ssx = Math.floor(P.x / SITE_CELL);
  const ssy = Math.floor(P.y / SITE_CELL);
  for(const k of siteCache.keys()){
    const p = k.split(',');
    if(Math.abs(+p[0]-ssx) > 9 || Math.abs(+p[1]-ssy) > 9) siteCache.delete(k);
  }
}

function addHazard(x, y, r, t, dmg, color){
  if(!isNum(x) || !isNum(y)) return;
  const delay = Math.max(0.25, t || 0.5);
  hazards.push({ x: x, y: y, r: Math.max(26, r || 40),
    t: delay, delay: delay, dmg: dmg || 1, color: color || '255,120,120' });
}

function castBossSkill(e){

  e.skillIdx = (e.skillIdx || 0) + 1;
  const enraged = e.enraged || e.hp < e.maxHp * 0.5;
  e.skillCd = sk.cd * (enraged ? 0.62 : 1) * rnd(0.9, 1.12);
  const dmg = e.atk * sk.dmg * (enraged ? 1.25 : 1);

  addFloat(e.x, e.y - 200, '【' + sk.name + '】', '#ffb060', true);

  effects.push({ type:'ring', x:e.x, y:e.y, maxR:150, color:'255,140,120', life:0.5, maxLife:0.5 });
  shake(8, 0.28);

  switch(sk.pattern){
    case 'line': {
      for(let i = 0; i < sk.n; i++){
        addHazard(e.x + Math.cos(ang) * (130 + i * 92),
          e.y + Math.sin(ang) * (130 + i * 92) * 0.92,
          sk.radius, sk.delay + i * 0.11, dmg, sk.color);
      }
      break;
    }
    case 'burst': {
      addHazard(px, py, sk.radius * 1.15, sk.delay, dmg, sk.color);
      for(let i = 1; i < sk.n; i++){
        const a = rnd(0, Math.PI * 2), rr = rnd(60, 150);

      for(let i = 0; i < sk.n; i++){
        const a = rnd(0, Math.PI * 2), rr = rnd(40, 340);
        addHazard(px + Math.cos(a) * rr, py + Math.sin(a) * rr * 0.8,
          sk.radius, sk.delay + rnd(0, 1.2), dmg, sk.color);
      }
      break;
    }
    case 'ring': {
      for(let i = 0; i < sk.n; i++){
        const a = i / sk.n * Math.PI * 2 + rnd(-0.08, 0.08);

      for(let i = 0; i < 22; i++){

function updateHazards(dt){
  if(state.vortex && state.vortex.t > 0){
    state.vortex.t -= dt;
    const vx = state.vortex.x - P.x, vy = state.vortex.y - P.y;
    const vd = Math.hypot(vx, vy) || 1;
    if(vd > 12){
      P.x += vx / vd * 95 * dt;
      P.y += vy / vd * 95 * dt;
      resolveCollision(P);
    }
  }
  for(let i = hazards.length - 1; i >= 0; i--){
    const h = hazards[i];
    h.t -= dt;
    if(h.t > 0) continue;
    effects.push({ type:'shockwave', x:h.x, y:h.y, maxR:h.r * 1.15,
      color:h.color, life:0.42, maxLife:0.42, width:8 });
    for(let k = 0; k < 8; k++){
      const a = k / 8 * Math.PI * 2;
      addParticle(h.x + Math.cos(a) * h.r * 0.7, h.y + Math.sin(a) * h.r * 0.5, {
        vx: Math.cos(a) * rnd(60, 180), vy: Math.sin(a) * rnd(40, 120),
        life: 0.4, size: rnd(4, 9), color: h.color, type:'spark', drag:0.9
      });
    }
    if(Math.hypot(P.x - h.x, P.y - h.y) < h.r + 12){
      if(h.freeze) P.frozen = Math.max(P.frozen || 0, h.freeze);
      damagePlayer({ atk: h.dmg, x: h.x, y: h.y });
    }
    hazards.splice(i, 1);
  }
}

function drawHazards(){
  for(const h of hazards){
    const p = 1 - h.t / h.delay;
    if(p < 0) continue;
    const r = h.r * (0.3 + p * 0.7);
    ctx.save();
    ctx.fillStyle = `rgba(${h.color},1)`;
    ctx.globalAlpha = 0.1 + p * 0.15;
    ctx.beginPath(); ctx.ellipse(h.x, h.y, r, r * 0.72, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = `rgba(${h.color},1)`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.72, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(h.x, h.y, r, r * 0.72, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = 0.45 + p * 0.5;
    ctx.beginPath(); ctx.arc(h.x, h.y, 4 + p * 7, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function maintainEnemies(){
  for(let i = state.enemies.length-1; i >= 0; i--){
    const e = state.enemies[i];
    if(!isNum(e.x) || !isNum(e.y)){ state.enemies.splice(i,1); continue; }
    if(Math.hypot(e.x-P.x, e.y-P.y) > 2600 && !e.dead && !e.chasing) state.enemies.splice(i,1);
  }
  const alive = state.enemies.filter(e => !e.dead);
  const bossCount = alive.filter(e => e.elite).length;
  const minionCount = alive.length - bossCount;
  const bio = curBiome();
  const wantMinions = Math.max(4, Math.round((8 + G.realm * 1.4) * (bio.dens || 1)));
  if(minionCount < wantMinions && state.t > state.nextSpawnT){
    spawnMinion();
    state.nextSpawnT = state.t + 0.85;
  }
  if(bossCount < 1 && state.t > state.nextBossT && G.realm >= 1 && state.grace <= 0){
    spawnBoss();
    state.nextBossT = state.t + rnd(45, 60);
  }
}
function spawnHerb(){
  const ang = Math.random() * Math.PI * 2;
  const dist = rnd(250, 1400);
  state.herbs.push({ x: P.x + Math.cos(ang)*dist, y: P.y + Math.sin(ang)*dist,
    alive: true, seed: Math.random()*100 });
}
function maintainHerbs(){
  for(let i = state.herbs.length-1; i >= 0; i--){
    const h = state.herbs[i];
    if(Math.hypot(h.x-P.x, h.y-P.y) > 2600) state.herbs.splice(i,1);
  }
  if(state.herbs.length < 10 && state.t > state.nextHerbT){
    spawnHerb();
    state.nextHerbT = state.t + 0.9;
  }
}

function makeSiteBuilding(x, y, kind, r, bi, rng, cx, cy){
  return {
    x: x, y: y, kind: kind, r: r, rot: 0,
    seed: rng() * 100,
    style: TOWN_KINDS[kind] ? bi : null,
    variant: Math.floor(rng() * 3)
  };
}
function pickSiteKind(pool, rng){
  const r = rng();
  if(r < 0.52) return 'house';
  return pool[Math.floor(rng() * pool.length)];
}
function genVillageSite(bi, cx, cy, rng){
  const pool = BIOME_SITE_KINDS[bi] || BIOME_SITE_KINDS[0];
  const centers = BIOME_SITE_CENTER[bi] || ['well'];
  const buildings = [];
  const ck = centers[Math.floor(rng() * centers.length)];
  buildings.push(makeSiteBuilding(cx, cy, ck,
    (KIND_R[ck] || 60) * (0.95 + rng() * 0.25), bi, rng, cx, cy));

  const n = 5 + Math.floor(rng() * 4);
  for(let i = 0; i < n; i++){
    let placed = false;
    for(let attempt = 0; attempt < 9 && !placed; attempt++){
      const a = (i / n) * Math.PI * 2 + rng() * 0.8 + attempt * 0.13;
      const rad = 92 + rng() * 78;
      const x = cx + Math.cos(a) * rad;
      const y = cy + Math.sin(a) * rad * 0.85;
      const kind = pickSiteKind(pool, rng);
      const r = (KIND_R[kind] || 60) * (0.9 + rng() * 0.25);
      let ok = true;
      for(const b of buildings){
        if(Math.hypot(b.x - x, b.y - y) < (b.r + r) * 0.88){ ok = false; break; }
      }
      if(!ok) continue;
      buildings.push(makeSiteBuilding(x, y, kind, r, bi, rng, cx, cy));
      placed = true;
    }
  }
  const extra = 1 + Math.floor(rng() * 2);
  for(let i = 0; i < extra; i++){
    const a = rng() * Math.PI * 2;
    const rad = 128 + rng() * 56;
    const kind = rng() < 0.6 ? 'lantern' : 'banner';
    buildings.push(makeSiteBuilding(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * 0.85,
      kind, (KIND_R[kind] || 36) * 0.95, bi, rng, cx, cy));
  }
  let maxD = 0;
  for(const b of buildings) maxD = Math.max(maxD, Math.hypot(b.x - cx, b.y - cy) + b.r * 0.55);
  const padR = maxD + 42;
  const pavers = [];
  const np = 16 + Math.floor(rng() * 14);
  for(let i = 0; i < np; i++){
    const a = rng() * Math.PI * 2;
    const rad = Math.sqrt(rng()) * padR * 0.9;
    pavers.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad * 0.9,
      rx: 8 + rng() * 13, ry: 4 + rng() * 4, al: 0.05 + rng() * 0.09 });
  }
  return { x:cx, y:cy, biome:bi, kind:'village', buildings:buildings,
    scenery:[], padR:padR, clear:padR + 30, pavers:pavers };
}

function genRuinSite(bi, cx, cy, rng){

    const rad = 60 + rng() * 75;
    const kind = pool[Math.floor(rng() * (pool.length - 1))];
    const r = (KIND_R[kind] || 60) * (0.9 + rng() * 0.25);

function genScenerySite(bi, cx, cy, rng){

  const centre = makeSiteBuilding(cx, cy, conf.center,

  const scenery = [];
  const n = conf.n[0] + Math.floor(rng() * (conf.n[1] - conf.n[0]));
  for(let i = 0; i < n; i++){
    const a = rng() * Math.PI * 2;
    const rad = 55 + rng() * 165;
    scenery.push({
      x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad * 0.86,
      type: conf.props[Math.floor(rng() * conf.props.length)],
      k: conf.scale[0] + rng() * (conf.scale[1] - conf.scale[0]),
      seed: rng() * 100
    });
  }
  return { x:cx, y:cy, biome:bi, kind:'scenery', buildings:[centre],
    scenery:scenery, padR:0, clear:0, pavers:[] };
}

function genSite(sx, sy){
  const bi = state.biome;
  const rng = mulberry32(hashInt(sx * 13 + bi * 7919 + 17, sy * 17 + bi * 3571 + 31));
  const cx = sx * SITE_CELL + SITE_CELL * (0.42 + rng() * 0.16);
  const cy = sy * SITE_CELL + SITE_CELL * (0.42 + rng() * 0.16);
  const origin = BIOME_ORIGIN[bi] || { x: 0, y: 0 };
  if(Math.hypot(cx - origin.x, cy - origin.y) < 300) return null;
  if(rng() > 0.82) return null;
  const lx = Math.floor(cx / LAKE_CELL), ly = Math.floor(cy / LAKE_CELL);
  for(let j = -1; j <= 1; j++){
    for(let i = -1; i <= 1; i++){
      const lake = lakeAt(lx + i, ly + j);
      if(!lake) continue;
      const nx = (cx - lake.x) / lake.rx, ny = (cy - lake.y) / lake.ry;
      if(nx * nx + ny * ny < 1.5) return null;
    }
  }
  const roll = rng();
  if(roll < 0.46) return genVillageSite(bi, cx, cy, rng);
  if(roll < 0.70) return genRuinSite(bi, cx, cy, rng);
  return genScenerySite(bi, cx, cy, rng);
}

function siteAt(sx, sy){
  const k = sx + ',' + sy;
  if(siteCache.has(k)) return siteCache.get(k);
  const site = genSite(sx, sy);
  siteCache.set(k, site);
  return site;
}

function siteBlocks(x, y){
  const sx = Math.floor(x / SITE_CELL), sy = Math.floor(y / SITE_CELL);
  for(let j = -1; j <= 1; j++){
    for(let i = -1; i <= 1; i++){
      const st = siteAt(sx + i, sy + j);
      if(st && st.clear > 0 && Math.hypot(x - st.x, y - st.y) < st.clear) return true;
    }
  }
  return false;
}

function setupLandmarks(){
  siteCache.clear();
}

function collectVisibleSites(){
  const out = [];
  const x0 = Math.floor((state.camX - 260) / SITE_CELL);
  const x1 = Math.floor((state.camX + W + 260) / SITE_CELL);
  const y0 = Math.floor((state.camY - 360) / SITE_CELL);
  const y1 = Math.floor((state.camY + H + 260) / SITE_CELL);
  if(!isFinite(x0) || !isFinite(x1) || !isFinite(y0) || !isFinite(y1)) return out;
  if(x1 - x0 > 16 || y1 - y0 > 16) return out;
  for(let sy = y0; sy <= y1; sy++){
    for(let sx = x0; sx <= x1; sx++){
      const st = siteAt(sx, sy);
      if(st) out.push(st);
    }
  }
  return out;
}

function drawSiteGround(st){
  if(!st.padR || st.padR <= 0) return;
  const pad = st.padR * 1.25;
  if(st.x < state.camX - pad || st.x > state.camX + W + pad ||
     st.y < state.camY - pad || st.y > state.camY + H + pad) return;
  const s = BUILD_STYLES[st.biome] || BUILD_STYLES[0];
  const g = ctx.createRadialGradient(st.x, st.y, st.padR * 0.1, st.x, st.y, st.padR * 1.1);
  g.addColorStop(0, s.pave);
  g.addColorStop(0.62, s.pave2);
  g.addColorStop(1, s.pave0);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(st.x, st.y, st.padR * 1.05, st.padR * 0.95, 0, 0, 7);
  ctx.fill();
  for(const p of st.pavers){
    ctx.fillStyle = s.pave;
    ctx.globalAlpha = p.al * 2.4;
    ctx.beginPath();
    ctx.ellipse(st.x + p.x, st.y + p.y, p.rx, p.ry, 0, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBigProp(s){
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(s.k, s.k);
  drawPropByType({ x: 0, y: 0, type: s.type, seed: s.seed, r: 10 });
  ctx.restore();
}

function resolveCollision(o){
  const cx0 = Math.floor((o.x - 60) / CELL);
  const cx1 = Math.floor((o.x + 60) / CELL);
  const cy0 = Math.floor((o.y - 60) / CELL);
  const cy1 = Math.floor((o.y + 60) / CELL);
  for(let cy = cy0; cy <= cy1; cy++){
    for(let cx = cx0; cx <= cx1; cx++){
      const chunk = getChunk(cx, cy);
      for(const p of chunk.props){
        const dx = o.x - p.x, dy = o.y - p.y;
        const d = Math.hypot(dx, dy);
        const min = o.r + p.r;
        if(d < min && d > 0.01){
          const push = min - d;
          o.x += dx/d * push; o.y += dy/d * push;
        }
      }
    }
  }
  const lcx = Math.floor(o.x / LAKE_CELL);
  const lcy = Math.floor(o.y / LAKE_CELL);
  for(let j = -1; j <= 1; j++){
    for(let i = -1; i <= 1; i++){
      const lake = lakeAt(lcx+i, lcy+j);
      if(!lake) continue;
      const nx = (o.x - lake.x)/lake.rx, ny = (o.y - lake.y)/lake.ry;
      const d = Math.hypot(nx, ny);
      if(d < 1 && d > 0.01){
        o.x = lake.x + nx/d * lake.rx * 1.03;
        o.y = lake.y + ny/d * lake.ry * 1.03;
      }
    }
  }
}

function addParticle(x, y, o){
  if(!isNum(x) || !isNum(y)) return;
  if(particles.length > PARTICLE_CAP) return;
  particles.push({ x, y, vx: o.vx || 0, vy: o.vy || 0,
    life: o.life || 0.6, maxLife: o.life || 0.6,
    size: o.size || 4, color: o.color || '255,255,255',
    type: o.type || 'dot', gravity: o.gravity || 0,
    drag: o.drag != null ? o.drag : 0.94,
    angle: o.angle || 0, spin: o.spin || 0, grow: o.grow || 0 });

function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0 || !isNum(p.x) || !isNum(p.y)){ particles.splice(i,1); continue; }
    p.vx *= Math.pow(p.drag, dt * 60);
    p.vy *= Math.pow(p.drag, dt * 60);
    p.vy += p.gravity * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.angle += p.spin * dt;
  }
}

function doAttack(){
  if(!state.started || state.t < G.atkCd) return;
  G.atkCd = state.t + 0.4;
  let target = null, td = 150;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
    if(d < td){ td = d; target = e; }
  }
  let angle;
  if(target){
    angle = Math.atan2(target.y - P.y, target.x - P.x);
    if(Math.abs(Math.cos(angle)) >= Math.abs(Math.sin(angle)))
      P.dir = Math.cos(angle) > 0 ? 2 : 1;
    else P.dir = Math.sin(angle) > 0 ? 0 : 3;
  } else {
    angle = P.dir === 0 ? Math.PI/2 : P.dir === 1 ? Math.PI
          : P.dir === 2 ? 0 : -Math.PI/2;
  }
  P.swing = 0.26; P.swingAngle = angle; P.swingSide = -P.swingSide;
  const range = 105, halfAngle = Math.PI / 3;
  const dmgMul = (isSwordGod() ? 1.3 : 1) * weaponAtkMul();
  for(const e of state.enemies){
    if(e.dead) continue;
    const dx = e.x - P.x, dy = e.y - P.y;
    const d = Math.hypot(dx, dy);
    if(d > range + e.r) continue;
    let diff = Math.abs(Math.atan2(dy, dx) - angle);
    if(diff > Math.PI) diff = Math.PI*2 - diff;
    if(diff > halfAngle) continue;
    damageEnemy(e, G.atk * dmgMul, angle);
  }
  emitWeaponStrike(angle);
  shake(1.8);
}

    if(e.dead) continue;

    if(d < bd){ bd = d; best = e; }

function inputDir(){

  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;
  if(joy.active){ ix += joy.vx; iy += joy.vy; }
  if(Math.hypot(ix, iy) < 0.1){
    const a = dirAngle(); ix = Math.cos(a); iy = Math.sin(a);

  const len = Math.hypot(ix, iy) || 1;
  return { x: ix/len, y: iy/len };

          life: rnd(0.25, 0.45), size: rnd(4, 9), color: k % 2 ? FX : SUB, type: 'line', angle, drag: 0.9 });
      }
      shake(4, 0.18);
      break;
    }
    case 'dash': {
      const d = inputDir();
      const oldX = P.x, oldY = P.y;
      for(let k = 0; k <= 6; k++){
        const t = k / 6;
        effects.push({ type:'ghost', x: oldX + d.x * 220 * t, y: oldY + d.y * 220 * t,
          color: FX, life: 0.45 + t * 0.2, maxLife: 0.65, kind: P.dir });
      }
      fxBurst(oldX, py0, 16, 240, SUB, { angle: Math.atan2(-d.y, -d.x), spread: 0.9, size: 6, life: 0.4 });
      P.x += d.x * 220; P.y += d.y * 220;
      resolveCollision(P);
      fxRing(oldX, oldY, 60, c, 0.4, 3);
      fxRing(P.x, P.y, 50, SUB, 0.35, 3);
      if(Math.abs(d.x) >= Math.abs(d.y)) P.dir = d.x > 0 ? 2 : 1;
      else P.dir = d.y > 0 ? 0 : 3;
      P.anim += 2;
      for(const e of state.enemies){
        if(e.dead) continue;
        if(Math.hypot(e.x - P.x, e.y - P.y) < 62 + e.r){
          damageEnemy(e, G.atk * 1.4 * wMul, Math.atan2(e.y - oldY, e.x - oldX), sk);
        }
      }
      shake(2.5, 0.12);
      break;
    }
    case 'rain': {
      const centerX = P.x, centerY = P.y - 26;
      const R = sk.radius;
      const dmg = G.atk * sk.power * wMul;
      const count = 12;
      const meteor = sk.shape === 'meteor';
      fxRing(centerX, P.y, R, FX, 0.55, 3);
      fxRunes(centerX, P.y - 6, R * 0.92, (sk.id || 0) + 3, FX, 1.05, sk.key);
      for(let k = 0; k < count; k++){
        (function(k){
          const delay = k * 75;
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * R;
          const tx = centerX + Math.cos(a) * r;
          const ty = P.y + Math.sin(a) * r * 0.65;
          effects.push({ type:'falling', x:tx, y:ty, delay: delay/1000, color: c, sub: SUB,
            life: 0.55, maxLife: 0.55, meteor, angle: rnd(-0.2, 0.2) });
          setTimeout(() => {
            if(!state.started) return;
            fxRunes(tx, ty + 4, meteor ? 52 : 38, k, FX, 0.5, '');
            fxPillar(tx, ty, meteor ? 46 : 32, FX, 0.46, meteor ? 36 : 22);
            fxShock(tx, ty, meteor ? 100 : 70, c, 0.44, meteor ? 12 : 8);
            fxShock(tx, ty, meteor ? 62 : 44, SUB, 0.32, 4);
            fxRing(tx, ty, meteor ? 74 : 50, SUB, 0.38, 3);
            fxBurst(tx, ty, meteor ? 20 : 12, 300, FX, { size: 6, life: 0.5 });
            fxBurst(tx, ty, 8, 160, SUB, { size: 4, life: 0.45, type: 'dot', grow: 4 });
            for(const e of state.enemies){
              if(e.dead) continue;
              const dd = Math.hypot(e.x - tx, e.y - ty);
              if(dd < 60 + e.r){
                damageEnemy(e, dmg, Math.atan2(e.y - ty, e.x - tx), sk);
              }
            }
          }, delay);
        })(k);
      }
      shake(5, 0.22);
      break;
    }
    case 'shield': {
      const amount = Math.floor(G.maxHp * sk.power);
      state.shield = (state.shield || 0) + amount;
      state.shieldTime = 8;
      addFloat(P.x, P.y - 56, '+' + fmt(amount) + ' 护盾', '#ffe070', true);
      fxRing(P.x, P.y, 85, c, 0.6, 4);
      fxRing(P.x, P.y, 60, SUB, 0.45, 6);
      fxRunes(P.x, P.y - 6, 52, 5, FX, 0.7, '剑');
      for(let k = 0; k < 22; k++){
        const a = k / 22 * Math.PI * 2;
        addParticle(P.x + Math.cos(a)*28, P.y - 26 + Math.sin(a)*22, {

      }

    }
    case 'ultimate': {
      const radius = sk.radius * (isSwordGod() ? 1.2 : 1);
      const dmg = G.atk * sk.power * (isSwordGod() ? 1.3 : 1) * wMul;
      fxPillar(P.x, P.y, 110, SUB, 0.85, 40);
      fxPillar(P.x, P.y, 60, FX, 0.6, 70);
      fxRunes(P.x, P.y - 6, radius * 0.9, 11, FX, 1.0, '剑');
      for(let k = 0; k < 4; k++){
        const a = k * Math.PI/2 + 0.3;
        fxSlash(P.x, P.y - 26, a, radius * 1.1, k % 2 ? SUB : FX, 0.55 + k * 0.04, 14);
      }
      for(let k = 0; k < 4; k++){
        const a = k * Math.PI/2 + 0.3 + Math.PI/4;
        fxSlash(P.x, P.y - 26, a, radius * 0.72, k % 2 ? SUB : FX, 0.62, 10);
      }
      fxShock(P.x, P.y, radius * 1.25, SUB, 1.1, 14);
      fxShock(P.x, P.y, radius * 0.55, c, 0.7, 6);
      fxRunes(P.x, P.y + 2, radius * 1.05, 12, FX, 1.1, '');
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d > radius) continue;
        damageEnemy(e, dmg, Math.atan2(e.y - P.y, e.x - P.x), sk);

      fxShock(P.x, P.y, radius * 0.7, SUB, 0.7, 10);
      fxRing(P.x, P.y, radius * 1.15, FX, 0.9, 6);
      fxBurst(P.x, py0, 46, 560, FX, { size: 9, life: 0.85 });
      fxBurst(P.x, py0, 24, 300, SUB, { size: 6, life: 0.7, type: 'dot', grow: 5 });
      shake(14, 0.6);
      screenFlash('rgba(255,240,180,.7)', 600);
      break;
    }
    case 'teleport': {
      const oldX = P.x, oldY = P.y;
      const d = inputDir();
      fxRing(oldX, oldY, 50, c, 0.4, 3);
      fxBurst(oldX, py0, 14, 220, FX, { size: 5, life: 0.4 });
      for(let k = 1; k <= 5; k++){
        effects.push({ type:'ghost', x: oldX + d.x * sk.radius * (k/5), y: oldY + d.y * sk.radius * (k/5),
          color: FX, life: 0.5 - k * 0.05, maxLife: 0.5, kind: P.dir });

      P.x += d.x * sk.radius; P.y += d.y * sk.radius;
      resolveCollision(P);
      fxRing(P.x, P.y, 60, SUB, 0.4, 4);
      fxPillar(P.x, P.y, 44, SUB, 0.4, 16);
      for(const e of state.enemies){
        if(e.dead) continue;
        if(Math.hypot(e.x - P.x, e.y - P.y) < 58 + e.r){
          damageEnemy(e, G.atk * 2.0 * wMul, Math.atan2(e.y - P.y, e.x - P.x), sk);
        }
      }
      break;
    }
    case 'heal': {
      const v = Math.floor(G.maxHp * sk.power);
      G.hp = Math.min(G.maxHp, G.hp + v);
      addFloat(P.x, P.y - 56, '+' + fmt(v), '#89e2ce', true);
      fxRing(P.x, P.y, 95, c, 0.55, 4);
      fxRunes(P.x, P.y - 6, 60, 2, FX, 0.8, sk.key);
      for(let k = 0; k < 26; k++){
        const a = rnd(0, Math.PI*2), rr = rnd(20, 70);
        addParticle(P.x + Math.cos(a)*rr, P.y + Math.sin(a)*rr*0.6, {
          vx: -Math.cos(a) * 40, vy: -rnd(60, 150),
          life: rnd(0.5, 1.0), size: rnd(3, 6), color: k % 2 ? c : SUB,
          type: 'dot', drag: 0.96, grow: 2 });
      }
      break;
    }
    case 'fly': {
      P.flying = 8.0;
      toast('御剑飞行 · 8 秒！');
      fxRing(P.x, P.y, 90, c, 0.6, 4);
      fxShock(P.x, P.y, 130, SUB, 0.5, 8);
      for(let k = 0; k < 18; k++){
        const a = rnd(0, Math.PI*2);
        addParticle(P.x + Math.cos(a)*30, P.y + Math.sin(a)*16, {
          vx: Math.cos(a)*rnd(60,180), vy: rnd(-40, 60), life: rnd(0.3,0.6), size: rnd(3,7),
          color: SUB, type: 'spark', angle: a, drag: 0.92 });
      }
      shake(3, 0.15);
      break;
    }
    case 'nova': {
      const radius = sk.radius * (isSwordGod() ? 1.2 : 1);
      const freeze = sk.freeze;
      for(const e of state.enemies){
        if(e.dead) continue;
        const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
        if(d > radius) continue;
        const ang = Math.atan2(e.y - P.y, e.x - P.x);
        damageEnemy(e, G.atk * sk.power * (isSwordGod() ? 1.25 : 1) * wMul, ang, sk);
        if(freeze) e.frozen = Math.max(e.frozen || 0, freeze);
      }
      fxGlow(P.x, py0, radius * 0.5, SUB, 0.3);
      fxShock(P.x, py0, radius, c, 0.5, 10);
      fxShock(P.x, py0, radius * 0.72, SUB, 0.4, 6);
      fxShock(P.x, py0, radius * 0.42, c, 0.32, 3);
      fxRing(P.x, P.y, radius, FX, 0.55, 4);
      skillShapeFX({ shape:'twin' }, P.x, P.y, rnd(0, 3), radius * 0.85, FX, SUB);
      for(let k = 0; k < 4; k++){
        const a = k * Math.PI/2 + 0.3 + state.t * 0.2;
        fxSlash(P.x, py0, a, radius * 0.95, k % 2 ? SUB : FX, 0.42, 8);
      }
      fxRunes(P.x, P.y - 6, radius * 0.7, (sk.id || 0), FX, 0.6, '');
      const isFrost = sk.trail === 'frost' || sk.trail === 'water';
      for(let k = 0; k < 30; k++){
        const a = k / 30 * Math.PI * 2 + rnd(-0.1, 0.1);
        const sp = rnd(240, 520);
        addParticle(P.x, py0, { vx: Math.cos(a)*sp, vy: Math.sin(a)*sp*0.72 - 20,
          life: rnd(0.35, 0.65), size: rnd(4, 10), color: k % 3 ? c : SUB,
          type: isFrost ? 'dot' : 'spark', angle: a, drag: 0.9, grow: isFrost ? 4 : 0 });
      }
      if(sk.trail === 'fire'){
        for(let k = 0; k < 14; k++){
          const a = rnd(0, Math.PI*2), rr = rnd(40, radius * 0.8);
          fxGlow(P.x + Math.cos(a)*rr, P.y + Math.sin(a)*rr*0.6, rnd(30, 60), '255,120,40', rnd(0.3, 0.6));
        }
      }
      fxBurst(P.x, py0, 12, 300, FX, { size: 5, life: 0.6, type: 'dot', grow: 6 });
      if(sk.trail === 'leaf'){
        for(let k = 0; k < 16; k++){
          const a = rnd(0, Math.PI*2);
          addParticle(P.x, py0, { vx: Math.cos(a)*rnd(80,260), vy: Math.sin(a)*rnd(60,200) - 80,
            life: rnd(0.7, 1.2), size: rnd(3,6), color: k % 2 ? '150,255,160' : SUB, type: 'dot', drag: 0.96, grow: 1 });
        }
      }
      shake(8, 0.22);
      break;
    }
    case 'swords': {
      const n = 18;
      const dmg = G.atk * sk.power * wMul;
      fxRunes(P.x, P.y - 6, 80, 4, FX, 0.7, '剑');
      fxRing(P.x, P.y, 70, SUB, 0.4, 3);
      for(let k = 0; k < n; k++){
        const a = (k / n) * Math.PI * 2 + rnd(-0.08, 0.08);
        projectiles.push({
          x: P.x + Math.cos(a)*20, y: P.y - 26 + Math.sin(a)*20,
          vx: Math.cos(a) * 620, vy: Math.sin(a) * 620,
          target: null, damage: dmg, life: 1.0,
          color: c, r: 3, homing: false, angle: Math.atan2(Math.sin(a), Math.cos(a)),
          weapon: G.currentWeapon, trailFx: sk.trail, glowColor: SUB
        });
      }
      emitTrail(P.x, py0, 0, sk);
      shake(5, 0.16);
      break;
    }
    case 'chain': {
      let curX = P.x, curY = py0;
      let remaining = 5, mul = 1;
      const used = new Set();
      fxGlow(P.x, py0, 60, SUB, 0.3);
      while(remaining-- > 0){
        let best = null, bd = sk.radius;
        for(const e of state.enemies){
          if(e.dead || used.has(e)) continue;
          const d = Math.hypot(e.x - curX, e.y - 20 - curY);
          if(d < bd){ bd = d; best = e; }
        }
        if(!best) break;
        used.add(best);
        beams.push({ x1: curX, y1: curY, x2: best.x, y2: best.y - 20,
          color: c, sub: SUB, life: 0.3, maxLife: 0.3, segs: 9, jitter: 16, branch: true });
        const ang = Math.atan2(best.y - curY, best.x - curX);
        damageEnemy(best, G.atk * sk.power * mul * wMul, ang, sk);
        fxPillar(best.x, best.y, 36, SUB, 0.35, 16);
        fxRing(best.x, best.y - 20, 56, c, 0.35, 3);
        fxBurst(best.x, best.y - 20, 12, 260, c,   { size: 5, life: 0.4 });
        fxBurst(best.x, best.y - 20, 6,  180, SUB, { size: 3, life: 0.3, type:'dot', grow: 3 });
        fxRing(best.x, best.y - 20, 44, SUB, 0.28, 2.5);
        curX = best.x; curY = best.y - 20; mul *= 0.82;
      }
      if(used.size === 0){ G.mp += sk.mp; G.cd[skillId] = 0.5; return; }
      else {
        fxPillar(P.x, P.y, 40, SUB, 0.35, 18);
      }
      break;
    }
    case 'domain': {
      state.domain = 5.5;
      state.domainTick = 0;
      state.domainPower = sk.power * wMul;
      state.domainRadius = sk.radius;
      state.domainColor = sk.color;
      state.domainColorSub = SUB;
      state.domainTrail = sk.trail;
      state.domainSkill = sk;
      toast('领域展开');
      fxRing(P.x, P.y, sk.radius * 1.1, c, 0.9, 6);
      fxShock(P.x, P.y, sk.radius * 1.3, SUB, 0.7, 12);
      fxRunes(P.x, P.y - 6, sk.radius, 7, FX, 1.0, sk.key);
      fxPillar(P.x, P.y, 80, FX, 0.6, 26);
      fxBurst(P.x, py0, 34, 420, FX, { size: 7, life: 0.7 });
      shake(9, 0.4);
      screenFlash(sk.trail === 'blood' ? 'rgba(255,60,100,.45)' : 'rgba(255,220,140,.5)', 500);
      break;
    }
  }
}

function damageEnemy(e, rawAtk, angle, fxCfg){
  if(e.dead) return;
  const dmg = Math.max(1, Math.floor(rawAtk - e.def * 0.6));
  e.hp -= dmg;
  e.hitFlash = 0.14;
  const dx = Math.cos(angle || 0), dy = Math.sin(angle || 0);
  const push = e.elite ? 4 : 10;
  e.x += dx * push; e.y += dy * push;
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
  const crit = dmg > G.atk * 2;
  addFloat(e.x + rnd(-6,6), e.y - (e.elite ? 150 : 32), dmg, crit ? '#ffd060' : '#ffe0a0', crit);
  const hx = e.x, hy = e.y - (e.elite ? 60 : 20);
  const col = fxCfg ? (fxCfg.fx || fxCfg.color) : '255,230,170';
  const kind = fxCfg && fxCfg.hitFx ? fxCfg.hitFx : 'spark';
  const cnt = crit ? 12 : 7;
  for(let k = 0; k < cnt; k++){
    const a = (angle || 0) + rnd(-1.4, 1.4);
    const sp = rnd(90, crit ? 380 : 260);
    addParticle(hx + rnd(-6,6), hy + rnd(-10,10), {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
      life: rnd(0.22, 0.5), size: rnd(2, crit ? 7 : 5),
      color: col, type: kind === 'frost' ? 'dot' : 'spark',
      angle: a, spin: rnd(-12,12), drag: 0.88, grow: kind === 'frost' ? 3 : 0
    });
  }
  if(kind === 'frost'){
    fxPillar(hx, e.y, 22, col, 0.35, 14);
    fxRing(hx, hy, e.r + 22, '235,252,255', 0.3, 2.5);
  } else if(kind === 'burn'){
    for(let k = 0; k < 5; k++){
      addParticle(hx + rnd(-8,8), hy + rnd(-10,10), { vx: rnd(-30,30), vy: rnd(-140,-60),
        life: rnd(0.35,0.6), size: rnd(3,6), color: k % 2 ? col : '255,230,140', type: 'dot', drag: 0.95, grow: 4 });
    }
    fxGlow(hx, hy, e.r + 34, col, 0.28);
  } else if(kind === 'shadow'){
    for(let k = 0; k < 6; k++){
      const a = rnd(0, Math.PI*2);
      addParticle(hx, hy, { vx: Math.cos(a)*rnd(60,200), vy: Math.sin(a)*rnd(60,200) - 20,
        life: rnd(0.3,0.55), size: rnd(3,6), color: col, type: 'dot', drag: 0.92, grow: 3 });
    }
    fxSlash(hx, hy, (angle || 0) + Math.PI/2, e.r + 30, col, 0.26, 4);
    fxSlash(hx, hy, (angle || 0) - Math.PI/2, e.r + 30, col, 0.26, 4);
  } else if(kind === 'leaf'){
    for(let k = 0; k < 6; k++){
      const a = rnd(0, Math.PI*2);
      addParticle(hx, hy, { vx: Math.cos(a)*rnd(50,170), vy: Math.sin(a)*rnd(50,140) - 60,
        life: rnd(0.5,0.9), size: rnd(2.5,5), color: k % 2 ? col : '190,255,190', type: 'dot', drag: 0.96, grow: 1 });
    }
  } else if(kind === 'burst'){
    fxGlow(hx, hy, e.r + 26, col, 0.25);
  }
  if(crit) fxSlash(hx, hy, angle || 0, e.r + 34, '255,240,190', 0.22, 3);
  else fxRing(hx, hy, e.r + 14, col, 0.2, 2.5);
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  e.deadTimer = e.elite ? 1.4 : 0.55;
  e.chasing = false;
  G.qi     += e.rewardQi;
  G.stones += e.rewardStones;
  addFloat(e.x, e.y - (e.elite ? 180 : 44), '修为 +' + fmt(e.rewardQi), '#89e2ce', e.elite);
  const nP = e.elite ? 46 : (e.refined ? 18 : 12);
  for(let k = 0; k < nP; k++){
    const a = rnd(0, Math.PI*2), sp = rnd(50, e.elite ? 300 : 170);
    addParticle(e.x + rnd(-8,8), e.y - 22 + rnd(-16,16), {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp*0.7 - rnd(30, 120),
      life: rnd(0.4, 0.9), size: rnd(2, e.elite ? 7 : 4.5),
      color: k % 3 === 0 ? '137,226,206' : (e.refined ? '255,230,150' : (e.rgb || '200,200,200')),
      type: k % 2 ? 'dot' : 'spark', angle: a, drag: 0.93, grow: k % 3 === 0 ? 2 : 0
    });
  }
  fxRing(e.x, e.y - 10, e.elite ? 160 : (e.refined ? 70 : 46), '150,240,220',
    e.elite ? 0.8 : 0.45, e.elite ? 5 : 3);
  if(e.elite){
    const sid = BIOME_SKILL_ID(state.biome);
    if(!G.unlockedSkills.has(sid)){
      G.unlockedSkills.add(sid);
      const sk = SKILL_LIBRARY[sid];
      if(sk){ addFloat(P.x, P.y - 240, '领悟 · ' + sk.name, '#ffd870', true); toast('领悟 · ' + sk.name); }
    }
    const wid = state.biome + 1;
    if(WEAPON_MAP[wid] && !G.weapons.has(wid)){
      G.weapons.add(wid);
      const w = WEAPON_MAP[wid];
      addFloat(P.x, P.y - 270, '获得 · ' + w.name, 'rgb(' + w.color + ')', true);
      toast('获得神兵 · ' + w.name);
    }
    shake(14, 0.6);
    screenFlash('rgba(255,180,220,.5)', 600);
    save();
  } else {
    shake(3, 0.18);
  }
}
function damagePlayer(e){
  if(state.t < playerInvuln) return;
  if((P.flying > 0 && Math.random() < 0.3) || P.escaping > 0) return;
  playerInvuln = state.t + 0.5;
  let dmg = Math.max(1, Math.floor(e.atk * enemyAtkMul() - G.def * 0.6));
  if(state.shield > 0){
    const absorbed = Math.min(dmg, state.shield);
    state.shield -= absorbed;
    dmg -= absorbed;
    if(state.shield <= 0){
      for(let k = 0; k < 16; k++){
        const a = rnd(0, Math.PI*2);
        addParticle(P.x, P.y - 26, { vx: Math.cos(a)*rnd(90,260), vy: Math.sin(a)*rnd(60,200) - 40,
          life: rnd(0.3,0.6), size: rnd(2,5), color:'255,236,160', type:'spark', angle:a, drag:0.9 });
      }
      fxRing(P.x, P.y - 10, 90, '255,236,160', 0.4, 3);
    }
    if(dmg <= 0){ addFloat(P.x, P.y - 52, '格挡', '#ffe070', false); return; }
  }
  G.hp -= dmg;
  addFloat(P.x, P.y - 52, dmg, '#ff6b5a');
  shake(5, 0.14);
  hurtFlash();
  for(let k = 0; k < 7; k++){
    const a = rnd(0, Math.PI*2);
    addParticle(P.x, P.y - 28, { vx: Math.cos(a)*rnd(40,150), vy: Math.sin(a)*rnd(30,120) - 30,
      life: rnd(0.25,0.5), size: rnd(2,4), color:'255,90,70', type:'spark', angle:a, drag:0.88 });
  }
  fxShock(P.x, P.y - 20, 52, '255,90,80', 0.25, 4);
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  P.x += dx/d * 16; P.y += dy/d * 16;
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(G.hp <= 0) playerDie();
}
function playerDie(){
  G.hp = Math.floor(G.maxHp * 0.3);
  G.qi = Math.floor(G.qi * 0.8);
  state.shield = 0;
  hazards.length = 0;
  state.vortex = null;
  P.escaping = 0;
  const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
  P.x = origin.x; P.y = origin.y;
  state.grace = 3;
  state.domain = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  toast('你被击倒，修为受损');
  save();
}

function updateSwordArray(dt){
  if(!isSwordArrayOn()) return;
  state.swordAngle += dt * 2.2;
  state.swordInnerAngle -= dt * 3.2;
  if(state.t < state.swordCd) return;
  const n = swordCount();
  if(n === 0) return;
  const radius = 58;
  let target = null, td = 450;
  for(const e of state.enemies){
    if(e.dead) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if(d < td){ td = d; target = e; }
  }
  if(!target) return;
  const idx = Math.floor(Math.random() * n);
  const ang = state.swordAngle + idx * (Math.PI*2 / n);
  const sx = P.x + Math.cos(ang) * radius;
  const sy = P.y - 26 + Math.sin(ang) * radius * 0.55;
  const dx = target.x - sx, dy = (target.y - 20) - sy;
  const d = Math.hypot(dx, dy) || 1;
  const dmgBase = G.atk * (isSwordGod() ? 1.2 : 0.8) * weaponAtkMul();
  const w = currentWeapon() || WEAPONS[0];
  projectiles.push({
    x: sx, y: sy, vx: dx/d * 720, vy: dy/d * 720,
    target, damage: dmgBase,
    life: 1.8, color: isSwordGod() ? '255,220,120' : w.color,
    r: 3, homing: true, isArray: true,
    angle: Math.atan2(dy, dx) + Math.PI/2, weapon: w.id,
    glowColor: isSwordGod() ? '255,235,170' : '255,255,255'
  });
  for(let k = 0; k < 4; k++){
    addParticle(sx, sy, { vx: -Math.cos(ang) * rnd(20, 70) + rnd(-30,30), vy: -Math.sin(ang)*rnd(10,40),
      life: 0.3, size: rnd(3, 6), color: isSwordGod() ? '255,235,170' : w.color,
      type: 'dot', drag: 0.9, grow: 2 });
  }
  state.swordCd = state.t + (isSwordGod() ? 0.3 : totalLv() >= 27 ? 0.42 : 0.5);
}
function updateProjectiles(dt){
  for(let i = projectiles.length-1; i >= 0; i--){
    const pr = projectiles[i];
    pr.life -= dt;
    if(pr.life <= 0 || !isNum(pr.x) || !isNum(pr.y)){ projectiles.splice(i,1); continue; }
    if(pr.homing && pr.target && !pr.target.dead){
      const dx = pr.target.x - pr.x;
      const dy = (pr.target.y - 20) - pr.y;
      const d = Math.hypot(dx, dy) || 1;
      const sp = Math.hypot(pr.vx, pr.vy) || 600;
      pr.vx += (dx/d*sp - pr.vx) * Math.min(1, dt*8);
      pr.vy += (dy/d*sp - pr.vy) * Math.min(1, dt*8);
    }
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    if(pr.homing && Math.random() < 0.75){
      addParticle(pr.x + rnd(-3,3), pr.y + rnd(-3,3), {
        vx: -pr.vx * 0.05 + rnd(-15,15), vy: -pr.vy * 0.05 + rnd(-15,15),
        life: 0.28, size: rnd(2.5, 5), color: pr.glowColor || pr.color, type: 'dot', drag: 0.9, grow: 1 });
    }
    if(pr.isEnemy){
      if(Math.hypot(P.x - pr.x, (P.y - 26) - pr.y) < 24 + pr.r){
        damagePlayer({ atk: pr.damage, x: pr.x, y: pr.y });
        projectiles.splice(i, 1);
        continue;
      }
      continue;
    }
    let hit = null;
    for(const e of state.enemies){
      if(e.dead) continue;
      if(Math.hypot(e.x - pr.x, (e.y - 18) - pr.y) < e.r + 18){ hit = e; break; }
    }
    if(hit){
      const ha = Math.atan2(pr.vy, pr.vx);
      damageEnemy(hit, pr.damage, ha);
      fxSlash(pr.x, pr.y, ha, 46, pr.glowColor || '255,255,255', 0.22, 4);
      fxBurst(pr.x, pr.y, 7, 220, pr.color, { size: 4, life: 0.3 });
      projectiles.splice(i,1);
    }
  }
}
let domainFxT = 0;
function updateDomain(dt){
  if(state.domain <= 0) return;
  state.domain -= dt;
  state.domainTick -= dt;
  domainFxT -= dt;
  const c = state.domainColor || '255,220,140';
  const sub = state.domainColorSub || '255,255,255';
  if(Math.random() < 0.6){
    const R = state.domainRadius * Math.sqrt(Math.random());
    const a = rnd(0, Math.PI*2);
    addParticle(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R * 0.62, {
      vx: -Math.sin(a) * 120, vy: -Math.cos(a) * 60 - 50,
      life: rnd(0.3, 0.6), size: rnd(3, 6), color: Math.random() < 0.5 ? c : sub,
      type: 'dot', drag: 0.94, grow: 1 });
  }
  if(state.domainTick <= 0){
    state.domainTick = 0.28;
    const R = state.domainRadius;
    for(const e of state.enemies){
      if(e.dead) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y) - e.r;
      if(d > R) continue;
      const a = Math.atan2(e.y - P.y, e.x - P.x);
      damageEnemy(e, G.atk * state.domainPower, a, state.domainSkill || null);

      if(state.domainTrail === 'blood'){
        G.hp = Math.min(G.maxHp, G.hp + Math.floor(G.maxHp * 0.004));
      }
    }
    if(domainFxT <= 0){ domainFxT = 0.56; fxShock(P.x, P.y, R, c, 0.55, 3); }
  }
}

function updatePlayer(dt){
  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;
  if(joy.active){ ix += joy.vx; iy += joy.vy; }
  const len = Math.hypot(ix, iy);
  if(len > 1){ ix /= len; iy /= len; }
  if(!isNum(ix)) ix = 0; if(!isNum(iy)) iy = 0;
  if(P.frozen > 0){ P.frozen = Math.max(0, P.frozen - dt); ix = 0; iy = 0; }
  if(P.slow > 0) P.slow = Math.max(0, P.slow - dt);
  let speed = 178;
  if(P.slow > 0) speed *= 0.55;
  if(P.flying > 0) speed = 450;
  if(P.escaping > 0) speed = 900;
  P.x += ix * speed * dt; P.y += iy * speed * dt;
  P.moving = Math.hypot(ix, iy) > 0.12;
  if(P.moving){
    P.anim += dt * (P.flying > 0 ? 4 : P.escaping > 0 ? 2 : 11);
    if(Math.abs(ix) >= Math.abs(iy)) P.dir = ix > 0 ? 2 : 1;
    else P.dir = iy > 0 ? 0 : 3;
  }
  if(P.swing > 0) P.swing = Math.max(0, P.swing - dt);
  if(P.flying > 0){
    P.flying = Math.max(0, P.flying - dt);
    P.flyTrail += dt;
    if(P.flyTrail > 0.03){
      P.flyTrail = 0;
      const wc = (currentWeapon() || WEAPONS[0]).color;
      addParticle(P.x + rnd(-10,10), P.y + rnd(-6,6), {
        vx: rnd(-25,25), vy: rnd(-25,25),
        life: 0.45, size: rnd(2,5), color: wc,
        type: 'dot', drag: 0.94
      });
      if(Math.random() < 0.5){
        addParticle(P.x + rnd(-16,16), P.y - 6 + rnd(-4,4), {
          vx: rnd(-40,40), vy: rnd(-10,30), life: 0.3, size: rnd(5,9),
          color: '235,250,255', type: 'line', angle: rnd(0, 6), drag: 0.9 });
      }
    }
  }
  if(P.escaping > 0){
    P.escaping = Math.max(0, P.escaping - dt);
    P.escapeTrail += dt;
    if(P.escapeTrail > 0.02){
      P.escapeTrail = 0;
      addParticle(P.x + rnd(-12,12), P.y - 26 + rnd(-12,12), {
        vx: rnd(-30,30), vy: rnd(-30,30),
        life: 0.5, size: rnd(4,10),
        color: '255,240,180', type: 'dot', drag: 0.92, grow: 4
      });
    }
    const hitR = 45;
    for(const e of state.enemies){
      if(e.dead || P.escapeHit.has(e)) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if(d < hitR + e.r){
        P.escapeHit.add(e);
        const dmg = G.atk * 3.5 * weaponAtkMul();
        const ea = Math.atan2(e.y - P.y, e.x - P.x);
        damageEnemy(e, dmg, ea, SKILL_LIBRARY[24]);
        effects.push({ type:'shockwave', x:e.x, y:e.y - 20, maxR:180,
          color:'255,240,180', life:0.45, maxLife:0.45, width:8 });
        fxSlash(e.x, e.y - 20, ea + Math.PI/2, 70, '255,255,240', 0.3, 6);
        fxPillar(e.x, e.y, 34, '255,245,200', 0.35, 20);
        shake(6, 0.2);
      }
    }
  }
  if(isNum(P.x) && isNum(P.y)) resolveCollision(P);
  if(!isNum(P.x) || !isNum(P.y)){
    const origin = BIOME_ORIGIN[state.biome] || { x: 0, y: 0 };
    P.x = origin.x; P.y = origin.y;
    state.camX = P.x - W/2; state.camY = P.y - H/2;
  }
}

function updateEnemy(e, dt){
  if(e.dead){ e.deadTimer -= dt; return; }
  if(!isNum(e.x) || !isNum(e.y)) return;
  if(e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt);
  if(e.frozen > 0){ e.frozen -= dt; if(e.frozen <= 0) e.frozen = 0; }
  const dx = P.x - e.x, dy = P.y - e.y;
  const d = Math.hypot(dx, dy);
  const canChase = state.grace <= 0 && state.t >= (e.calmUntil || 0);
  const chaseDist = e.elite ? 650 : 380;
  if(e.frozen > 0){
    e.chasing = false;
  } else if(canChase && d < chaseDist){
    e.chasing = true;
    const atkRange = e.elite ? 110 : (e.isHuman ? 200 : 46);
    const dm = curDiff();
    if(d > atkRange){
      const sp = (e.elite ? 105 : (e.isHuman ? 85 : 92)) * (1 + (dm - 1) * 0.11) * (e.refined ? 1.14 : 1);
      e.x += dx/d * sp * dt; e.y += dy/d * sp * dt;
    }
    if(e.isHuman && d < 500){
      e.spellCd -= dt;
      if(e.spellCd <= 0){
        e.spellCd = rnd(2.5, 4.0) * Math.max(0.6, 1 / Math.sqrt(dm));
        castEnemySpell(e, dx, dy, d);
      }
    }
    if(d <= atkRange + 5){
      e.atkCd -= dt;
      if(e.atkCd <= 0){
        e.atkCd = (e.elite ? 1.4 : 1.5) * Math.max(0.60, 1 / Math.sqrt(dm));
        damagePlayer(e);
        if(e.refined) fxSlash(P.x, P.y - 26, Math.atan2(dy, dx), 54, '255,200,140', 0.22, 4);
      }
    }
    if(e.elite){
      if(!e.enraged && e.hp < e.maxHp * 0.5){
        e.enraged = true;
        toast('「' + e.name + '」暴怒！');
        addFloat(e.x, e.y - 210, '暴怒', '#ff6070', true);
        effects.push({ type:'shockwave', x:e.x, y:e.y, maxR:300, color:'255,80,100',
          life:0.6, maxLife:0.6, width:14 });
        screenFlash('rgba(255,80,110,.35)', 420);
        shake(10, 0.4);
      }
      e.skillCd = (e.skillCd == null ? 4 : e.skillCd) - dt;
      if(e.skillCd <= 0 && d < 640){
        castBossSkill(e);
      }
      if(Math.random() < 0.3){
        const a = rnd(0, Math.PI*2), rr = rnd(50, 110);
        const bsk = SKILL_LIBRARY[BIOME_SKILL_ID(state.biome)];
        addParticle(e.x + Math.cos(a)*rr, e.y - 40 + Math.sin(a)*rr*0.6, {
          vx: -Math.cos(a)*30, vy: -rnd(20, 70), life: rnd(0.4, 0.8),
          size: rnd(3, 7), color: (bsk && bsk.fx) || '255,200,200',
          type: 'dot', drag: 0.96, grow: 3 });
      }
    }
  } else {
    e.chasing = false;
    e.wanderT -= dt;
    if(e.wanderT <= 0){
      e.wanderT = rnd(1.2, 3.2);
      e.wanderDir = rnd(0, Math.PI*2);
      e.wanderMove = Math.random() < 0.6;
    }
    if(e.wanderMove){
      e.x += Math.cos(e.wanderDir) * 32 * dt;
      e.y += Math.sin(e.wanderDir) * 32 * dt;
    }
  }
  if(isNum(e.x) && isNum(e.y)) resolveCollision(e);
}
function castEnemySpell(e, dx, dy, d){
  const angle = Math.atan2(dy, dx);
  if(e.spellType === 'fan'){
    const wcol = e.color.replace('#','');
    const rr = parseInt(wcol.substr(0,2),16) || 140;
    const gg = parseInt(wcol.substr(2,2),16) || 200;
    const bb = parseInt(wcol.substr(4,2),16) || 255;
    const cStr = rr+','+gg+','+bb;
    for(let k = 0; k < 12; k++){
      const a = angle + rnd(-0.5, 0.5);
      const sp = rnd(200, 320);
      addParticle(e.x, e.y - 20, {
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.35, size: 10, color: cStr,
        type: 'line', angle: a, drag: 0.88
      });
    }
    effects.push({ type:'fan', x:e.x, y:e.y - 20, angle, range:220, halfAngle: Math.PI/3,
      color: cStr, life:0.3, maxLife:0.3 });
    let diff = Math.abs(angle - Math.atan2(P.y - e.y, P.x - e.x));
    if(diff > Math.PI) diff = Math.PI*2 - diff;
    if(d < 220 && diff < Math.PI/3){
      damagePlayer({ atk: e.atk * 1.3, x: e.x, y: e.y });
    }
  } else if(e.spellType === 'fireball'){
    projectiles.push({
      x: e.x, y: e.y - 20,
      vx: Math.cos(angle) * 320, vy: Math.sin(angle) * 320,
      target: null, damage: e.atk * 1.6, life: 2.0,
      color: '255,140,200', r: 6, isEnemy: true,
      angle: angle + Math.PI/2, glowColor: '255,200,240'
    });
    fxGlow(e.x + Math.cos(angle)*24, e.y - 32, 24, '255,150,220', 0.35);
    fxBurst(e.x + Math.cos(angle)*24, e.y - 32, 6, 160, '255,180,240', { angle, spread: 0.5, size: 4, life: 0.3 });
  } else if(e.spellType === 'blink'){
    if(d > 100 && d < 450){
      const targetX = P.x - dx/d * 60;
      const targetY = P.y - dy/d * 60;
      const ox = e.x, oy = e.y;
      e.x = targetX; e.y = targetY;
      e.atkCd = 0.3;
      fxRing(ox, oy, 60, '150,80,200', 0.4, 3);
      fxRing(e.x, e.y, 60, '190,130,255', 0.4, 3);
      effects.push({ type:'ghost', x: ox, y: oy, color:'150,80,200', life:0.5, maxLife:0.5, kind: e.kind });
      fxBurst(e.x, e.y - 26, 12, 220, '190,130,255', { size: 5, life: 0.4 });
    }
  }
}

function updateCamera(dt){
  const tx = P.x - W/2, ty = P.y - H/2;
  if(!isNum(tx) || !isNum(ty)) return;
  state.camX += (tx - state.camX) * Math.min(1, dt*9);
  state.camY += (ty - state.camY) * Math.min(1, dt*9);
}
function updateInteract(){
  state.nearHerb = null;
  let hd = 78;
  for(const h of state.herbs){
    if(!h.alive) continue;
    const d = Math.hypot(h.x - P.x, h.y - P.y);
    if(d < hd){ hd = d; state.nearHerb = h; }

function updateEffects(dt){
  for(let i = effects.length - 1; i >= 0; i--){
    effects[i].life -= dt;
    if(effects[i].life <= 0) effects.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y += f.vy * dt;
    if(f.life <= 0) floats.splice(i, 1);
  }
  for(let i = beams.length - 1; i >= 0; i--){
    beams[i].life -= dt;
    if(beams[i].life <= 0) beams.splice(i, 1);
  }
  if(state.shakeT > 0) state.shakeT = Math.max(0, state.shakeT - dt);
  if(state.shield > 0){
    state.shieldTime -= dt;
    if(state.shieldTime <= 0){ state.shield = 0; state.shieldTime = 0; }
  }
}
function updateSkillUI(){
  for(let slot = 0; slot < 8; slot++){
    const btn = $('skillBtn' + slot);
    if(!btn) continue;
    const mask = btn.querySelector('.cdMask');
    const nameEl = btn.querySelector('.skName');
    const mpEl = btn.querySelector('.skMp');
    if(!mask || !nameEl || !mpEl) continue;
    const skillId = G.equipped[slot];
    if(skillId == null){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = ''; mpEl.textContent = ''; continue;
    }
    const sk = SKILL_LIBRARY[skillId];
    if(!sk || !G.unlockedSkills.has(skillId)){
      btn.classList.add('empty'); btn.classList.remove('cooling','noMp');
      mask.style.height = '0%'; nameEl.textContent = '未悟'; mpEl.textContent = ''; continue;
    }
    btn.classList.remove('empty');
    nameEl.textContent = sk.key;
    mpEl.textContent = sk.mp + '灵';
    const cd = G.cd[skillId] || 0;
    if(cd > 0){
      mask.style.height = (cd / sk.cd * 100) + '%';
      btn.classList.add('cooling');
    } else {
      mask.style.height = '0%'; btn.classList.remove('cooling');
    }
    if(G.mp < sk.mp) btn.classList.add('noMp'); else btn.classList.remove('noMp');
  }
}

let mapOpen = false;
function toggleMap(){ if(!state.started) return; if(mapOpen) closeMap(); else openMap(); }
function openMap(){ if(mapOpen) return; mapOpen = true; renderMap(); const el = $('mapOverlay'); if(el) el.style.display = 'flex'; }
function closeMap(){ mapOpen = false; const el = $('mapOverlay'); if(el) el.style.display = 'none'; }
function renderMap(){
  const grid = $('mapGrid'); if(!grid) return;
  grid.innerHTML = '';
  BIOMES.forEach((bio, i) => {
    const unlocked = G.realm >= bio.realmReq;
    const isCurrent = state.biome === i;
    const card = document.createElement('div');
    card.className = 'mapCard' + (unlocked ? '' : ' locked') + (isCurrent ? ' current' : '');
    const reqName = REALM_NAMES[bio.realmReq] || '化神';
    const skillId = BIOME_SKILL_ID(i);
    const skillUnlocked = G.unlockedSkills.has(skillId);
    const skillName = SKILL_LIBRARY[skillId] ? SKILL_LIBRARY[skillId].name : '';
    const boss = BOSS_BY_BIOME[i];
    const weapon = WEAPON_MAP[i + 1];
    const weaponOwned = weapon && G.weapons.has(weapon.id);
    const isNew = unlocked && !G.seenBiomes.has(i);
    const nextBio = BIOMES[i + 1];
    card.innerHTML = `
      <div class="mcHeader"><span class="mcEmoji">${BIOME_EMOJIS[i] || '🗺️'}</span><span class="mcName">${bio.name}</span></div>
      <div class="mcReq">难度 ${diffLabel(i)} · 需 ${reqName}期${isCurrent ? ' · 当前所在' : ''}${isNew ? ' · <b style="color:#ffd870">新</b>' : ''}</div>
      <div class="mcDesc">${bio.desc}</div>
      <div class="mcDesc" style="color:#ffb8c8">妖王 · ${boss ? boss.name : '未现'}</div>
      <div class="mcDesc" style="color:${skillUnlocked?'#89e2ce':'rgba(200,190,170,.45)'}">功法：${skillUnlocked ? '「' + skillName : '击败妖王可得'}</div>
      <div class="mcDesc" style="color:${weaponOwned?'#ffd870':'rgba(200,190,170,.45)'}">神兵：${weaponOwned ? '「' + weapon.name : '击败妖王可得'}</div>
      ${nextBio ? `<div class="mcDesc" style="color:rgba(255,200,120,.5)">下一境 · ${nextBio.name}（${REALM_NAMES[nextBio.realmReq]}期）</div>` : ''}
      ${unlocked ? '' : `<div class="mcLock">🔒 需 ${REALM_NAMES[bio.realmReq]}期修为</div>`}
    `;
    if(unlocked && !isCurrent) card.onclick = () => teleportToBiome(i);
    else if(isCurrent) card.onclick = () => closeMap();
    grid.appendChild(card);
  });
}
function teleportToBiome(bi){
  if(!state.started) return;
  if(bi < 0 || bi >= BIOMES.length) return;
  const bio = BIOMES[bi];
  if(G.realm < bio.realmReq){ toast('境界不足'); return; }
  state.biome = bi;
  const origin = BIOME_ORIGIN[bi];
  P.x = origin.x; P.y = origin.y;
  P.flying = 0; P.swing = 0; P.escaping = 0;
  state.camX = P.x - W/2; state.camY = P.y - H/2;
  chunks.clear(); lakeCache.clear();
  state.enemies = []; state.herbs = [];
  state.grace = 3;

let skillBookOpen = false;
let selectedSlot = 0;
function toggleSkillBook(){ if(!state.started) return; if(skillBookOpen) closeSkillBook(); else openSkillBook(); }
function openSkillBook(){ if(skillBookOpen) return; skillBookOpen = true; selectedSlot = 0; renderSkillBook(); const el = $('skillBookOverlay'); if(el) el.style.display = 'flex'; }
function closeSkillBook(){ skillBookOpen = false; const el = $('skillBookOverlay'); if(el) el.style.display = 'none'; }
function renderSkillBook(){
  const slotsEl = $('skillBookSlots');
  const libEl = $('skillBookLibrary');
  if(!slotsEl || !libEl) return;
  slotsEl.innerHTML = ''; libEl.innerHTML = '';
  for(let i = 0; i < 8; i++){
    const skillId = G.equipped[i];
    const sk = skillId != null ? SKILL_LIBRARY[skillId] : null;
    const b = document.createElement('button');
    b.className = 'skSlotBtn' + (i === selectedSlot ? ' selected' : '');
    b.innerHTML = `
      <span class="slotNum">${i+1}</span>
      <span class="slotKey" style="color:${sk?`rgba(${sk.color},1)`:'#555'}">${sk?sk.key:''}</span>
      <span class="slotName">${sk?sk.name:''}</span>
    `;
    b.onclick = () => { selectedSlot = i; renderSkillBook(); };
    slotsEl.appendChild(b);
  }
  for(const id of ALL_SKILL_IDS){
    const sk = SKILL_LIBRARY[id];
    if(!sk) continue;
    const unlocked = G.unlockedSkills.has(id);
    const equippedIn = G.equipped.indexOf(id);
    const card = document.createElement('div');
    card.className = 'skCard' + (equippedIn >= 0 ? ' equipped' : '') + (unlocked ? '' : ' locked');
    let tag = '';
    if(equippedIn >= 0) tag = `<div class="cardTag">已装备 · 位 ${equippedIn+1}</div>`;
    else if(!unlocked){
      if(id >= 14 && id <= 23) tag = `<div class="cardLock">🔒 击败${BIOMES[id-14].name}妖王</div>`;
      else if(sk.unlockLv) tag = `<div class="cardLock">🔒 需${REALM_NAMES[Math.floor(sk.unlockLv/9)]}期/div>`;
      else tag = `<div class="cardLock">🔒 未解锁/div>`;
    }
    card.innerHTML = `
      <div class="cardTop"><span class="cardKey" style="color:${unlocked?`rgba(${sk.color},1)`:'#888'}">${sk.key}</span><span class="cardName">${sk.name}</span></div>
      <div class="cardStats">耗灵 ${sk.mp} · CD ${sk.cd}s</div>${tag}
    `;
    if(unlocked){
      card.onclick = () => {
        const otherSlot = G.equipped.indexOf(id);
        if(otherSlot >= 0 && otherSlot !== selectedSlot){
          const tmp = G.equipped[selectedSlot];
          G.equipped[selectedSlot] = id;
          G.equipped[otherSlot] = tmp;
        } else if(otherSlot !== selectedSlot){
          G.equipped[selectedSlot] = id;
        }
        renderSkillBook(); updateSkillUI(); save();
      };
    }
    libEl.appendChild(card);
  }
}

let bagTick = 0;
function renderBagPreviewTick(grid){
  cancelAnimationFrame(bagTick);
  const step = () => {
    if(!bagOpen) return;
    let any = false;
    grid.querySelectorAll('canvas.wprev').forEach(cv => {
      const w = WEAPON_MAP[cv.__wid];
      if(!w) return;
      any = true;
      try { drawWeaponPreview(cv, w); } catch(e){}
    });
    if(any) bagTick = requestAnimationFrame(step);
  };
  bagTick = requestAnimationFrame(step);
}
function drawWeaponPreview(cv, w){
  if(!cv) return;
  cv.__wid = w.id;
  cv.dataset.wid = String(w.id);
  const cw = cv.width, ch = cv.height;
  cv.clearRect(0, 0, cw, ch);
  const bg = cv.createRadialGradient(cw/2, ch/2, 6, cw/2, ch/2, cw*0.5);
  bg.addColorStop(0, `rgba(${w.color},0.18)`);
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  cv.fillStyle = bg; cv.fillRect(0, 0, cw, ch);
  const prev = ctx;
  ctx = cv;
  try {
    ctx.save();
    ctx.translate(cw/2, ch/2);
    ctx.rotate(-Math.PI/4 * 0.85);
    const t = state.t || 0;
    ctx.shadowColor = `rgba(${w.color},0.9)`;
    ctx.shadowBlur = 18;
    drawBladeBody(w, 82, 12.5, t, 1);
    ctx.shadowBlur = 0;
    ctx.restore();
    for(let i = 0; i < 7; i++){
      const a = t * 1.4 + i * Math.PI*2/7;
      const rr = 70 + Math.sin(t*3 + i)*8;
      ctx.fillStyle = `rgba(${w.color},${0.35 + 0.4*Math.sin(t*4 + i)})`;
      ctx.beginPath(); ctx.arc(cw/2 + Math.cos(a)*rr, ch/2 + Math.sin(a)*rr*0.55, 2.2, 0, 7); ctx.fill();
    }
  } finally {
    ctx = prev;
  }
}

function advanceRealm(){

}

function drawGround(){
  const T = 80;
  const x0 = Math.floor(state.camX / T) - 1;
  const x1 = Math.ceil((state.camX + W) / T) + 1;
  const y0 = Math.floor(state.camY / T) - 1;
  const y1 = Math.ceil((state.camY + H) / T) + 1;
  if(!isFinite(x0) || !isFinite(x1) || !isFinite(y0) || !isFinite(y1)) return;
  if(x1 - x0 > 200 || y1 - y0 > 200) return;
  const bio = BIOMES[state.biome] || BIOMES[0];
  for(let ty = y0; ty < y1; ty++){
    for(let tx = x0; tx < x1; tx++){
      const h = hash2(tx, ty);
      ctx.fillStyle = `hsl(${bio.h1 + h*bio.h2},${bio.s1 + h*bio.s2}%,${bio.l1 + h*bio.l2}%)`;
      ctx.fillRect(tx*T, ty*T, T+1, T+1);
      if(h > 0.38){
        ctx.fillStyle = `hsla(${bio.h1 + h*bio.h2 + 14},${bio.s1 + h*bio.s2 + 8}%,${bio.l1 + h*bio.l2 + 10}%,.6)`;
        for(let i=0;i<3;i++){
          const px = tx*T + hash2(tx*3+i, ty*7+i*13) * T;
          const py = ty*T + hash2(tx*11+i*5, ty*3+i) * T;
          ctx.fillRect(px, py, 2.5, 8);
        }
      }
    }
  }
}

  else if(lake.type === 'blood'){ c0='#8a1a2a'; c1='#4a0818'; c2='rgba(30,4,10,.8)'; }
  else if(lake.type === 'ice'){ c0='#bfe8f8'; c1='#7fb8d8'; c2='rgba(150,200,230,.75)'; }
  else if(lake.type === 'spirit'){ c0='#ffd870'; c1='#e8a840'; c2='rgba(120,80,20,.6)'; }

  const g = ctx.createRadialGradient(0,0,0,0,0,Math.max(1,lake.rx));

  if(lm.rot) ctx.rotate(lm.rot);
  ctx.scale(sc, sc);
  const t = state.t, seed = lm.seed || 0, v = lm.variant | 0;
  switch(lm.kind){
    case 'house':    bHouse(s, t, seed, v); break;
    case 'watch':    bWatch(s, t, seed, v); break;
    case 'wall':     bWall(s, t, seed, v); break;
    case 'gate':     bGate(s, t, seed, v); break;

function withAlpha(rgb, a){
  const s = String(rgb || '255,255,255');
  if(s.charAt(0) === '#') return 'rgba(' + hexToRgb(s) + ',' + a + ')';
  return 'rgba(' + s + ',' + a + ')';
}
